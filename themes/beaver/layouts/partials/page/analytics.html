{{ if and (not hugo.IsServer) (site.Params.microsoftClarity) }}
  <!-- Microsoft Clarity (session recordings; required by the course validation
       pilot). Enable by setting microsoftClarity = "<project-id>" under
       [params] in hugo.toml after creating the project at clarity.microsoft.com. -->
  <script type="text/javascript">
    // Skip localhost / LAN serving so local test runs never pollute recordings.
    if (!/^(localhost|127\.|192\.168\.|0\.0\.0\.0)/.test(location.hostname)) {
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "{{ site.Params.microsoftClarity }}");
    }
  </script>
{{ end }}
{{ if and (not hugo.IsServer) (site.Params.googleAnalytics) }}
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.googleAnalytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    {{ if site.Params.privacyCompliant }}
      {{/* 2026-07-30 (Paul): analytics consent granted by default - the old
           denied-by-default had no banner to ever grant it, so GA4 ran
           permanently in cookieless-ping mode and the course funnel recorded
           nothing. Ads storage stays denied (we run no ads). If a consent
           banner ships later (e.g. Google Privacy & Messaging CMP), flip
           analytics_storage back to 'denied' as the pre-consent default. */}}
      gtag('consent', 'default', {
        'analytics_storage': 'granted',
        'ad_storage': 'denied'
      });
    {{ end }}
    gtag('js', new Date());
    gtag('config', '{{ site.Params.googleAnalytics }}');
    {{/* Conversion event (seo-review-2026-08-13 §6 #1): any click through to the
         contact page. Mark contact_cta_click as a key event in GA4 admin. */}}
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('a[href*="/contact-us"]') : null;
      if (!el) return;
      gtag('event', 'contact_cta_click', {
        link_url: el.getAttribute('href') || '',
        transport_type: 'beacon'
      });
    }, { passive: true });
    {{/* Conversion event (2608 phase 0.1): contact / free-consultation form
         submit. The form posts to an external service (data-lead-form on
         partials/page/contact-form.html), so hook the submit event. Mark
         generate_lead as a key event in GA4 admin. */}}
    document.addEventListener('submit', function (e) {
      if (!(e.target && e.target.hasAttribute && e.target.hasAttribute('data-lead-form'))) return;
      // One-shot per pageview: the form targets _blank, so it stays filled
      // and a double-submit would double-count the lead.
      if (e.target.hasAttribute('data-lead-sent')) return;
      e.target.setAttribute('data-lead-sent', '1');
      gtag('event', 'generate_lead', {
        transport_type: 'beacon'
      });
    }, true);
    {{/* CTA clicks (2608 phase 0.1): any element carrying data-cta-location
         (hero / section / blog-index / tag-index / article-end) reports which
         CTA earned the click. */}}
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-cta-location]') : null;
      if (!el) return;
      gtag('event', 'cta_click', {
        location: el.getAttribute('data-cta-location'),
        link_url: el.getAttribute('href') || '',
        transport_type: 'beacon'
      });
    }, { passive: true });
    {{ if and .IsPage (eq .Section "blog") }}
      {{/* Scroll-depth milestones on blog posts (2608 phase 0.1). GA4 enhanced
           measurement only records 90%; this adds the 25/50/75 read-depth
           curve. Each milestone fires once per page view (marks are consumed),
           and the listener removes itself after the last one. */}}
      (function () {
        var marks = [25, 50, 75, 90];
        function depth() {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          if (max <= 0) return;
          var pct = (window.scrollY / max) * 100;
          while (marks.length && pct >= marks[0]) {
            gtag('event', 'scroll_depth', {
              percent_scrolled: marks.shift(),
              transport_type: 'beacon'
            });
          }
          if (!marks.length) window.removeEventListener('scroll', depth);
        }
        window.addEventListener('scroll', depth, { passive: true });
      })();
    {{ end }}
  </script>
{{ end }}
