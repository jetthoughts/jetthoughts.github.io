---
name: 'Setup Hugo with caches'
description: 'Install Hugo + Bun + Node, cache dependencies and build artifacts'
# Toolchain pins here are the CI source of truth and must match .mise.toml -
# test/unit/toolchain_pins_test.rb fails when they drift.
inputs:
  hugo-version:
    description: 'Hugo version'
    default: '0.164.0'
  environment:
    description: 'Hugo build environment'
    default: 'production'
  output-dir:
    description: 'Hugo build output directory'
    default: '_dest/public-test'
  base-url:
    description: 'Hugo base URL (default: /)'
    default: '/'
  build:
    description: 'Run bin/hugo-build after setup (set "false" for callers with their own build steps, e.g. the Pages deploy)'
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: jetthoughts/actions-hugo@v3
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: true

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.13

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
        restore-keys: ${{ runner.os }}-bun-

    - run: bun install --frozen-lockfile
      shell: bash

    # Hugo 0.164 loads Node tools through node:module registerHooks,
    # which Bun does not implement — the old bun→node symlink now fails
    # with "Export named 'registerHooks' not found". Use real Node 22
    # (>=22.15 has registerHooks); the --permission flags Hugo passes are
    # satisfied by [security.node.permissions] allowRead in hugo.toml.
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # hugo_stats.json is cached deliberately: it is gitignored, and without it
    # every run pays bin/hugo-build's ~52s PurgeCSS warm-up double-build. The
    # key hashes config/** (the real config location - the old key hashed
    # nonexistent root hugo.toml/hugo.dev.toml, so config-only changes reused
    # a stale resources/_gen).
    - name: Cache Hugo build
      uses: actions/cache@v5
      with:
        path: |
          /tmp/hugo_cache
          resources/_gen
          _dest
          hugo_stats.json
        key: ${{ runner.os }}-hugo-${{ inputs.environment }}-${{ hashFiles('config/**', 'postcss.config.js', 'package.json', '**/bun.lockb', 'themes/**', 'layouts/**', 'content/**') }}
        restore-keys: |
          ${{ runner.os }}-hugo-${{ inputs.environment }}-
          ${{ runner.os }}-hugo-

    - name: Build Hugo site
      if: ${{ inputs.build == 'true' }}
      run: PATH="./node_modules/.bin:$PATH" bin/hugo-build
      shell: bash
      env:
        HUGO_CACHEDIR: /tmp/hugo_cache
        ENVIRONMENT: ${{ inputs.environment }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        BASE_URL: ${{ inputs.base-url }}
