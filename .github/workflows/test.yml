---
name: Screenshot Tests

# Visual regression in CI runs on the SAME pinned rendering stack that
# records the linux/ baselines: Chrome for Testing (.dev/cft-version) +
# .dev/fonts.conf + pinned font packages, installed by bin/setup-test-env.
# Without that stack the runner's floating Chrome renders different pixels
# (the 3-28% divergence that got the old CI screenshot job removed in
# PR #386) - and record mode would silently overwrite the canonical
# baselines with unpinned renders.
#
# PR runs are REPORT-ONLY during the soak period (continue-on-error) -
# flip that flag off to make the gate blocking.

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Run screenshot tests (slow, requires Hugo build)'
        type: boolean
        default: true
      update-baselines:
        description: 'Re-record screenshot baselines and commit'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'themes/**'
      - 'config/**'
      - 'postcss.config.js'
      - 'test/fixtures/screenshots/**'
      - 'test/system/**'
      - '.dev/cft-version'
      - '.dev/fonts.conf'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshot Tests
    if: ${{ github.event_name == 'pull_request' || inputs.screenshots || inputs.update-baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only soak for the PR gate: failures upload the diff report and
    # comment on the PR but do not block merging. Remove after the soak.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: snap-diff/snap_diff-capybara/.github/actions/setup-ruby-and-dependencies@5ee298fbc3c1e070c78e3d83862ffd3228204214
        with:
          ruby-version: '4.0'
          cache-apt-packages: true

      # BUILD_DRAFTS: the codeblock-styles fixture the screenshot tests visit
      # is a draft post; local runs build with --buildDrafts but bin/hugo-build
      # only passes it when this env is set (2026-07-31: every CI visual run
      # 404'd the fixture - "File not found: /blog/codeblock-styles-fixture/").
      - uses: ./.github/actions/setup-hugo
        env:
          BUILD_DRAFTS: '1'

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: ~/.cache/jt-cft
          key: cft-${{ hashFiles('.dev/cft-version') }}

      - name: Install pinned rendering stack (CfT + fonts + fontconfig)
        run: |
          bin/setup-test-env
          eval "$(bin/setup-test-env --print-env)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> "$GITHUB_ENV"

      # PRs run the critical subset (the visual gate); manual dispatch runs
      # the full suite for master-coverage sweeps.
      - name: Run screenshot tests
        if: ${{ github.event_name == 'pull_request' || !inputs.update-baselines }}
        run: bundle exec rake ${{ github.event_name == 'pull_request' && 'test:critical' || 'test' }}
        env:
          PRECOMPILED_ASSETS: '1'
          HUGO_DEFAULT_PATH: _dest/public-test

      - name: Record baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}
        run: FORCE_SCREENSHOT_UPDATE=true bundle exec rake test
        env:
          PRECOMPILED_ASSETS: '1'
          HUGO_DEFAULT_PATH: _dest/public-test
          # Record mode intentionally dirties the fixtures as it runs.
          ALLOW_DIRTY_SCREENSHOTS: '1'

      - name: Commit updated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/screenshots/
          git diff --staged --quiet || git commit -m "chore: update screenshot baselines [ci skip]"
          git push

      - name: Upload screenshot report
        if: failure()
        uses: snap-diff/snap_diff-capybara/.github/actions/upload-screenshots@5ee298fbc3c1e070c78e3d83862ffd3228204214
        with:
          name: screenshots
          report-path: test/fixtures/screenshots
          pr-comment: 'true'
