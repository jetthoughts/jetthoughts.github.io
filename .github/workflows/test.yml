---
name: Screenshot Tests

# Visual regression in CI runs on the SAME pinned rendering stack that
# records the linux/ baselines: Chrome for Testing (.dev/cft-version) +
# .dev/fonts.conf + pinned font packages, installed by bin/setup-test-env.
# Without that stack the runner's floating Chrome renders different pixels
# (the 3-28% divergence that got the old CI screenshot job removed in
# PR #386) - and record mode would silently overwrite the canonical
# baselines with unpinned renders.
#
# PR runs are REPORT-ONLY during the soak period (continue-on-error) -
# flip that flag off to make the gate blocking.

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Run screenshot tests (slow, requires Hugo build)'
        type: boolean
        default: true
      update-baselines:
        description: 'Re-record screenshot baselines and commit'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'themes/**'
      # root-level template/asset overrides change rendering just like
      # their themes/ counterparts
      - 'layouts/**'
      - 'assets/**'
      - 'config/**'
      - 'postcss.config.js'
      - 'test/fixtures/screenshots/**'
      - 'test/system/**'
      - 'test/support/**'
      - '.dev/cft-version'
      - '.dev/fonts.conf'
      # the gate must test its own harness changes
      - '.github/workflows/test.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshot Tests
    if: ${{ github.event_name == 'pull_request' || inputs.screenshots || inputs.update-baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only soak for the PR gate: failures upload the diff report and
    # comment on the PR but do not block merging. Remove after the soak.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      # PR events use the default checkout (the PR *merge* commit): testing
      # the head branch alone misses conflicts with the base and breaks on
      # fork PRs (head_ref doesn't exist in this repo). Record dispatches
      # check out the real branch ref so the baseline commit can be pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}

      - uses: snap-diff/snap_diff-capybara/.github/actions/setup-ruby-and-dependencies@5ee298fbc3c1e070c78e3d83862ffd3228204214
        with:
          ruby-version: '4.0'
          cache-apt-packages: true

      # BUILD_DRAFTS: the codeblock-styles fixture the screenshot tests visit
      # is a draft post; local runs build with --buildDrafts but bin/hugo-build
      # only passes it when this env is set (2026-07-31: every CI visual run
      # 404'd the fixture - "File not found: /blog/codeblock-styles-fixture/";
      # evidence: actions/runs/30629929407).
      - uses: ./.github/actions/setup-hugo
        env:
          BUILD_DRAFTS: '1'

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: ~/.cache/jt-cft
          key: cft-${{ hashFiles('.dev/cft-version') }}

      - name: Install pinned rendering stack (CfT + fonts + fontconfig)
        run: |
          bin/setup-test-env
          eval "$(bin/setup-test-env --print-env)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> "$GITHUB_ENV"

      # PRs run the SMOKE tier (17 basics+bummers, ~30s on CI) to stay under
      # the CI minute budget; manual dispatch runs the full suite for
      # master-coverage sweeps. Fuller coverage lives in the developer's local
      # gates (bin/qtest --changed per change, bin/test critical at PR prep) -
      # smoke on CI is the safety net, not the whole net.
      - name: Run screenshot tests
        if: ${{ github.event_name == 'pull_request' || !inputs.update-baselines }}
        run: bundle exec rake ${{ github.event_name == 'pull_request' && 'test:smoke' || 'test' }}
        env:
          PRECOMPILED_ASSETS: '1'
          HUGO_DEFAULT_PATH: _dest/public-test

      # test:system, not the full `rake test`: recording only rewrites
      # screenshot baselines, and a failing unit test used to abort the run
      # AFTER 15+ min of recording, discarding every recorded PNG.
      - name: Record baselines
        id: record
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}
        run: FORCE_SCREENSHOT_UPDATE=true bundle exec rake test:system
        env:
          PRECOMPILED_ASSETS: '1'
          HUGO_DEFAULT_PATH: _dest/public-test
          # Record mode intentionally dirties the fixtures as it runs.
          ALLOW_DIRTY_SCREENSHOTS: '1'

      # always(): freshly recorded baselines must be committed even when a
      # test failed mid-run (a red test does not invalidate the OTHER pages'
      # recordings). Gated on the record step actually having run, and the
      # commit is a no-op when nothing changed.
      - name: Commit updated baselines
        if: ${{ always() && steps.record.outcome != 'skipped' && github.event_name == 'workflow_dispatch' && inputs.update-baselines }}
        run: |
          if [ -z "$(git status --porcelain test/fixtures/screenshots)" ]; then
            echo "no baseline changes recorded - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/screenshots/
          git diff --staged --quiet || git commit -m "chore: update screenshot baselines [ci skip]"
          # The record run takes ~17 min - master routinely moves underneath it
          # and a plain push gets rejected non-fast-forward (run 30632854418
          # recorded everything, then lost it all at push). Baseline PNGs don't
          # conflict with content commits, so rebase-and-retry is safe.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              pushed=1
              break
            fi
            echo "push attempt $i failed, retrying..."
            [ "$i" -lt 3 ] && sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push recorded baselines after 3 attempts"
            exit 1
          fi

      - name: Upload screenshot report
        if: failure()
        uses: snap-diff/snap_diff-capybara/.github/actions/upload-screenshots@5ee298fbc3c1e070c78e3d83862ffd3228204214
        with:
          name: screenshots
          report-path: test/fixtures/screenshots
          pr-comment: 'true'
