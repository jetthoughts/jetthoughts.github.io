# https://gohugo.io/hosting-and-deployment/hosting-on-github/

on:
  workflow_call:

env:
  HUGO_ENVIRONMENT: production

  # Stalled-fetch guard (actions/checkout#2441). Measured across the last 40
  # publish runs on 2026-08-20: 137 of 170 checkout steps finished in 12-19s,
  # but 13 hung with ZERO fetch output until the job cap killed them. The bad
  # durations cluster on 599s and 899s - which ARE the 10- and 15-minute
  # timeout-minutes values, so those steps never finished slowly, they never
  # finished at all. Evidence: run 32407671265 logs `git fetch` at 19:15:42
  # and the very next line is "The operation was canceled" at 19:30:41.
  # It is NOT a size problem - a healthy checkout of this repo is 12s, and
  # run 32414801788 hung for 10 min on an already-shallow `--depth=1` fetch.
  #
  # These two make git abort a transfer that has moved <1 KB/s for 30s,
  # turning the silent hang into an error - and actions/checkout already
  # retries a FAILED fetch 3 times (src/git-command-manager.ts wraps fetch
  # in retryHelper). So a stall costs ~30s and self-heals instead of
  # burning the job. A real transfer never trips it; even an awful link
  # beats 1 KB/s.
  #
  # Passed as GIT_CONFIG_* env, NOT `git config --global`: checkout
  # overrides HOME before it runs git ("Temporarily overriding HOME=..." in
  # its own log), so a global config set by an earlier step is invisible to
  # it. Reusable workflows do not inherit the caller's env, and neither do
  # sibling workflow files - every workflow that checks out carries its own
  # copy, pointing back here.
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: http.lowSpeedLimit
  GIT_CONFIG_VALUE_0: '1000'
  GIT_CONFIG_KEY_1: http.lowSpeedTime
  GIT_CONFIG_VALUE_1: '30'


jobs:
  build:
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.pages.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is REQUIRED - hugo.toml sets enableGitInfo, and
          # .Lastmod feeds article:modified_time and schema dateModified.
          # But this repo's pack is 1.70 GiB, and since 2026-05-19 EU runners
          # have been stalling silently inside "Fetching the repository"
          # (actions/checkout#2441, still open upstream) - three such stalls
          # in one session on 2026-08-20, all killed by timeout-minutes, all
          # cleared by a plain re-run.
          #
          # filter: blob:none = blobless clone. Commits and trees come down
          # in full (so GitInfo still resolves every path), and HISTORICAL
          # file contents are skipped; the working tree's own blobs are
          # fetched once during checkout. Measured 2026-08-20: bare blobless
          # clone 4.7 MB in 1.1s vs a 1.70 GiB pack, and
          # `git log -1 -- content/blog/<post>/index.md` still returned the
          # right commit date in 0.02s with zero blobs fetched.
          #
          # This is a MITIGATION, not a cure - it cuts what we ask for, it
          # cannot fix an upstream stall. The stall itself is handled by the
          # GIT_CONFIG_* low-speed guard in this file's `env:` block, which
          # makes a hung fetch fail fast so checkout retries it; the manual
          # re-run rule stays as the last resort.
          #
          # fetch-depth: 0 is NOT reducible to a shallow fetch here -
          # enableGitInfo (config/_default/hugo.toml) needs the commit
          # history to resolve .Lastmod. Every OTHER job in this repo
          # already checks out at the default --depth=1.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Toolchain (Hugo/Bun/Node pins + caches) lives in the composite
      # action - the single source of truth for CI versions. This job
      # keeps its own build steps (minified Pages build to ./public),
      # so setup only.
      - uses: ./.github/actions/setup-hugo
        with:
          build: 'false'

      # Warm-up pass: hugo_stats.json does not exist on a cold runner, so the
      # first build's PurgeCSS runs against absent/partial stats and can purge
      # live classes (2026-07-19: a deploy shipped the inline nav bundle
      # without .sr-only - visible skip-link site-wide; same phenomenon
      # documented earlier for the fl-button safelist entries). The warm-up
      # generates complete stats; the [[build.cachebusters]] entry then makes
      # the real build reprocess every CSS bundle against them. Mirrors the
      # local "converged build x2" gate doctrine.
      # Skipped when the composite's Hugo cache restored a non-empty
      # hugo_stats.json (it is in the cache path list) - that saves ~52s on
      # warm runs while keeping the cold-runner guard intact.
      - name: Warm up hugo_stats.json (PurgeCSS race guard)
        run: |
          if [ -s hugo_stats.json ]; then
            echo "hugo_stats.json restored from cache ($(wc -c < hugo_stats.json) bytes) - skipping warm-up"
            exit 0
          fi
          PATH="./node_modules/.bin:app/bin:$PATH" hugo \
            --gc \
            --baseURL "https://jetthoughts.com/" \
            --environment production \
            --quiet || true
          test -s hugo_stats.json && echo "hugo_stats.json ready: $(wc -c < hugo_stats.json) bytes"

      - name: Build with Hugo
        run: |
          PATH="./node_modules/.bin:app/bin:$PATH" hugo \
            --minify \
            --gc \
            --cleanDestinationDir \
            --baseURL "https://jetthoughts.com/" \
            --environment production

      - name: Remove blog media from artifact
        run: |
          find public/blog/ -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' \) -delete
          echo "Cleaned blog media. Artifact size:"
          du -sh public/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
