  <path d="M64 152 H96 V72 H552 V136 M96 152 V232 H552 V168" stroke="#a38c86" stroke-width="1.5"/>
  <rect x="32" y="136" width="32" height="32" fill="#a38c86"/>
  <g fill="#18000f" stroke="#a38c86" stroke-width="1.5"><rect x="160.75" y="56.75" width="110.5" height="30.5"/><rect x="288.75" y="56.75" width="110.5" height="30.5"/></g>
  <g fill="#a38c86"><rect x="176" y="72" width="8" height="8"/><rect x="304" y="72" width="8" height="8"/></g>
  <rect x="160.75" y="200.75" width="238.5" height="62.5" fill="#18000f" stroke="#a38c86" stroke-width="1.5"/>
  <g fill="#a38c86"><rect x="184" y="224" width="16" height="16"/><rect x="232" y="224" width="16" height="16"/><rect x="280" y="224" width="16" height="16"/></g>
  <g fill="#18000f" stroke="#a38c86" stroke-width="1.5"><rect x="328.75" y="224.75" width="14.5" height="14.5"/><rect x="360.75" y="224.75" width="14.5" height="14.5"/></g>
  <g stroke="#cc342d" stroke-width="1.5">
