<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="On this website, 19 declared Ruby libraries install 81 packages, about four times; 15 declared JavaScript packages install 500, about thirty-three times">
  <rect width="640" height="320" fill="#0e0e14"/>
  <text x="24" y="38" fill="#dfe2eb" font-family="Inter,Helvetica,sans-serif" font-size="21" font-weight="600">What you ask for, and what arrives</text>
  <text x="24" y="62" fill="#8b90a0" font-family="Inter,Helvetica,sans-serif" font-size="15">Counted on this website, both toolchains, same day</text>

  <g font-family="Inter,Helvetica,sans-serif">
    <text x="24" y="110" fill="#ff8a7a" font-size="16" font-weight="700">RUBY</text>
    <rect x="24" y="122" width="60" height="34" rx="6" fill="#1c2026" stroke="#cc342d" stroke-width="2"/>
    <text x="54" y="145" fill="#dfe2eb" font-size="17" font-weight="700" text-anchor="middle">19</text>
    <text x="96" y="145" fill="#8b90a0" font-size="15">declared</text>
    <line x1="176" y1="139" x2="212" y2="139" stroke="#cc342d" stroke-width="2"/>
    <polygon points="212,133 224,139 212,145" fill="#cc342d"/>
    <rect x="234" y="122" width="76" height="34" rx="6" fill="#cc342d"/>
    <text x="272" y="145" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">81</text>
    <text x="322" y="145" fill="#8b90a0" font-size="15">installed</text>
    <text x="418" y="145" fill="#ff8a7a" font-size="17" font-weight="700">about 4x</text>

    <text x="24" y="212" fill="#c9a2fb" font-size="16" font-weight="700">JAVASCRIPT</text>
    <rect x="24" y="224" width="60" height="34" rx="6" fill="#1c2026" stroke="#a855f7" stroke-width="2"/>
    <text x="54" y="247" fill="#dfe2eb" font-size="17" font-weight="700" text-anchor="middle">15</text>
    <text x="96" y="247" fill="#8b90a0" font-size="15">declared</text>
    <line x1="176" y1="241" x2="212" y2="241" stroke="#a855f7" stroke-width="2"/>
    <polygon points="212,235 224,241 212,247" fill="#a855f7"/>
    <rect x="234" y="224" width="252" height="34" rx="6" fill="#a855f7"/>
    <text x="360" y="247" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">500</text>
    <text x="498" y="247" fill="#c9a2fb" font-size="17" font-weight="700">about 33x</text>
  </g>

  <line x1="24" y1="276" x2="616" y2="276" stroke="#2a2f3a" stroke-width="1"/>
  <text x="24" y="304" fill="#8b90a0" font-family="Inter,Helvetica,sans-serif" font-size="15">Build tools, not two comparable apps. Trust the gap, not the figures.</text>
</svg>
