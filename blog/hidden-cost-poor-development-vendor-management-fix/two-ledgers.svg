<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t">
  <title id="t">A dev-shop project keeps two ledgers: the invoice you negotiate, and a taller hidden ledger holding your own hours, the stalled launch, the knowledge premium, and paying twice.</title>
  <desc>A small blue card labeled The invoice ("the number you negotiated") next to a much taller red card labeled The hidden ledger with four lines: your own hours, the stalled launch, the knowledge premium, paying twice.</desc>
  <defs>
    <style>
      .h    { font-family: "Caveat","Patrick Hand","Comic Sans MS",cursive; }
      .title{ font-size: 32px; font-weight: 700; fill: #1a1a1a; }
      .sub  { font-size: 24px; fill: #666; font-style: italic; }
      .lbl  { font-size: 28px; font-weight: 700; }
      .row  { font-size: 23px; }
      .note { font-size: 20px; font-style: italic; }
      .basis{ font-size: 22px; fill: #666; font-style: italic; }
      .blue { fill: #eff6ff; stroke: #2b7fff; stroke-width: 2.5; }
      .red  { fill: #fef2f2; stroke: #e5484d; stroke-width: 2.5; }
    </style>
    <filter id="gb" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#2b7fff" flood-opacity="0.45"/></filter>
    <filter id="gr" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#e5484d" flood-opacity="0.45"/></filter>
  </defs>

  <text x="360" y="52" text-anchor="middle" class="h title">A dev-shop project keeps two ledgers</text>
  <text x="360" y="86" text-anchor="middle" class="h sub">you negotiate the first and pay the second</text>

  <!-- The invoice: small, tidy -->
  <g transform="translate(48,280) rotate(-0.5 146 60)">
    <rect width="292" height="120" rx="16" class="blue"/>
    <text x="146" y="50" text-anchor="middle" class="h lbl" fill="#2b7fff" filter="url(#gb)">The invoice</text>
    <text x="146" y="88" text-anchor="middle" class="h note" fill="#1d4ed8">the number you negotiated</text>
  </g>

  <!-- The hidden ledger: tall -->
  <g transform="translate(396,124) rotate(0.5 130 138)">
    <rect width="260" height="276" rx="16" class="red"/>
    <text x="130" y="52" text-anchor="middle" class="h lbl" fill="#e5484d" filter="url(#gr)">The hidden ledger</text>
    <text x="130" y="112" text-anchor="middle" class="h row" fill="#b91c1c">your own hours</text>
    <text x="130" y="156" text-anchor="middle" class="h row" fill="#b91c1c">the stalled launch</text>
    <text x="130" y="200" text-anchor="middle" class="h row" fill="#b91c1c">the knowledge premium</text>
    <text x="130" y="244" text-anchor="middle" class="h row" fill="#b91c1c">paying twice</text>
  </g>

  <text x="360" y="452" text-anchor="middle" class="h basis">The hidden one starts filling up the first week the project slips.</text>
</svg>
