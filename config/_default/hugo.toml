baseURL = "https://jetthoughts.com/"
canonifyURLs = true
locale = "en-us"
title = "JetThoughts"
copyright = "This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 International License."
theme = "beaver"
enableGitInfo = true  # Enable Git-based lastmod dates for sitemap
disableKinds = []

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  anchorLineNos = false
  codeFences = true
  guessSyntax = false
  hl_Lines = ""
  lineAnchors = ""
  lineNoStart = 1
  lineNos = false
  lineNumbersInTable = true
  noClasses = true
  style = "dracula"
  tabWidth = 4

# .Date falls back to the dev.to import field: 20 published, tagged posts
# carry only created_at, so under Hugo's default resolution they date as
# 0001-01-01 - sinking to the end of every ByDate list and rendering no date.
# Order stays date-first, so posts with both fields are unaffected.
[frontmatter]
  date = ["date", "created_at", "publishDate", "lastmod"]

[permalinks]
  pages = "/:slug/"
  blog = "/blog/:slug/"

[permalinks.term]
  tags = "/blog/tags/:slug/"

[taxonomies]
    tag = "tags"

[build]
  writeStats = true

  # PurgeCSS (postcss.config.js) reads ./hugo_stats.json; without this
  # cachebuster a stale postcss cache can resurrect purged rules between
  # builds (sprint-4 finding). Custom cachebusters REPLACE Hugo's defaults,
  # so the defaults are replicated below.
  [[build.cachebusters]]
    source = "hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(css|sass|scss)$"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[imaging]
  quality = 80
  resampleFilter = "box"
  anchor = "smart"

[minify]
  minifyOutput = true
  # Regex-based third-party audit crawlers cannot match unquoted attributes
  # (rel=canonical, name=description, type=application/ld+json), and report the
  # site as missing canonical tags and structured data. Both are present and
  # Google parses them fine - see seo-review-2026-08-13.md §8. This is a
  # cosmetic hedge for those tools, NOT an SEO fix.
  [minify.tdewolff.html]
    keepQuotes = true

[[redirects]]
  from = "/tags/:slug/"
  to = "/blog/tags/:slug/"
  status = 301

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5

[params.cdn]
  enabled = false  # enabled per-environment in config/production/hugo.toml
  rawBase = "raw.githubusercontent.com/jetthoughts/jetthoughts.github.io/master/content/"

[params]
  email="info@jetthoughts.com"
  phone="+1 754 216 9568"
  # Single source for tenure claims. JetThoughts was founded 2008-09-01
  # (corrected 2026-08-14 - the site had carried 2011 for years, which also
  # made every derived "N+ years" claim three years short). Anything stating
  # tenure must derive from this, not hardcode a year: `since {{ site.Params.foundingYear }}`
  # or `{{ sub now.Year (int site.Params.foundingYear) }}+ years`.
  foundingYear = 2008
  foundingDate = "2008-09-01"
  description="JetThoughts's expert team of developers and consultants has helped clients launch highly tailored projects, and we'd love to help you, too."
  testimonials_heading = "Most clients stay over 3 years. Some stayed beyond 6."
  testimonials_description = "Don't just take our word for it. See what our clients say about our services."

  # GA4 Analytics Configuration
  googleAnalytics = "G-T1N27FC30F"
  privacyCompliant = true

  # Microsoft Clarity session recordings (course validation pilot).
  # Project created by Paul 2026-07-30; snippet lives in partials/page/analytics.html.
  microsoftClarity = "xum05dgnec"

[[params.testimonials]]
