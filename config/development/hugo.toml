# Development Environment Configuration
# Overrides base config for fast development iteration

# Development-specific base URL
baseURL = "/"

# Hugo automatically enables these in development, but explicit is better
buildDrafts = true
buildExpired = true
buildFuture = true
relativeURLs = true

# Disable resource-intensive features for faster builds
# Note: Keeping "section" enabled so blog index pages work in development
disableKinds = ["RSS", "sitemap", "robotsTXT", "taxonomy", "term"]

# Skip expensive processing in development
ignoreFiles = ["\\.min\\.css$", "\\.min\\.js$"]

# DEV-ONLY: mount linkedin-posts/ as a content section for local pre-review.
# Declaring [[module.mounts]] replaces Hugo's default mount set, so the
# default mounts (content, static, layouts, data, assets, archetypes) must be
# re-declared here or the rest of the dev site breaks. Production and
# _default configs have NO [[module.mounts]] block, so this section never
# exists outside `hugo server`/`hugo --environment development` builds.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "linkedin-posts"
    target = "content/linkedin"
  [[module.mounts]]
    source = "linkedin-posts/icp-validation/assets"
    target = "static/linkedin-assets/icp-validation"
  [[module.mounts]]
    source = "linkedin-posts/course-promo/assets"
    target = "static/linkedin-assets/course-promo"
  [[module.mounts]]
    source = "linkedin-posts/personal/assets"
    target = "static/linkedin-assets/personal"

# Build optimizations for development speed
[build]
  # Skip Hugo stats generation (not needed for PurgeCSS in dev)
  writeStats = false
  # Use resource cache in development for faster rebuilds
  useResourceCacheWhen = "fallback"
  [build.buildStats]
    enabled = false

# Fast image processing for development
[imaging]
  # Much lower quality for faster processing in development
  quality = 50
  # Disable expensive image processing features in development
  resampleFilter = "NearestNeighbor"
  # Reduce anchor complexity
  anchor = "center"

# Disable minification in development
[minify]
  minifyOutput = false

# Watch mode optimizations
[server]
  # Optimize for file watching and fast rebuilds
  disableFastRender = false
  disableLiveReload = false
  watch = true
  headers = [
    {for = "/**", values = {Cache-Control = "no-cache, no-store, must-revalidate"}},
    {for = "/**", values = {Pragma = "no-cache"}},
    {for = "/**", values = {Expires = "0"}}
  ]

# Development-specific parameters
[params]
  # Enable development-specific features
  environment = "development"
  enableSearch = false
  enableCommentsCount = false
