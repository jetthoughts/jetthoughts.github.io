<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t">
  <title id="t">What proves demand: a real payment, not a pile of nice comments. A hundred "sounds great" comments cost nothing; one stranger paying is a stranger's real money.</title>
  <desc>Two cards. A red "A hundred comments" card - "sounds great", which is free to say and means nothing. A green "One payment" card - $97, card out, a stranger's real money. Basis: put a price on a one-page site, show strangers; only a payment counts.</desc>
  <defs>
    <style>
      .h    { font-family: "Caveat","Patrick Hand","Comic Sans MS",cursive; }
      .title{ font-size: 30px; font-weight: 700; fill: #1a1a1a; }
      .sub  { font-size: 23px; fill: #666; font-style: italic; }
      .head { font-size: 26px; font-weight: 700; }
      .mid  { font-size: 23px; fill: #1a1a1a; }
      .note { font-size: 18px; font-style: italic; }
      .basis{ font-size: 20px; fill: #666; font-style: italic; }
      .red  { fill: #fef2f2; stroke: #e5484d; stroke-width: 2.5; }
      .green{ fill: #f0f9f0; stroke: #2e7d32; stroke-width: 2.5; }
    </style>
    <filter id="gr" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#e5484d" flood-opacity="0.45"/></filter>
    <filter id="gg" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#2e7d32" flood-opacity="0.45"/></filter>
  </defs>

  <text x="360" y="44" text-anchor="middle" class="h title">What actually proves demand</text>
  <text x="360" y="76" text-anchor="middle" class="h sub">A real payment, not a pile of nice comments.</text>

  <!-- comments card -->
  <g transform="translate(0,0) rotate(-0.4 200 225)">
    <rect x="50" y="120" width="300" height="204" rx="16" class="red"/>
    <text x="200" y="172" text-anchor="middle" class="h head" fill="#e5484d" filter="url(#gr)">A hundred comments</text>
    <text x="200" y="222" text-anchor="middle" class="h mid">"Sounds great!"</text>
    <text x="200" y="268" text-anchor="middle" class="h note" fill="#b91c1c">free to say, means nothing</text>
  </g>

  <!-- payment card -->
  <g transform="translate(0,0) rotate(0.4 520 225)">
    <rect x="370" y="120" width="300" height="204" rx="16" class="green"/>
    <text x="520" y="172" text-anchor="middle" class="h head" fill="#2e7d32" filter="url(#gg)">One payment</text>
    <text x="520" y="222" text-anchor="middle" class="h mid">$97, card out</text>
    <text x="520" y="268" text-anchor="middle" class="h note" fill="#2e7d32">a stranger's real money</text>
  </g>

  <text x="360" y="452" text-anchor="middle" class="h basis">Put a price on a one-page site, show strangers. Only a payment counts.</text>
</svg>
