<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t">
  <title id="t">Put a real price on it before you build: the same $97 button worded two ways - one leads with what the buyer gets, one lowers the fear. A stranger's card beats a hundred comments.</title>
  <desc>Two identical green $97/month pay buttons. The left button reads "Cut no-shows in half" and leads with what the buyer gets. The right reads "Start your first month" and lowers the fear of clicking. Same price either way. Basis: a stranger pulling out a card beats a hundred "sounds great" comments.</desc>
  <defs>
    <style>
      .h    { font-family: "Caveat","Patrick Hand","Comic Sans MS",cursive; }
      .title{ font-size: 30px; font-weight: 700; fill: #1a1a1a; }
      .sub  { font-size: 23px; fill: #666; font-style: italic; }
      .btn-t{ font-size: 23px; font-weight: 700; fill: #fff; }
      .btn-p{ font-size: 20px; fill: #eafaea; }
      .cap  { font-size: 19px; fill: #444; font-style: italic; }
      .tie  { font-size: 21px; fill: #666; font-style: italic; }
      .basis{ font-size: 20px; fill: #666; font-style: italic; }
      .btn  { fill: #2e7d32; }
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2e7d32" flood-opacity="0.28"/></filter>
  </defs>

  <text x="360" y="44" text-anchor="middle" class="h title">Put a real price on it before you build</text>
  <text x="360" y="76" text-anchor="middle" class="h sub">Same $97 button - the wording changes who clicks.</text>

  <!-- Button A: benefit-led -->
  <rect x="64" y="150" width="258" height="86" rx="16" class="btn" filter="url(#sh)"/>
  <text x="193" y="192" text-anchor="middle" class="h btn-t">Cut no-shows in half</text>
  <text x="193" y="220" text-anchor="middle" class="h btn-p">$97 / month</text>
  <text x="193" y="272" text-anchor="middle" class="h cap">leads with what they get</text>

  <!-- Button B: low-friction -->
  <rect x="398" y="150" width="258" height="86" rx="16" class="btn" filter="url(#sh)"/>
  <text x="527" y="192" text-anchor="middle" class="h btn-t">Start your first month</text>
  <text x="527" y="220" text-anchor="middle" class="h btn-p">$97 / month</text>
  <text x="527" y="272" text-anchor="middle" class="h cap">makes the click feel safe</text>

  <text x="360" y="344" text-anchor="middle" class="h tie">Same $97 either way - only the words change.</text>

  <text x="360" y="452" text-anchor="middle" class="h basis">A stranger's card beats a hundred "sounds great" comments.</text>
</svg>
