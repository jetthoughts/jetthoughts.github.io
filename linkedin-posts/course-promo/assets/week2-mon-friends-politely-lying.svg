<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t">
  <title id="t">A compliment isn't demand: demand is what they already did about the problem. A friend's "I'd totally use it" costs nothing; a stranger already losing hours to the problem is real.</title>
  <desc>Two cards. A red "Compliment" card holds a friend saying "I'd totally use it" - costs them nothing. A green "Demand" card holds a stranger saying "I lose 3 hrs a week to this" - already paying the cost. Basis: if they can't name a cost in hours or money, there's nothing to build yet.</desc>
  <defs>
    <style>
      .h    { font-family: "Caveat","Patrick Hand","Comic Sans MS",cursive; }
      .title{ font-size: 30px; font-weight: 700; fill: #1a1a1a; }
      .sub  { font-size: 23px; fill: #666; font-style: italic; }
      .head { font-size: 25px; font-weight: 700; }
      .quote{ font-size: 22px; fill: #1a1a1a; }
      .note { font-size: 18px; font-style: italic; }
      .basis{ font-size: 20px; fill: #666; font-style: italic; }
      .red  { fill: #fef2f2; stroke: #e5484d; stroke-width: 2.5; }
      .green{ fill: #f0f9f0; stroke: #2e7d32; stroke-width: 2.5; }
    </style>
    <filter id="gr" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#e5484d" flood-opacity="0.45"/></filter>
    <filter id="gg" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#2e7d32" flood-opacity="0.45"/></filter>
  </defs>

  <text x="360" y="44" text-anchor="middle" class="h title">A compliment isn't demand</text>
  <text x="360" y="76" text-anchor="middle" class="h sub">Demand is what they already did about the problem.</text>

  <!-- Compliment card -->
  <g transform="translate(0,0) rotate(-0.4 200 225)">
    <rect x="50" y="120" width="300" height="206" rx="16" class="red"/>
    <text x="200" y="170" text-anchor="middle" class="h head" fill="#e5484d" filter="url(#gr)">Compliment</text>
    <text x="200" y="222" text-anchor="middle" class="h quote">"I'd totally use it"</text>
    <text x="200" y="268" text-anchor="middle" class="h note" fill="#b91c1c">a friend - costs them nothing</text>
  </g>

  <!-- Demand card -->
  <g transform="translate(0,0) rotate(0.4 520 225)">
    <rect x="370" y="120" width="300" height="206" rx="16" class="green"/>
    <text x="520" y="170" text-anchor="middle" class="h head" fill="#2e7d32" filter="url(#gg)">Demand</text>
    <text x="520" y="222" text-anchor="middle" class="h quote">"I lose 3 hrs a week to this"</text>
    <text x="520" y="268" text-anchor="middle" class="h note" fill="#2e7d32">a stranger - already paying</text>
  </g>

  <text x="360" y="452" text-anchor="middle" class="h basis">Can't name a cost in hours or money? Nothing to build yet.</text>
</svg>
