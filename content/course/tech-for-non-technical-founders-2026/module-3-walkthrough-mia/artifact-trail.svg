<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" role="img" aria-labelledby="m3-trail-title m3-trail-desc">
  <title id="m3-trail-title">Caught on paper, not in a build: Mia's Module 3 trail runs a one-page Product Brief to a no-go list to an outcome rewrite to a passed quality check.</title>
  <desc id="m3-trail-desc">A vertical trail of four artifact cards. 3.1 One-page Product Brief, Section 1 copied verbatim from the problem statement. 3.1 No-go list, longer than the build list, scope locked early. 3.2 Outcome rewrite, features rewritten as parent outcomes. 3.2 Quality check, the payoff, returned a PASS after 1 fail, 1 fix and 1 clean run. Basis: Mia's Module 3 deliverables, caught on paper.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .pill  { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .name  { font-size: 20px; font-weight: 700; fill: #121212; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
      .metric{ font-size: 30px; font-weight: 700; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="m3-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="612" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="596" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block -->
  <text x="360" y="50" text-anchor="middle" class="gk title">Caught on paper, not in a build</text>
  <text x="360" y="82" text-anchor="middle" class="gk msg">Mia's Module 3 trail - brief, no-go list, outcomes, check</text>

  <!-- Card 1: One-page Product Brief -->
  <g>
    <rect x="24" y="104" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="140" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="161" text-anchor="middle" class="gk pill">3.1</text>
    <text x="156" y="148" class="gk name">One-page Product Brief</text>
    <text x="156" y="174" class="sys note">Section 1 verbatim from the problem statement</text>
  </g>
  <line x1="360" y1="210" x2="360" y2="222" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m3-tri)"/>

  <!-- Card 2: No-go list -->
  <g>
    <rect x="24" y="224" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="260" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="281" text-anchor="middle" class="gk pill">3.1</text>
    <text x="156" y="268" class="gk name">No-go list</text>
    <text x="156" y="294" class="sys note">Longer than the build list, scope locked early</text>
  </g>
  <line x1="360" y1="330" x2="360" y2="342" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m3-tri)"/>

  <!-- Card 3: Outcome rewrite -->
  <g>
    <rect x="24" y="344" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="380" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="401" text-anchor="middle" class="gk pill">3.2</text>
    <text x="156" y="388" class="gk name">Outcome rewrite</text>
    <text x="156" y="414" class="sys note">Features rewritten as parent outcomes</text>
  </g>
  <line x1="360" y1="450" x2="360" y2="462" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m3-tri)"/>

  <!-- Card 4: Quality check (payoff, PASS = green) -->
  <g>
    <rect x="24" y="464" width="672" height="104" rx="6" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <rect x="44" y="500" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="521" text-anchor="middle" class="gk pill">3.2</text>
    <text x="156" y="508" class="gk name">Quality check</text>
    <text x="156" y="534" class="sys note">1 fail, 1 fix, 1 clean run</text>
    <text x="684" y="528" text-anchor="end" class="gk metric" fill="#2e7d32">PASS</text>
  </g>

  <!-- one basis line -->
  <text x="360" y="592" text-anchor="middle" class="sys basis">Basis: Mia's Module 3 deliverables, caught on paper</text>
</svg>
