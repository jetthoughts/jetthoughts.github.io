<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="cadence-title cadence-desc">
  <title id="cadence-title">The weekly oversight cadence: five daily standups feed one Friday demo, then the loop resets Monday.</title>
  <desc id="cadence-desc">A daily-standup panel labelled Mon to Fri holds the three questions asked at the end of every standup: show the staging URL of what shipped, walk through one PR you reviewed and what you flagged, and what did we cut to ship it. An arrow labelled five days of proof feeds a green Friday demo card - the week's working software. That feeds a purple weekly report card - what shipped, what is next. A dashed loop returns to the daily standup: Monday the loop resets, you already know what should be on staging.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .pt    { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .ps    { font-size: 17px; font-weight: 400; fill: #666666; }
      .q     { font-size: 18px; font-weight: 400; fill: #121212; }
      .num   { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .ct    { font-size: 20px; font-weight: 700; }
      .cs    { font-size: 17px; font-weight: 400; fill: #444444; }
      .lbl   { font-size: 17px; font-weight: 400; fill: #666666; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="cah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#333333"/>
    </marker>
    <marker id="cahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="720" height="405" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="389" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="42" text-anchor="middle" class="gk title">The weekly oversight cadence</text>
  <text x="360" y="70" text-anchor="middle" class="gk msg">Five daily standups feed one Friday demo</text>

  <!-- Daily standup panel -->
  <g>
    <rect x="24" y="96" width="352" height="232" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <text x="44" y="130" class="gk pt">Daily standup - Mon to Fri</text>
    <text x="44" y="154" class="sys ps">Ask these 3 at the end, every day.</text>

    <circle cx="58" cy="190" r="13" fill="#cc342d"/>
    <text x="58" y="195" text-anchor="middle" class="gk num">1</text>
    <text x="82" y="196" class="gk q">Staging URL of what shipped?</text>

    <circle cx="58" cy="238" r="13" fill="#cc342d"/>
    <text x="58" y="243" text-anchor="middle" class="gk num">2</text>
    <text x="82" y="244" class="gk q">One PR reviewed - what you flagged?</text>

    <circle cx="58" cy="286" r="13" fill="#cc342d"/>
    <text x="58" y="291" text-anchor="middle" class="gk num">3</text>
    <text x="82" y="292" class="gk q">What did we cut to ship it?</text>
  </g>

  <!-- Feed arrow: standup -> Friday demo -->
  <text x="414" y="200" text-anchor="middle" class="sys lbl">5 days</text>
  <text x="414" y="220" text-anchor="middle" class="sys lbl">of proof</text>
  <path d="M 378 240 L 452 240" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#cah)"/>

  <!-- Friday demo card (green = the week's proof/success) -->
  <g>
    <rect x="456" y="150" width="112" height="140" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="512" y="200" text-anchor="middle" class="gk ct" fill="#2e7d32">Friday</text>
    <text x="512" y="224" text-anchor="middle" class="gk ct" fill="#2e7d32">demo</text>
    <text x="512" y="252" text-anchor="middle" class="sys cs">the week's</text>
    <text x="512" y="272" text-anchor="middle" class="sys cs">working sw</text>
  </g>

  <!-- Arrow: Friday demo -> weekly report -->
  <path d="M 568 240 L 588 240" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#cah)"/>

  <!-- Weekly report card (purple = the report artifact) -->
  <g>
    <rect x="592" y="150" width="104" height="140" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
    <text x="644" y="200" text-anchor="middle" class="gk ct" fill="#7c3aed">Weekly</text>
    <text x="644" y="224" text-anchor="middle" class="gk ct" fill="#7c3aed">report</text>
    <text x="644" y="252" text-anchor="middle" class="sys cs">what shipped,</text>
    <text x="644" y="272" text-anchor="middle" class="sys cs">what's next</text>
  </g>

  <!-- Loop back to daily standup -->
  <path d="M 644 290 C 620 344, 320 356, 200 328" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cahg)"/>
  <text x="360" y="384" text-anchor="middle" class="sys note">Monday: the loop resets - you already know what's on staging.</text>
</svg>
