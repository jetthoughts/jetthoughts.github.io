<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 732" role="img" aria-labelledby="m2-trail-title m2-trail-desc">
  <title id="m2-trail-title">Ten conversations became real evidence: Mia's Module 2 trail runs a Mom-Test script to a 30-name list to a BUILD verdict to a price to a clickable prototype.</title>
  <desc id="m2-trail-desc">A vertical trail of five artifact cards. 2.1-2.2 Mom-Test script, 5 past-tense questions, no product mentioned. 2.3-2.4 30-name list turned into 10 booked calls in 2 weeks. 2.5 Ten scored transcripts returned a BUILD verdict, 8 of 10 cleared the gate. 2.5 Money answer of $70-120 per session from real receipts. 2.6 Clickable prototype, the alternate-path artifact, tested well with 4 of 5 and the price goes on the profile. Basis: Mia's Module 2 deliverables, 10 scored interviews.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .pill  { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .name  { font-size: 20px; font-weight: 700; fill: #121212; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
      .metric{ font-size: 30px; font-weight: 700; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="m2-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="732" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="716" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block -->
  <text x="360" y="50" text-anchor="middle" class="gk title">Ten conversations became evidence</text>
  <text x="360" y="82" text-anchor="middle" class="gk msg">Mia's Module 2 trail - a script to a BUILD verdict</text>

  <!-- Card 1: Mom-Test script -->
  <g>
    <rect x="24" y="104" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="140" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="161" text-anchor="middle" class="gk pill">2.1-2.2</text>
    <text x="156" y="148" class="gk name">Mom-Test script</text>
    <text x="156" y="174" class="sys note">5 past-tense questions, no product mentioned</text>
  </g>
  <line x1="360" y1="210" x2="360" y2="222" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m2-tri)"/>

  <!-- Card 2: 30-name list -->
  <g>
    <rect x="24" y="224" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="260" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="281" text-anchor="middle" class="gk pill">2.3-2.4</text>
    <text x="156" y="268" class="gk name">30-name list</text>
    <text x="156" y="294" class="sys note">Booked in 2 weeks</text>
    <text x="684" y="288" text-anchor="end" class="gk metric" fill="#121212">10 calls</text>
  </g>
  <line x1="360" y1="330" x2="360" y2="342" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m2-tri)"/>

  <!-- Card 3: 10 scored transcripts (BUILD verdict, success = green) -->
  <g>
    <rect x="24" y="344" width="672" height="104" rx="6" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <rect x="44" y="380" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="401" text-anchor="middle" class="gk pill">2.5</text>
    <text x="156" y="388" class="gk name">10 scored transcripts</text>
    <text x="156" y="414" class="sys note">8 of 10 cleared the gate</text>
    <text x="684" y="408" text-anchor="end" class="gk metric" fill="#2e7d32">BUILD</text>
  </g>
  <line x1="360" y1="450" x2="360" y2="462" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m2-tri)"/>

  <!-- Card 4: Money answer (willingness to pay = green) -->
  <g>
    <rect x="24" y="464" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="500" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="521" text-anchor="middle" class="gk pill">2.5</text>
    <text x="156" y="508" class="gk name">Money answer</text>
    <text x="156" y="534" class="sys note">Per session, from real receipts</text>
    <text x="684" y="528" text-anchor="end" class="gk metric" fill="#2e7d32">$70-120</text>
  </g>
  <line x1="360" y1="570" x2="360" y2="582" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m2-tri)"/>

  <!-- Card 5: Clickable prototype (alternate path = purple) -->
  <g>
    <rect x="24" y="584" width="672" height="104" rx="6" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
    <rect x="44" y="620" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="641" text-anchor="middle" class="gk pill">2.6</text>
    <text x="156" y="628" class="gk name">Clickable prototype</text>
    <text x="156" y="654" class="sys note">Price goes on the profile</text>
    <text x="684" y="648" text-anchor="end" class="gk metric" fill="#a855f7">4 of 5</text>
  </g>

  <!-- one basis line -->
  <text x="360" y="712" text-anchor="middle" class="sys basis">Basis: Mia's Module 2 deliverables, 10 scored interviews</text>
</svg>
