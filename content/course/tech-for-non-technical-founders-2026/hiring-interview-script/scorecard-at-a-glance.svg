<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 838" role="img" aria-labelledby="scg-title scg-desc">
  <title id="scg-title">The 7 hiring questions on one card: the pass signal and the fail signal for each.</title>
  <desc id="scg-desc">Seven question cards, each with a green Pass line and a ruby Fail line. Q1 Workflow, ticket to code - Pass: names tools by version plus a real pull request; Fail: "Cursor does boilerplate", no PR. Q2 Cost per dev per month - Pass: 80 to 300 dollars, pulled the receipt; Fail: "My company pays", no tracking. Q3 Verify, reviewer checks - Pass: opens a real PR and names the checks; Fail: "I trust the model or CI". Q4 Slopsquatting defence - Pass: a named defence and says the word; Fail: "Name looks right", never hit it. Q5 Accountability - Pass: a dated incident and the root cause; Fail: "Never had one", blamed the tool. Q6 Refactor you led - Pass: a named system - kept, changed, broke; Fail: "Refactor as I go" or "rewrote it". Q7 Disagreement with the AI - Pass: a real PR on screen with a specific reason; Fail: "Usually agree", then silence. A closing rule: refusing to share screen on Q3 or Q7 is an automatic fail on both.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .qlab  { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .pass  { font-size: 18px; font-weight: 400; fill: #1b5e20; }
      .fail  { font-size: 18px; font-weight: 400; fill: #b3261e; }
      .rule  { font-size: 18px; font-weight: 700; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="838" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="822" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Run the interview from this card</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Tick a pass only when the answer lands on the Pass side</text>

  <!-- Q1 -->
  <g transform="translate(24,96)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">1</text>
    <text x="56" y="35" class="gk qlab">Workflow: ticket to code</text>
    <text x="18" y="60" class="sys pass">Pass: tools by version + a real PR</text>
    <text x="18" y="82" class="sys fail">Fail: "<tspan class="mono">Cursor</tspan> does boilerplate", no PR</text>
  </g>

  <!-- Q2 -->
  <g transform="translate(24,196)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">2</text>
    <text x="56" y="35" class="gk qlab">Cost: $ per dev per month</text>
    <text x="18" y="60" class="sys pass">Pass: $80-300, pulled the receipt</text>
    <text x="18" y="82" class="sys fail">Fail: "My company pays", no tracking</text>
  </g>

  <!-- Q3 -->
  <g transform="translate(24,296)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">3</text>
    <text x="56" y="35" class="gk qlab">Verify: reviewer checks</text>
    <text x="18" y="60" class="sys pass">Pass: opens a real PR, names the checks</text>
    <text x="18" y="82" class="sys fail">Fail: "I trust the model / CI"</text>
  </g>

  <!-- Q4 -->
  <g transform="translate(24,396)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">4</text>
    <text x="56" y="35" class="gk qlab">Slopsquatting defence</text>
    <text x="18" y="60" class="sys pass">Pass: a named defence + says the word</text>
    <text x="18" y="82" class="sys fail">Fail: "Name looks right", never hit it</text>
  </g>

  <!-- Q5 -->
  <g transform="translate(24,496)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">5</text>
    <text x="56" y="35" class="gk qlab">Accountability: owned it</text>
    <text x="18" y="60" class="sys pass">Pass: a dated incident + root cause</text>
    <text x="18" y="82" class="sys fail">Fail: "Never had one", blamed the tool</text>
  </g>

  <!-- Q6 -->
  <g transform="translate(24,596)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">6</text>
    <text x="56" y="35" class="gk qlab">Refactor you led</text>
    <text x="18" y="60" class="sys pass">Pass: a named system - kept, changed, broke</text>
    <text x="18" y="82" class="sys fail">Fail: "Refactor as I go" / "rewrote it"</text>
  </g>

  <!-- Q7 -->
  <g transform="translate(24,696)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">7</text>
    <text x="56" y="35" class="gk qlab">Disagreement with the AI</text>
    <text x="18" y="60" class="sys pass">Pass: a real PR on screen, a specific reason</text>
    <text x="18" y="82" class="sys fail">Fail: "Usually agree", then silence</text>
  </g>

  <text x="360" y="806" text-anchor="middle" class="sys rule">Refuses to share screen on Q3 or Q7 = automatic fail on both</text>
  <text x="360" y="826" text-anchor="middle" class="sys basis">Basis: the interview is over the moment they will not open a PR</text>
</svg>
