<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">The 15-item pre-launch checklist: 5 sections flow into the final gate.</title>
  <desc id="pl-desc">Five numbered section cards across the top with their check counts: 1 Mobile (5 checks), 2 Payments (3 checks), 3 Auth and Access (3 checks), 4 Onboarding (2 checks), 5 the one-human smoke test (2 checks). Arrows converge into the final gate below, which shows three verdicts: 15 of 15 green - ship it, share the URL with your Module 2 interview pool; 12 to 14 green (amber) - fix the red items today, retest and share tomorrow; under 12 green (ruby) - do not ship, run the build phases again before anyone sees it. Checks 6 to 13 are the five green lights from Lesson 4.4 as per-item checks.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 20px; font-weight: 600; fill: #4a4a4a; }
      .snum  { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .shd   { font-size: 18px; font-weight: 700; fill: #121212; }
      .gate  { font-size: 20px; font-weight: 700; fill: #121212; }
      .vhd   { font-size: 20px; font-weight: 700; }
      .vtx   { font-size: 18px; font-weight: 400; fill: #333333; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .note  { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="pah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="720" height="540" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="524" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="40" text-anchor="middle" class="gk title">Pre-launch: 15 checks, 5 sections</text>
  <text x="360" y="66" text-anchor="middle" class="gk msg">Run the day before you share your MVP URL</text>

  <!-- Section cards -->
  <g>
    <rect x="24" y="90" width="126" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="46" cy="114" r="13" fill="#cc342d"/>
    <text x="46" y="119" text-anchor="middle" class="gk snum">1</text>
    <text x="66" y="120" class="gk shd">Mobile</text>
    <circle cx="87" cy="164" r="17" fill="#2e7d32"/>
    <text x="87" y="170" text-anchor="middle" class="gk snum">5</text>
  </g>
  <g>
    <rect x="160" y="90" width="126" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="182" cy="114" r="13" fill="#cc342d"/>
    <text x="182" y="119" text-anchor="middle" class="gk snum">2</text>
    <text x="202" y="120" class="gk shd">Payments</text>
    <circle cx="223" cy="164" r="17" fill="#2e7d32"/>
    <text x="223" y="170" text-anchor="middle" class="gk snum">3</text>
  </g>
  <g>
    <rect x="296" y="90" width="126" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="318" cy="114" r="13" fill="#cc342d"/>
    <text x="318" y="119" text-anchor="middle" class="gk snum">3</text>
    <text x="338" y="120" class="gk shd">Auth</text>
    <circle cx="359" cy="164" r="17" fill="#2e7d32"/>
    <text x="359" y="170" text-anchor="middle" class="gk snum">3</text>
  </g>
  <g>
    <rect x="432" y="90" width="126" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="454" cy="114" r="13" fill="#cc342d"/>
    <text x="454" y="119" text-anchor="middle" class="gk snum">4</text>
    <text x="474" y="120" class="gk shd">Onboard</text>
    <circle cx="495" cy="164" r="17" fill="#2e7d32"/>
    <text x="495" y="170" text-anchor="middle" class="gk snum">2</text>
  </g>
  <g>
    <rect x="568" y="90" width="126" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="590" cy="114" r="13" fill="#cc342d"/>
    <text x="590" y="119" text-anchor="middle" class="gk snum">5</text>
    <text x="610" y="120" class="gk shd">Smoke</text>
    <circle cx="631" cy="164" r="17" fill="#2e7d32"/>
    <text x="631" y="170" text-anchor="middle" class="gk snum">2</text>
  </g>

  <!-- Convergence arrows -->
  <path d="M 87 194 C 87 214, 300 226, 350 244" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#pah)"/>
  <path d="M 223 194 C 223 216, 330 228, 360 244" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#pah)"/>
  <path d="M 359 194 L 360 244" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#pah)"/>
  <path d="M 495 194 C 495 216, 390 228, 370 244" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#pah)"/>
  <path d="M 631 194 C 631 214, 420 226, 372 244" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#pah)"/>

  <text x="360" y="272" text-anchor="middle" class="gk gate">Final gate: count your green lights</text>

  <!-- Verdict: green ship -->
  <g>
    <rect x="40" y="286" width="640" height="66" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <rect x="58" y="306" width="96" height="28" rx="4" fill="#2e7d32"/>
    <text x="106" y="325" text-anchor="middle" class="gk badge">15/15</text>
    <text x="172" y="318" class="gk vhd" fill="#2e7d32">Ship it.</text>
    <text x="172" y="342" class="sys vtx">Share the URL with your Module 2 interview pool.</text>
  </g>
  <!-- Verdict: amber fix -->
  <g>
    <rect x="40" y="362" width="640" height="66" rx="4" fill="#fffbeb" stroke="#b8860b" stroke-width="2.5"/>
    <rect x="58" y="382" width="96" height="28" rx="4" fill="#b8860b"/>
    <text x="106" y="401" text-anchor="middle" class="gk badge">12-14</text>
    <text x="172" y="394" class="gk vhd" fill="#b8860b">Fix the red items today.</text>
    <text x="172" y="418" class="sys vtx">These lose early users. Retest, share tomorrow.</text>
  </g>
  <!-- Verdict: ruby do not ship -->
  <g>
    <rect x="40" y="438" width="640" height="66" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <rect x="58" y="458" width="96" height="28" rx="4" fill="#cc342d"/>
    <text x="106" y="477" text-anchor="middle" class="gk badge">Under 12</text>
    <text x="172" y="470" class="gk vhd" fill="#cc342d">Do not ship.</text>
    <text x="172" y="494" class="sys vtx">Run the build phases again before anyone sees it.</text>
  </g>

  <text x="360" y="524" text-anchor="middle" class="sys note">Checks 6-13 = the five green lights from Lesson 4.4, as per-item checks.</text>
</svg>
