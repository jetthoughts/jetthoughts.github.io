<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 764" role="img" aria-labelledby="oaf-title oaf-desc">
  <title id="oaf-title">The Friday ownership audit: four checks - GitHub org owner, AWS root with MFA, prod DB password access, and WHOIS - any fail drops into one fix lane, starts a recovery clock, then forks on whether the contractor cooperates.</title>
  <desc id="oaf-desc">Four check cards in a two-by-two grid. Code - are you the GitHub org Owner; pass if it is your email, not the agency's. Cloud - is the AWS root email yours with MFA; pass if root is on your domain with MFA on. Secrets - can you read the prod DB password solo; pass if it comes from your own vault with no asking. Domain - does WHOIS list your name; pass if it is your name and your renewal email. Any fail drops into one shared amber fix lane: Slack the lead for an org transfer, self-serve email change or AWS recovery, add a 1Password vault this sprint, registrar move plus ICANN if blocked. All fixes converge on one card: recovery plan started this Friday. That leads to one question - did the contractor cooperate, 7 days for code or 14 for cloud? Yes routes to a green card: audit clean, recheck quarterly, email the board. No routes to a ruby card: retain a lawyer, 2 to 5 thousand dollars beats a stalled exit.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .step  { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .q     { font-size: 18px; font-weight: 400; fill: #222222; }
      .pass  { font-size: 18px; font-weight: 400; fill: #666666; }
      .lane  { font-size: 20px; font-weight: 700; fill: #9a6a00; }
      .fix   { font-size: 18px; font-weight: 400; fill: #6b5000; }
      .node  { font-size: 20px; font-weight: 700; fill: #121212; }
      .sub   { font-size: 18px; font-weight: 400; fill: #555555; }
      .outg  { font-size: 20px; font-weight: 700; fill: #2e7d32; }
      .outr  { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .elab  { font-size: 18px; font-weight: 700; fill: #555555; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="oaf-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="764" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="748" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="46" text-anchor="middle" class="gk title">Four checks decide who owns your product</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Any fail - fix it in one lane, then start the recovery clock</text>

  <!-- Check card 1: Code -->
  <g transform="translate(24,100)">
    <rect width="324" height="108" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="13" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">1</text>
    <text x="54" y="36" class="gk step">Code</text>
    <text x="18" y="68" class="sys q">Are you the <tspan class="mono">GitHub</tspan> org Owner?</text>
    <text x="18" y="94" class="sys pass">Pass: your email, not the agency</text>
  </g>

  <!-- Check card 2: Cloud -->
  <g transform="translate(372,100)">
    <rect width="324" height="108" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="13" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">2</text>
    <text x="54" y="36" class="gk step">Cloud</text>
    <text x="18" y="68" class="sys q">Is <tspan class="mono">AWS</tspan> root yours, with <tspan class="mono">MFA</tspan>?</text>
    <text x="18" y="94" class="sys pass">Pass: root on your domain + MFA</text>
  </g>

  <!-- Check card 3: Secrets -->
  <g transform="translate(24,224)">
    <rect width="324" height="108" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="13" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">3</text>
    <text x="54" y="36" class="gk step">Secrets</text>
    <text x="18" y="68" class="sys q">Read the prod DB password solo?</text>
    <text x="18" y="94" class="sys pass">Pass: from your vault, no asking</text>
  </g>

  <!-- Check card 4: Domain -->
  <g transform="translate(372,224)">
    <rect width="324" height="108" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="13" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">4</text>
    <text x="54" y="36" class="gk step">Domain</text>
    <text x="18" y="68" class="sys q">Does <tspan class="mono">WHOIS</tspan> list your name?</text>
    <text x="18" y="94" class="sys pass">Pass: your name + renewal email</text>
  </g>

  <!-- arrow: grid down to fix lane -->
  <line x1="360" y1="332" x2="360" y2="352" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oaf-tri)"/>

  <!-- shared fix lane (warning = amber) -->
  <g transform="translate(24,356)">
    <rect width="672" height="112" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="336" y="28" text-anchor="middle" class="gk lane">If a check fails, fix it right here</text>
    <line x1="168" y1="42" x2="168" y2="102" stroke="#e2b866" stroke-width="1.5"/>
    <line x1="336" y1="42" x2="336" y2="102" stroke="#e2b866" stroke-width="1.5"/>
    <line x1="504" y1="42" x2="504" y2="102" stroke="#e2b866" stroke-width="1.5"/>
    <text x="84" y="66" text-anchor="middle" class="sys fix">Slack the lead</text>
    <text x="84" y="90" text-anchor="middle" class="sys fix">for org transfer</text>
    <text x="252" y="66" text-anchor="middle" class="sys fix">Self-serve email</text>
    <text x="252" y="90" text-anchor="middle" class="sys fix">or AWS recovery</text>
    <text x="420" y="66" text-anchor="middle" class="sys fix">Add a 1Password</text>
    <text x="420" y="90" text-anchor="middle" class="sys fix">vault this sprint</text>
    <text x="588" y="66" text-anchor="middle" class="sys fix">Registrar move</text>
    <text x="588" y="90" text-anchor="middle" class="sys fix">+ ICANN if stuck</text>
  </g>

  <!-- arrow: fix lane down to recovery -->
  <line x1="360" y1="468" x2="360" y2="490" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oaf-tri)"/>

  <!-- recovery node -->
  <g transform="translate(160,490)">
    <rect width="400" height="52" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="200" y="33" text-anchor="middle" class="gk node">Recovery plan started this Friday</text>
  </g>

  <!-- arrow: recovery down to question -->
  <line x1="360" y1="542" x2="360" y2="564" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oaf-tri)"/>

  <!-- escalation question -->
  <g transform="translate(170,564)">
    <rect width="380" height="66" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" class="gk node">Did the contractor cooperate?</text>
    <text x="190" y="54" text-anchor="middle" class="sys sub">7 days for code, 14 for cloud</text>
  </g>

  <!-- fork arrows to the two outcomes -->
  <path d="M 360 630 C 300 644, 240 648, 200 654" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oaf-tri)"/>
  <path d="M 360 630 C 420 644, 480 648, 520 654" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oaf-tri)"/>
  <text x="250" y="650" class="gk elab">Yes</text>
  <text x="452" y="650" class="gk elab">No</text>

  <!-- outcome: pass (success = green) -->
  <g transform="translate(24,658)">
    <rect width="324" height="66" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="18" y="30" class="gk outg">Audit clean</text>
    <text x="18" y="54" class="sys body">Recheck quarterly; email board</text>
  </g>

  <!-- outcome: stall (anti-pattern = ruby) -->
  <g transform="translate(372,658)">
    <rect width="324" height="66" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <text x="18" y="30" class="gk outr">Retain a lawyer</text>
    <text x="18" y="54" class="sys body">$2K-$5K beats a stalled exit</text>
  </g>

  <!-- one basis line -->
  <text x="360" y="748" text-anchor="middle" class="sys basis">Basis: a Friday afternoon ownership audit - run it before the checkout stalls</text>
</svg>
