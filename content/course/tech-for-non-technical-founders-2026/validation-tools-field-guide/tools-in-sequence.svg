<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="toolseq-title toolseq-desc">
  <title id="toolseq-title">The three validation tools in the order that pays off.</title>
  <desc id="toolseq-desc">A left-to-right strip of three numbered tool cards joined by arrows. Card 1 VenturusAI catches missed rivals and weak edge - about 30 seconds, Free. Card 2 Preuve AI catches market signal and too-broad customer - about 60 seconds, Free scan. Card 3 DimeADozen (optional) catches kill risks and unit economics - about 2 minutes, 9-dollar Starter. None of them validates the hypothesis - only 10 Mom Test interviews do that.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .tool  { font-size: 22px; font-weight: 700; fill: #121212; }
      .opt   { font-size: 17px; font-weight: 400; fill: #888888; }
      .cap   { font-size: 17px; font-weight: 700; fill: #999999; }
      .catch { font-size: 18px; font-weight: 600; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .chiptx  { font-size: 17px; font-weight: 400; fill: #555555; }
      .chiptxa { font-size: 17px; font-weight: 700; fill: #b8860b; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="tah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="304" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="42" text-anchor="middle" class="gk title">3 tools, in paying order</text>
  <text x="360" y="70" text-anchor="middle" class="gk msg">Run in sequence - each catches what the next can't</text>

  <!-- Card 1 -->
  <g>
    <rect x="24" y="94" width="210" height="164" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="48" cy="120" r="14" fill="#cc342d"/>
    <text x="48" y="126" text-anchor="middle" class="gk num">1</text>
    <text x="70" y="127" class="gk tool">VenturusAI</text>
    <text x="40" y="162" class="gk cap">CATCHES</text>
    <text x="40" y="186" class="gk catch">Missed rivals, weak edge</text>
    <rect x="40" y="206" width="86" height="30" rx="4" fill="#faf7f2" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="83" y="226" text-anchor="middle" class="sys chiptx">~30 sec</text>
    <rect x="132" y="206" width="86" height="30" rx="4" fill="#faf7f2" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="175" y="226" text-anchor="middle" class="sys chiptx">Free</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="255" y="94" width="210" height="164" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="279" cy="120" r="14" fill="#cc342d"/>
    <text x="279" y="126" text-anchor="middle" class="gk num">2</text>
    <text x="301" y="127" class="gk tool">Preuve AI</text>
    <text x="271" y="162" class="gk cap">CATCHES</text>
    <text x="271" y="186" class="gk catch">Market signal, too broad</text>
    <rect x="271" y="206" width="86" height="30" rx="4" fill="#faf7f2" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="314" y="226" text-anchor="middle" class="sys chiptx">~60 sec</text>
    <rect x="363" y="206" width="86" height="30" rx="4" fill="#faf7f2" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="406" y="226" text-anchor="middle" class="sys chiptx">Free scan</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="486" y="94" width="210" height="164" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="510" cy="120" r="14" fill="#cc342d"/>
    <text x="510" y="126" text-anchor="middle" class="gk num">3</text>
    <text x="532" y="127" class="gk tool">DimeADozen</text>
    <text x="510" y="152" class="sys opt">optional</text>
    <text x="502" y="176" class="gk cap">CATCHES</text>
    <text x="502" y="198" class="gk catch">Kill risks, unit economics</text>
    <rect x="502" y="212" width="86" height="30" rx="4" fill="#faf7f2" stroke="#bbbbbb" stroke-width="1.5"/>
    <text x="545" y="232" text-anchor="middle" class="sys chiptx">~2 min</text>
    <rect x="594" y="212" width="86" height="30" rx="4" fill="#fffbeb" stroke="#b8860b" stroke-width="1.5"/>
    <text x="637" y="232" text-anchor="middle" class="sys chiptxa">$9 Starter</text>
  </g>

  <!-- Arrows -->
  <path d="M 234 176 L 253 176" stroke="#999999" stroke-width="2.25" fill="none" marker-end="url(#tah)"/>
  <path d="M 465 176 L 484 176" stroke="#999999" stroke-width="2.25" fill="none" marker-end="url(#tah)"/>

  <text x="360" y="292" text-anchor="middle" class="sys note">None validate your hypothesis - only 10 Mom Test interviews do.</text>
</svg>
