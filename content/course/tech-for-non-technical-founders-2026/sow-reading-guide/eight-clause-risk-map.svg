<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="cm-title cm-desc">
  <title id="cm-title">The 8-clause SOW risk map: each clause and what it quietly costs you if you skim it.</title>
  <desc id="cm-desc">Eight clause cards, each with the cost of skimming it in ruby. 1 Scope: vague scope is a blank check. 2 Milestone acceptance: you paid for staging no one uses. 3 Change requests: $185 an hour, no cap, no compare. 4 IP ownership: the agency holds the repo hostage. 5 Third-party accounts: rented accounts plus a 15 percent fee. 6 Termination: you can't exit for bad work. 7 Warranty: the clock runs out before launch. 8 Disputes: their city, their lawyer. An amber callout: $78K invoiced, 4 of 5 milestones, runway cut from 12 months to 7 - one email with all 8 questions, before you sign, catches this.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .clab  { font-size: 20px; font-weight: 700; fill: #121212; }
      .cost  { font-size: 18px; font-weight: 400; fill: #b3261e; }
      .calll { font-size: 20px; font-weight: 700; fill: #9a6a00; }
      .calln { font-size: 18px; font-weight: 400; fill: #555555; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="580" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="564" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The 8-clause SOW risk map</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Each clause, and what it quietly costs if you skim it</text>

  <!-- Row 1 -->
  <g transform="translate(24,96)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">1. Scope</text>
    <text x="18" y="64" class="sys cost">Vague scope = a blank check</text>
  </g>
  <g transform="translate(372,96)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">2. Milestone acceptance</text>
    <text x="18" y="64" class="sys cost">Paid for staging no one uses</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(24,192)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">3. Change requests</text>
    <text x="18" y="64" class="sys cost">$185/hr, no cap, no compare</text>
  </g>
  <g transform="translate(372,192)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">4. IP ownership</text>
    <text x="18" y="64" class="sys cost">Agency holds the repo hostage</text>
  </g>
  <!-- Row 3 -->
  <g transform="translate(24,288)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">5. Third-party accounts</text>
    <text x="18" y="64" class="sys cost">Rented accounts + 15% fee</text>
  </g>
  <g transform="translate(372,288)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">6. Termination</text>
    <text x="18" y="64" class="sys cost">Can't exit for bad work</text>
  </g>
  <!-- Row 4 -->
  <g transform="translate(24,384)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">7. Warranty</text>
    <text x="18" y="64" class="sys cost">Clock runs out before launch</text>
  </g>
  <g transform="translate(372,384)">
    <rect width="324" height="84" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk clab">8. Disputes</text>
    <text x="18" y="64" class="sys cost">Their city, their lawyer</text>
  </g>

  <!-- Bottom callout (warning = amber) -->
  <g transform="translate(24,488)">
    <rect width="672" height="56" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="336" y="26" text-anchor="middle" class="gk calll">$78K invoiced. 4 of 5 milestones. Runway 12mo -&gt; 7mo.</text>
    <text x="336" y="47" text-anchor="middle" class="sys calln">One email with all 8 questions, before you sign, catches this.</text>
  </g>

  <text x="360" y="562" text-anchor="middle" class="sys basis">Basis: one real fixed-bid SOW - the eight clauses that quietly move the risk to you</text>
</svg>
