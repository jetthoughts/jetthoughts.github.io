<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="faq-strip-title faq-strip-desc">
  <title id="faq-strip-title">FAQ map: questions are grouped as General, then the five modules in order.</title>
  <desc id="faq-strip-desc">Six navigation cards in a row: General (pace and order), Module 1 Hypothesis and smoke test, Module 2 Validate the problem, Module 3 Design from evidence, Module 4 Build it yourself, Module 5 First paying customer - in that order. Find your module below; questions are grouped in this order.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .num   { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .lab   { font-size: 18px; font-weight: 600; fill: #121212; }
      .glab  { font-size: 18px; font-weight: 700; fill: #121212; }
      .gsub  { font-size: 17px; font-weight: 400; fill: #666666; }
      .cap   { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="720" height="240" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="224" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- General -->
  <g>
    <rect x="20" y="44" width="102" height="110" rx="4" fill="#faf7f2" stroke="#3a3a3a" stroke-width="2"/>
    <text x="71" y="95" text-anchor="middle" class="gk glab">General</text>
    <text x="71" y="118" text-anchor="middle" class="sys gsub">pace + order</text>
  </g>
  <!-- M1 -->
  <g>
    <rect x="134" y="44" width="102" height="110" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="185" y="80" text-anchor="middle" class="gk num">M1</text>
    <text x="185" y="106" text-anchor="middle" class="gk lab">Hypothesis</text>
    <text x="185" y="127" text-anchor="middle" class="gk lab">+ smoke test</text>
  </g>
  <!-- M2 -->
  <g>
    <rect x="248" y="44" width="102" height="110" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="299" y="80" text-anchor="middle" class="gk num">M2</text>
    <text x="299" y="106" text-anchor="middle" class="gk lab">Validate</text>
    <text x="299" y="127" text-anchor="middle" class="gk lab">the problem</text>
  </g>
  <!-- M3 -->
  <g>
    <rect x="362" y="44" width="102" height="110" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="413" y="80" text-anchor="middle" class="gk num">M3</text>
    <text x="413" y="106" text-anchor="middle" class="gk lab">Design from</text>
    <text x="413" y="127" text-anchor="middle" class="gk lab">evidence</text>
  </g>
  <!-- M4 -->
  <g>
    <rect x="476" y="44" width="102" height="110" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="527" y="80" text-anchor="middle" class="gk num">M4</text>
    <text x="527" y="106" text-anchor="middle" class="gk lab">Build it</text>
    <text x="527" y="127" text-anchor="middle" class="gk lab">yourself</text>
  </g>
  <!-- M5 -->
  <g>
    <rect x="590" y="44" width="102" height="110" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="641" y="80" text-anchor="middle" class="gk num">M5</text>
    <text x="641" y="106" text-anchor="middle" class="gk lab">First paying</text>
    <text x="641" y="127" text-anchor="middle" class="gk lab">customer</text>
  </g>

  <!-- Arrows -->
  <line x1="123" y1="99" x2="133" y2="99" stroke="#999999" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="237" y1="99" x2="247" y2="99" stroke="#999999" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="351" y1="99" x2="361" y2="99" stroke="#999999" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="465" y1="99" x2="475" y2="99" stroke="#999999" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="579" y1="99" x2="589" y2="99" stroke="#999999" stroke-width="2" marker-end="url(#fa)"/>

  <text x="360" y="200" text-anchor="middle" class="sys cap">Find your module below - questions are grouped in this order.</text>
</svg>
