<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="skeleton-title skeleton-desc">
  <title id="skeleton-title">The one-page brief skeleton - five labeled sections.</title>
  <desc id="skeleton-desc">Five section cards. 1 The Problem, copied word for word from your validated statement, do not soften it. 2 User plus context, the 60 seconds before and after they reach for it, moment of use not TAM. 3 What you are building, one verb-led paragraph, outcome-shaped not a feature list. 4 Success metric (green), one metric, one target number, one 30-day calendar reminder. 5 What you are not building (ruby), the no-go list, name what a competent agent would add. Sections 1-2 come from research, 3-5 written fresh, 90 minutes hard cap.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .snum  { font-size: 20px; font-weight: 700; fill: #121212; }
      .rule  { font-size: 18px; font-weight: 400; fill: #444444; }
      .cueg  { font-size: 18px; font-weight: 700; fill: #2e7d32; }
      .cueb  { font-size: 18px; font-weight: 700; fill: #cc342d; }
    </style>
  </defs>

  <rect width="720" height="480" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="464" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="42" text-anchor="middle" class="gk title">The one-page brief, five sections</text>
  <text x="360" y="70" text-anchor="middle" class="gk msg">Sections 1-2 from research, 3-5 fresh - 90 min cap</text>

  <!-- Row 1: sections 1-3 -->
  <g>
    <rect x="24" y="94" width="216" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="132" y="126" text-anchor="middle" class="gk snum">1 - THE PROBLEM</text>
    <text x="132" y="162" text-anchor="middle" class="sys rule">Copied word for word</text>
    <text x="132" y="186" text-anchor="middle" class="sys rule">from your validated</text>
    <text x="132" y="210" text-anchor="middle" class="sys rule">statement - do not</text>
    <text x="132" y="234" text-anchor="middle" class="sys rule">soften it.</text>
  </g>
  <g>
    <rect x="252" y="94" width="216" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="360" y="126" text-anchor="middle" class="gk snum">2 - USER + CONTEXT</text>
    <text x="360" y="162" text-anchor="middle" class="sys rule">The 60 seconds before</text>
    <text x="360" y="186" text-anchor="middle" class="sys rule">and after they reach</text>
    <text x="360" y="210" text-anchor="middle" class="sys rule">for it - moment of</text>
    <text x="360" y="234" text-anchor="middle" class="sys rule">use, not TAM.</text>
  </g>
  <g>
    <rect x="480" y="94" width="216" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="588" y="126" text-anchor="middle" class="gk snum">3 - BUILDING</text>
    <text x="588" y="162" text-anchor="middle" class="sys rule">One verb-led</text>
    <text x="588" y="186" text-anchor="middle" class="sys rule">paragraph.</text>
    <text x="588" y="216" text-anchor="middle" class="cueg">&#10003; outcome-shaped</text>
    <text x="588" y="240" text-anchor="middle" class="cueb">&#10007; feature list</text>
  </g>

  <!-- Row 2: sections 4-5 -->
  <!-- Section 4: success metric = green -->
  <g>
    <rect x="24" y="278" width="330" height="168" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="189" y="316" text-anchor="middle" class="gk snum">4 - SUCCESS METRIC</text>
    <text x="189" y="356" text-anchor="middle" class="sys rule">One metric. One target number.</text>
    <text x="189" y="384" text-anchor="middle" class="sys rule">One 30-day calendar reminder.</text>
    <text x="189" y="418" text-anchor="middle" class="cueg">&#10003; the one thing you check</text>
  </g>
  <!-- Section 5: no-go list = ruby (anti-pattern) -->
  <g>
    <rect x="366" y="278" width="330" height="168" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <text x="531" y="316" text-anchor="middle" class="gk snum">5 - NOT BUILDING</text>
    <text x="531" y="356" text-anchor="middle" class="sys rule">The no-go list - name what a</text>
    <text x="531" y="384" text-anchor="middle" class="sys rule">competent agent would add.</text>
    <text x="531" y="418" text-anchor="middle" class="cueb">&#10007; scope you refuse now</text>
  </g>
</svg>
