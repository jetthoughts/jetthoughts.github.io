<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="fp-title fp-desc">
  <title id="fp-title">A paid deposit converts far more pilots than a free one - same product, buyer, and eight weeks.</title>
  <desc id="fp-desc">A two-bar comparison of the share of pilots that convert to paying. The free pilot bar is short in ruby - about 12 percent convert. The paid pilot bar is tall in green - about 65 percent convert. Same product, same buyer, same eight weeks; the deposit is the only change. Deposit terms: $500 or more, 10 to 30 percent of year-one ACV, charged before kickoff. If the customer cancels early the deposit is forfeited; if you cancel you refund 100 percent. Basis: illustrative convert-to-paying rates; the deposit is the only variable, not the product or the buyer.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .cat   { font-size: 20px; font-weight: 600; fill: #121212; }
      .valr  { font-size: 34px; font-weight: 700; fill: #cc342d; }
      .valg  { font-size: 34px; font-weight: 700; fill: #2e7d32; }
      .vals  { font-size: 18px; font-weight: 400; fill: #444444; }
      .note  { font-size: 18px; font-weight: 400; fill: #333333; }
      .noteb { font-size: 18px; font-weight: 700; fill: #121212; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="480" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="464" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="46" text-anchor="middle" class="gk title">Charge a deposit and pilots convert</text>
  <text x="360" y="78" text-anchor="middle" class="gk msg">Same product, buyer, and 8 weeks - the deposit is the change</text>

  <!-- DATA bars: filled semantic, no stroke. baseline y=336, 100% = 200px (y136..336) -->
  <!-- free 12% -> h=24 (top 312), ruby = anti-pattern -->
  <rect x="190" y="312" width="140" height="24" fill="#cc342d"/>
  <!-- paid 65% -> h=130 (top 206), green = money -->
  <rect x="390" y="206" width="140" height="130" fill="#2e7d32"/>

  <!-- value labels above bars (annotation rung) -->
  <text x="260" y="300" text-anchor="middle" class="gk valr">12%</text>
  <text x="460" y="196" text-anchor="middle" class="gk valg">65%</text>

  <!-- STRUCTURE: single baseline axis, stroked ink -->
  <line x1="150" y1="336" x2="570" y2="336" stroke="#3a3a3a" stroke-width="2"/>

  <!-- category labels below baseline (label rung) + convert caption -->
  <text x="260" y="362" text-anchor="middle" class="gk cat">Free pilot</text>
  <text x="260" y="384" text-anchor="middle" class="sys vals">convert to paying</text>
  <text x="460" y="362" text-anchor="middle" class="gk cat">Paid pilot</text>
  <text x="460" y="384" text-anchor="middle" class="sys vals">convert to paying</text>

  <!-- deposit-terms note band -->
  <rect x="24" y="400" width="672" height="46" rx="4" fill="#faf7f2" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="422" class="sys note"><tspan class="noteb">Deposit:</tspan> $500+, 10-30% of year-one ACV, charged before kickoff.</text>
  <text x="40" y="440" class="sys note">Customer cancels early: forfeited.  You cancel: 100% refund.</text>

  <!-- one basis line -->
  <text x="360" y="464" text-anchor="middle" class="sys basis">Basis: illustrative convert-to-paying rates - the deposit is the only variable</text>
</svg>
