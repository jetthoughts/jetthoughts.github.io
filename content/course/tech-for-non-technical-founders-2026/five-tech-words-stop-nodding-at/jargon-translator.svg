<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="jargon-title jargon-desc">
  <title id="jargon-title">Jargon translator: what your dev shop says versus what it usually means.</title>
  <desc id="jargon-desc">Five rows pairing a phrase with its translation. "We're refactoring the order flow" means rewriting code they shipped before, on your dime, calling it tidy-up. "We need a Docker upgrade" means something on the server broke and they can't reproduce it locally. "There's a lot of tech debt to pay down" means they wrote it badly - pay them to fix what you already paid them to write. "Let's just ship the MVP first" means the cheapest scope they can finish inside the budget you have left. "We need to fix the architecture" means they want resume-building tech the senior dev hasn't tried yet. Five words, five invoices - bring the question column to your next standup.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #121212; letter-spacing: -0.3px; }
      .term  { font-size: 18px; font-weight: 700; fill: #121212; }
      .mean  { font-size: 18px; font-weight: 400; fill: #121212; }
      .cap   { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="jah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#121212"/>
    </marker>
  </defs>

  <rect width="720" height="600" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="584" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="186" y="46" text-anchor="middle" class="gk title">WHAT THEY SAY</text>
  <text x="524" y="46" text-anchor="middle" class="gk title">WHAT IT MEANS</text>

  <!-- Row 1 -->
  <rect x="24" y="66" width="300" height="84" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="174" y="102" text-anchor="middle" class="gk term">"We're refactoring</text>
  <text x="174" y="126" text-anchor="middle" class="gk term">the order flow"</text>
  <path d="M 330 108 L 388 108" stroke="#121212" stroke-width="2.5" fill="none" marker-end="url(#jah)"/>
  <rect x="396" y="66" width="300" height="84" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="546" y="102" text-anchor="middle" class="sys mean">Rewriting code they shipped,</text>
  <text x="546" y="126" text-anchor="middle" class="sys mean">on your dime, called tidy-up</text>

  <!-- Row 2 -->
  <rect x="24" y="160" width="300" height="84" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="174" y="196" text-anchor="middle" class="gk term">"We need a</text>
  <text x="174" y="220" text-anchor="middle" class="gk term">Docker upgrade"</text>
  <path d="M 330 202 L 388 202" stroke="#121212" stroke-width="2.5" fill="none" marker-end="url(#jah)"/>
  <rect x="396" y="160" width="300" height="84" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="546" y="196" text-anchor="middle" class="sys mean">Something on the server broke;</text>
  <text x="546" y="220" text-anchor="middle" class="sys mean">can't reproduce it locally</text>

  <!-- Row 3 -->
  <rect x="24" y="254" width="300" height="84" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="174" y="290" text-anchor="middle" class="gk term">"Lots of tech debt</text>
  <text x="174" y="314" text-anchor="middle" class="gk term">to pay down"</text>
  <path d="M 330 296 L 388 296" stroke="#121212" stroke-width="2.5" fill="none" marker-end="url(#jah)"/>
  <rect x="396" y="254" width="300" height="84" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="546" y="290" text-anchor="middle" class="sys mean">We wrote it badly - pay to fix</text>
  <text x="546" y="314" text-anchor="middle" class="sys mean">what you paid us to write</text>

  <!-- Row 4 -->
  <rect x="24" y="348" width="300" height="84" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="174" y="384" text-anchor="middle" class="gk term">"Let's just ship</text>
  <text x="174" y="408" text-anchor="middle" class="gk term">the MVP first"</text>
  <path d="M 330 390 L 388 390" stroke="#121212" stroke-width="2.5" fill="none" marker-end="url(#jah)"/>
  <rect x="396" y="348" width="300" height="84" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="546" y="384" text-anchor="middle" class="sys mean">The cheapest scope we finish</text>
  <text x="546" y="408" text-anchor="middle" class="sys mean">inside the budget you have left</text>

  <!-- Row 5 -->
  <rect x="24" y="442" width="300" height="84" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="174" y="478" text-anchor="middle" class="gk term">"We need to fix</text>
  <text x="174" y="502" text-anchor="middle" class="gk term">the architecture"</text>
  <path d="M 330 484 L 388 484" stroke="#121212" stroke-width="2.5" fill="none" marker-end="url(#jah)"/>
  <rect x="396" y="442" width="300" height="84" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="546" y="478" text-anchor="middle" class="sys mean">We want resume-building tech</text>
  <text x="546" y="502" text-anchor="middle" class="sys mean">the senior dev hasn't tried</text>

  <text x="360" y="562" text-anchor="middle" class="sys cap">Five words. Five invoices. Bring the questions to your next standup.</text>
</svg>
