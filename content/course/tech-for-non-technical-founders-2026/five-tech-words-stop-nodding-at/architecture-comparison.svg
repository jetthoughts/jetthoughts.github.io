<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Healthy Rails monolith versus over-engineered microservice mess for a pre-Series-A startup.</title>
  <desc id="arch-desc">On the left, a healthy Rails monolith in one repo: Hotwire UI, ActiveRecord business logic, one Postgres database, Sidekiq background jobs, and a Kamal deploy - one repo, one full-stack dev ships a feature idea-to-production. On the right, over-engineered: a React frontend, Node API gateway, Auth microservice, Kafka event bus, service mesh, and a two-person platform team - two platform engineers, zero features shipped. Pre-Series-A, under 1 million dollars revenue: the boring choice on the left ships features; the exciting choice on the right ships plumbing.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .ptitle{ font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
      .box   { font-size: 18px; font-weight: 600; fill: #121212; }
      .cap   { font-size: 18px; font-weight: 400; fill: #555555; }
      .foot  { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="480" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="464" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- LEFT: healthy monolith -->
  <text x="188" y="44" text-anchor="middle" class="gk ptitle" fill="#2e7d32">&#10003; HEALTHY monolith</text>
  <rect x="24" y="60" width="328" height="308" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="188" y="90" text-anchor="middle" class="gk box">Rails monolith - one repo</text>

  <rect x="44" y="108" width="140" height="56" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="114" y="142" text-anchor="middle" class="gk box">Hotwire UI</text>
  <rect x="192" y="108" width="140" height="56" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="262" y="142" text-anchor="middle" class="gk box">ActiveRecord</text>
  <rect x="44" y="176" width="140" height="56" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="114" y="210" text-anchor="middle" class="gk box">Postgres</text>
  <rect x="192" y="176" width="140" height="56" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="262" y="210" text-anchor="middle" class="gk box">Sidekiq</text>
  <rect x="118" y="244" width="140" height="56" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="188" y="278" text-anchor="middle" class="gk box">Kamal deploy</text>

  <text x="188" y="336" text-anchor="middle" class="sys cap">1 repo - 1 dev ships</text>
  <text x="188" y="358" text-anchor="middle" class="sys cap">idea-to-production</text>

  <!-- Divider -->
  <line x1="360" y1="60" x2="360" y2="368" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: over-engineered -->
  <text x="532" y="44" text-anchor="middle" class="gk ptitle" fill="#cc342d">&#10007; OVER-ENGINEERED</text>
  <rect x="368" y="60" width="328" height="308" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>

  <!-- tangle connectors (structure, stroked) -->
  <g stroke="#e3b7b5" stroke-width="1.5" fill="none">
    <path d="M 458 118 L 606 118"/>
    <path d="M 458 132 L 606 200"/>
    <path d="M 606 132 L 458 200"/>
    <path d="M 458 214 L 606 282"/>
    <path d="M 606 214 L 458 282"/>
    <path d="M 458 200 L 458 268"/>
  </g>

  <rect x="384" y="90" width="148" height="52" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
  <text x="458" y="122" text-anchor="middle" class="gk box">React frontend</text>
  <rect x="532" y="90" width="148" height="52" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
  <text x="606" y="122" text-anchor="middle" class="gk box">Node gateway</text>
  <rect x="384" y="172" width="148" height="52" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
  <text x="458" y="204" text-anchor="middle" class="gk box">Auth service</text>
  <rect x="532" y="172" width="148" height="52" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
  <text x="606" y="204" text-anchor="middle" class="gk box">Kafka bus</text>
  <rect x="384" y="254" width="148" height="52" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
  <text x="458" y="286" text-anchor="middle" class="gk box">Service mesh</text>
  <rect x="532" y="254" width="148" height="52" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
  <text x="606" y="286" text-anchor="middle" class="gk box">Platform team</text>

  <text x="532" y="336" text-anchor="middle" class="sys cap">2 platform engineers</text>
  <text x="532" y="358" text-anchor="middle" class="sys cap">0 features shipped</text>

  <!-- Bottom caption -->
  <text x="360" y="416" text-anchor="middle" class="sys foot">Pre-Series-A, under $1M revenue: the boring choice ships</text>
  <text x="360" y="442" text-anchor="middle" class="sys foot">features. The exciting choice ships plumbing.</text>
</svg>
