<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="refactor-title refactor-desc">
  <title id="refactor-title">Refactoring, real versus fake.</title>
  <desc id="refactor-desc">One messy 400-line OrdersController forks two ways. The real refactor (green, top): split into small controllers - Cart, Checkout, Receipt - behind the same Stripe webhook with tests staying green, giving the same behavior with cleaner structure and 3-line commits. The fake refactor (ruby, bottom): rewritten into a 3,800-line v2 with the Stripe secret hard-coded, which broke checkout at the board demo and cost a 9,000-dollar invoice. A real refactor leaves a working feature untouched; a fake one rewrites it on your dime.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .laneg { font-size: 20px; font-weight: 700; fill: #2e7d32; }
      .laner { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .ctitle{ font-size: 18px; font-weight: 700; fill: #121212; }
      .body  { font-size: 18px; font-weight: 400; fill: #121212; }
      .win   { font-size: 18px; font-weight: 700; fill: #2e7d32; }
      .lose  { font-size: 18px; font-weight: 700; fill: #cc342d; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="rah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="444" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="42" text-anchor="middle" class="gk title">Refactoring: real vs fake</text>
  <text x="360" y="70" text-anchor="middle" class="gk msg">One messy controller, two ways it lands on your invoice</text>

  <!-- Start card (center) -->
  <g>
    <rect x="24" y="196" width="140" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="94" y="232" text-anchor="middle" class="gk ctitle">OrdersController</text>
    <text x="94" y="258" text-anchor="middle" class="sys body">400 lines, messy</text>
  </g>

  <!-- Fork arrows -->
  <path d="M 164 214 C 184 190, 190 168, 200 152" stroke="#666666" stroke-width="2.25" fill="none" marker-end="url(#rah)"/>
  <path d="M 164 268 C 184 300, 190 322, 200 338" stroke="#666666" stroke-width="2.25" fill="none" marker-end="url(#rah)"/>

  <!-- TOP LANE: REAL -->
  <text x="300" y="112" text-anchor="middle" class="gk laneg">REAL REFACTOR &#10003;</text>
  <g>
    <rect x="200" y="126" width="150" height="76" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.25"/>
    <text x="275" y="158" text-anchor="middle" class="sys body">Split into 3:</text>
    <text x="275" y="182" text-anchor="middle" class="sys body">Cart / Checkout</text>
  </g>
  <path d="M 350 164 L 372 164" stroke="#666666" stroke-width="2.25" fill="none" marker-end="url(#rah)"/>
  <g>
    <rect x="378" y="126" width="150" height="76" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.25"/>
    <text x="453" y="158" text-anchor="middle" class="sys body">Same webhook</text>
    <text x="453" y="182" text-anchor="middle" class="sys body">Tests stay green</text>
  </g>
  <path d="M 528 164 L 550 164" stroke="#666666" stroke-width="2.25" fill="none" marker-end="url(#rah)"/>
  <g>
    <rect x="556" y="118" width="140" height="92" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="3"/>
    <text x="626" y="150" text-anchor="middle" class="gk win">&#10003; Same behavior</text>
    <text x="626" y="176" text-anchor="middle" class="sys body">Cleaner code,</text>
    <text x="626" y="198" text-anchor="middle" class="sys body">3-line commits</text>
  </g>

  <!-- BOTTOM LANE: FAKE -->
  <text x="300" y="322" text-anchor="middle" class="gk laner">FAKE REFACTOR &#10007;</text>
  <g>
    <rect x="200" y="336" width="150" height="76" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.25"/>
    <text x="275" y="368" text-anchor="middle" class="gk ctitle">v2 controller</text>
    <text x="275" y="392" text-anchor="middle" class="sys body">3,800 lines, no tests</text>
  </g>
  <path d="M 350 374 L 372 374" stroke="#666666" stroke-width="2.25" fill="none" marker-end="url(#rah)"/>
  <g>
    <rect x="378" y="336" width="150" height="76" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.25"/>
    <text x="453" y="368" text-anchor="middle" class="sys body">Stripe secret</text>
    <text x="453" y="392" text-anchor="middle" class="sys body">hard-coded</text>
  </g>
  <path d="M 528 374 L 550 374" stroke="#666666" stroke-width="2.25" fill="none" marker-end="url(#rah)"/>
  <g>
    <rect x="556" y="328" width="140" height="92" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="3"/>
    <text x="626" y="360" text-anchor="middle" class="gk lose">&#10007; Broke at demo</text>
    <text x="626" y="386" text-anchor="middle" class="sys body">$9K for the</text>
    <text x="626" y="408" text-anchor="middle" class="sys body">rewrite</text>
  </g>
</svg>
