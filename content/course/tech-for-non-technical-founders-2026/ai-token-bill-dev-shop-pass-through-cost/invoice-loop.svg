<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="il-title">
  <title id="il-title">The month-2 invoice loop. Predict the bill first - devs times cost times margin - then the invoice is just a comparison. Is it within plus-or-minus 20 percent of your prediction? If yes, pay it and set the baseline. If no, 20 percent or more over, demand the itemized breakdown: a hard ticket raises the budget alert, margin or padding gets pushed back citing Clause 1. Quarterly, re-predict from the usage dashboards under Clause 3.</title>
  <desc>Predict the bill first, then the invoice is a comparison. One question - is it within 20 percent of your prediction? - forks two ways. Left, green, yes: pay it and set the baseline for every month after. Right, amber, no, 20 percent or more over: demand the breakdown, a hard ticket raises the budget alert, margin or padding gets pushed back under Clause 1. Footer: quarterly, re-predict from the dashboards under Clause 3.</desc>
  <defs>
    <style>
      .h  { font-family: "Caveat", "Patrick Hand", "Comic Sans MS", cursive; }
      .title{ font-size: 48px; font-weight: 700; fill: #1a1a1a; filter: url(#soft); }
      .sub  { font-size: 24px; fill: #667085; }
      .gate { font-size: 38px; font-weight: 700; fill: #1a1a1a; filter: url(#soft); }
      .cardG{ fill: #f2fbf4; stroke: #57c06f; stroke-width: 3; filter: url(#soft); }
      .cardA{ fill: #fffbeb; stroke: #e2b93b; stroke-width: 3; filter: url(#soft); }
      .yn { font-size: 26px; font-weight: 700; }
      .og { font-size: 30px; font-weight: 700; fill: #2e9e4f; filter: url(#gG); }
      .oa { font-size: 30px; font-weight: 700; fill: #b8860b; filter: url(#gA); }
      .body { font-size: 23px; fill: #1a1a1a; }
      .ok { font-size: 23px; font-weight: 700; fill: #2e9e4f; }
      .bad{ font-size: 23px; font-weight: 700; fill: #e5484d; }
      .foot { font-size: 22px; fill: #667085; font-style: italic; }
      .arG { stroke: #2e9e4f; stroke-width: 5; fill: none; }
      .arA { stroke: #b8860b; stroke-width: 5; fill: none; }
    </style>
    <filter id="soft" x="-10%" y="-14%" width="120%" height="132%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a1a2e" flood-opacity="0.13"/></filter>
    <filter id="gG" x="-25%" y="-45%" width="150%" height="190%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2e9e4f" flood-opacity="0.5"/></filter>
    <filter id="gA" x="-25%" y="-45%" width="150%" height="190%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#e2b93b" flood-opacity="0.55"/></filter>
    <marker id="mG" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#2e9e4f"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#b8860b"/></marker>
  </defs>

  <text x="360" y="60" text-anchor="middle" class="h title">The Month-2 Invoice Loop</text>
  <text x="360" y="98" text-anchor="middle" class="h sub">Predict the bill first - then it's just a comparison.</text>

  <!-- One big decision -->
  <text x="360" y="188" text-anchor="middle" class="h gate">Within &#177;20% of your prediction?</text>

  <text x="176" y="232" text-anchor="middle" class="h yn" fill="#2e9e4f">YES</text>
  <text x="548" y="232" text-anchor="middle" class="h yn" fill="#b8860b">NO</text>
  <path d="M 300 206 C 240 224, 200 232, 190 254" class="arG" marker-end="url(#mG)"/>
  <path d="M 420 206 C 480 224, 520 232, 530 254" class="arA" marker-end="url(#mA)"/>

  <!-- Left: within -->
  <rect x="30" y="258" width="310" height="222" rx="22" class="cardG"/>
  <text x="185" y="312" text-anchor="middle" class="h og">&#10003; Pay it</text>
  <text x="185" y="360" text-anchor="middle" class="h body">Within budget.</text>
  <text x="185" y="394" text-anchor="middle" class="h body">Set the baseline for</text>
  <text x="185" y="428" text-anchor="middle" class="h body">every month after.</text>

  <!-- Right: over -->
  <rect x="380" y="258" width="310" height="222" rx="22" class="cardA"/>
  <text x="535" y="312" text-anchor="middle" class="h oa">&#10007; Demand it</text>
  <text x="404" y="358" class="h body">The itemized breakdown:</text>
  <text x="404" y="398" class="h body"><tspan class="ok">&#10003;</tspan> a hard ticket is real</text>
  <text x="404" y="436" class="h body"><tspan class="bad">&#10007;</tspan> padding - cite Clause 1</text>

  <text x="360" y="540" text-anchor="middle" class="h foot">Quarterly, re-predict from the dashboards (Clause 3).</text>
</svg>
