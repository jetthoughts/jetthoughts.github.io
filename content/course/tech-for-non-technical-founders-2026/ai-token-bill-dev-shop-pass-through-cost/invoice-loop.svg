<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" role="img" aria-labelledby="il-title il-desc">
  <title id="il-title">The month-2 invoice loop: sign the SOW with the 3 clauses, predict the bill, then compare the invoice. Within plus-or-minus 20 percent, pay it and mark the baseline. 20 percent or more over, demand the itemized breakdown.</title>
  <desc id="il-desc">Three numbered step cards in a row: sign the SOW with the 3 clauses, predict the bill with the formula devs times average AI cost times margin, and the month-2 invoice lands - compare it to the prediction. The invoice step forks into two outcome cards. Green card: within plus-or-minus 20 percent of the prediction - pay it and mark it the baseline for every month after. Amber card: 20 percent or more over - demand the itemized breakdown; a check line says one dev hit a hard ticket, raise the budget alert; a cross line says margin or padding gets pushed back, citing Clause 1. A dashed loop returns to the predict step: quarterly, open the usage dashboards yourself under Clause 3, then re-predict next month's bill.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .step  { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .sub   { font-size: 18px; font-weight: 400; fill: #555555; }
      .outg  { font-size: 20px; font-weight: 700; fill: #2e7d32; }
      .outa  { font-size: 20px; font-weight: 700; fill: #9a6a00; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .ok    { font-size: 18px; font-weight: 400; fill: #1b5e20; }
      .bad   { font-size: 18px; font-weight: 400; fill: #b3261e; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="il-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
    <marker id="il-trg" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="720" height="556" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="540" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The month-2 invoice loop</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Predict the bill first - the invoice becomes a comparison</text>

  <!-- Step 1 -->
  <g transform="translate(24,100)">
    <rect width="212" height="92" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="28" cy="28" r="13" fill="#121212"/>
    <text x="28" y="34" text-anchor="middle" class="gk num">1</text>
    <text x="52" y="35" class="gk step">Sign the SOW</text>
    <text x="18" y="66" class="sys sub">with the 3 clauses</text>
    <text x="18" y="86" class="sys sub">below</text>
  </g>
  <!-- Step 2 -->
  <g transform="translate(254,100)">
    <rect width="212" height="92" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="28" cy="28" r="13" fill="#121212"/>
    <text x="28" y="34" text-anchor="middle" class="gk num">2</text>
    <text x="52" y="35" class="gk step">Predict the bill</text>
    <text x="18" y="66" class="sys sub">devs x avg AI cost</text>
    <text x="18" y="86" class="sys sub">x margin</text>
  </g>
  <!-- Step 3 -->
  <g transform="translate(484,100)">
    <rect width="212" height="92" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="28" cy="28" r="13" fill="#121212"/>
    <text x="28" y="34" text-anchor="middle" class="gk num">3</text>
    <text x="52" y="35" class="gk step">Invoice lands</text>
    <text x="18" y="66" class="sys sub">compare it to the</text>
    <text x="18" y="86" class="sys sub">prediction</text>
  </g>

  <!-- Step arrows -->
  <line x1="236" y1="146" x2="254" y2="146" stroke="#3a3a3a" stroke-width="2" marker-end="url(#il-tri)"/>
  <line x1="466" y1="146" x2="484" y2="146" stroke="#3a3a3a" stroke-width="2" marker-end="url(#il-tri)"/>

  <!-- Fork arrows from step 3 down to outcomes -->
  <path d="M 560 192 C 470 224, 300 224, 216 250" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#il-tri)"/>
  <path d="M 610 192 C 610 220, 570 232, 540 250" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#il-tri)"/>

  <!-- Outcome: within band (success = green) -->
  <g transform="translate(24,254)">
    <rect width="324" height="128" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="18" y="34" class="gk outg">Within +/-20% of prediction</text>
    <text x="18" y="66" class="sys body">Pay it. Mark it as the</text>
    <text x="18" y="90" class="sys body">baseline for every</text>
    <text x="18" y="114" class="sys body">month after.</text>
  </g>

  <!-- Outcome: over band (warning = amber) -->
  <g transform="translate(372,254)">
    <rect width="324" height="128" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="18" y="34" class="gk outa">20%+ over: get the breakdown</text>
    <text x="18" y="66" class="sys ok">+ hard ticket - raise the alert,</text>
    <text x="36" y="88" class="sys body">carry on.</text>
    <text x="18" y="114" class="sys bad">- padding - push back, cite Clause 1.</text>
  </g>

  <!-- Quarterly loop back to step 2 -->
  <path d="M 534 382 C 430 412, 200 410, 130 384 L 130 194" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#il-trg)"/>
  <text x="360" y="428" text-anchor="middle" class="sys note">Quarterly: open the usage dashboards yourself (Clause 3),</text>
  <text x="360" y="452" text-anchor="middle" class="sys note">then re-predict next month's bill.</text>

  <text x="360" y="524" text-anchor="middle" class="sys basis">Basis: a signed SOW plus one predicted number turns every invoice into a check</text>
</svg>
