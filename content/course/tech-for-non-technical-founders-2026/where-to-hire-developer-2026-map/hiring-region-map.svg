<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" role="img" aria-labelledby="hm-title hm-desc">
  <title id="hm-title">Where to hire in 2026: four region cards - Onshore US/EU, Nearshore LATAM, Tier-2 India, Mass-market Upwork - each with a rate band, a pick-when, and a watch-out.</title>
  <desc id="hm-desc">A two-by-two grid of region cards, the pay rate in green. Onshore US/EU, ruby border for highest cost: $130-210K+ a year, 30-60 days; pick for a regulated industry or a board-mandated US team; watch for a low accept rate and the worst cost-to-output. Nearshore LATAM, neutral border and a Default 2026 badge: $45-100 an hour, roughly $90-200K a year annualized, 2-5 days; pick for real-time overlap on pairing, calls and standups; watch that rates compress in the top metros. Tier-2 India, purple border for the async alternative: $15-70 an hour, roughly $30-140K a year, 1-5 days; pick for backend-heavy async-OK work in Jaipur, Kochi, Indore or Coimbatore; watch for no 9am Pacific standups. Mass-market Upwork, amber border for heaviest watch-outs: $35-120 an hour project-based, 1-3 days; pick for a one-off landing page, logo or scraper; watch that it is not for backend, payments or auth. A legend maps the four border colors and notes green marks the pay rate.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .region { font-size: 20px; font-weight: 700; fill: #121212; }
      .rate  { font-size: 18px; font-weight: 700; fill: #1b5e20; }
      .line  { font-size: 18px; font-weight: 400; fill: #333333; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .leg   { font-size: 17px; font-weight: 400; fill: #333333; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="524" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="508" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Where to hire in 2026</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Four regions - rate band, pick-when, watch-out</text>

  <!-- Card 1: Onshore (ruby = highest cost) -->
  <g transform="translate(24,96)">
    <rect width="324" height="172" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <text x="18" y="32" class="gk region">Onshore (US / EU)</text>
    <text x="18" y="60" class="sys rate">$130-210K+/yr - 30-60 days</text>
    <text x="18" y="92"  class="sys line">Pick: regulated or board-</text>
    <text x="18" y="114" class="sys line">mandated US team</text>
    <text x="18" y="150" class="sys line">Watch: low accept, worst cost</text>
  </g>

  <!-- Card 2: Nearshore (neutral = default) -->
  <g transform="translate(372,96)">
    <rect width="324" height="172" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="196" y="14" width="112" height="24" rx="4" fill="#3a3a3a"/>
    <text x="252" y="31" text-anchor="middle" class="gk badge">Default 2026</text>
    <text x="18" y="32" class="gk region">Nearshore (LATAM)</text>
    <text x="18" y="60" class="sys rate">$45-100/hr ($90-200K/yr) - 2-5d</text>
    <text x="18" y="92"  class="sys line">Pick: real-time overlap for</text>
    <text x="18" y="114" class="sys line">pairing, calls, standups</text>
    <text x="18" y="150" class="sys line">Watch: rates compress in metros</text>
  </g>

  <!-- Card 3: Tier-2 India (purple = async alternative) -->
  <g transform="translate(24,284)">
    <rect width="324" height="172" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="32" class="gk region">Tier-2 India</text>
    <text x="18" y="60" class="sys rate">$15-70/hr ($30-140K/yr) - 1-5d</text>
    <text x="18" y="92"  class="sys line">Pick: backend-heavy, async OK -</text>
    <text x="18" y="114" class="sys line">Jaipur, Kochi, Indore, Coimbatore</text>
    <text x="18" y="150" class="sys line">Watch: no 9am Pacific standups</text>
  </g>

  <!-- Card 4: Mass-market (amber = heaviest watch-outs) -->
  <g transform="translate(372,284)">
    <rect width="324" height="172" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="18" y="32" class="gk region">Mass-market (Upwork)</text>
    <text x="18" y="60" class="sys rate">$35-120/hr project-based - 1-3d</text>
    <text x="18" y="92"  class="sys line">Pick: a one-off landing page,</text>
    <text x="18" y="114" class="sys line">logo, or scraper</text>
    <text x="18" y="150" class="sys line">Watch: not backend/payments/auth</text>
  </g>

  <!-- Legend -->
  <g transform="translate(24,470)">
    <rect x="0"   y="0" width="14" height="14" rx="2" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <text x="20"  y="12" class="sys leg">Ruby: top cost</text>
    <rect x="168" y="0" width="14" height="14" rx="2" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="188" y="12" class="sys leg">Neutral: default</text>
    <rect x="348" y="0" width="14" height="14" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="368" y="12" class="sys leg">Purple: async alt</text>
    <rect x="540" y="0" width="14" height="14" rx="2" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="560" y="12" class="sys leg">Amber: caution</text>
  </g>

  <text x="360" y="510" text-anchor="middle" class="sys basis">Basis: 2026 market rates - green marks the pay rate; annual figures are annualized</text>
</svg>
