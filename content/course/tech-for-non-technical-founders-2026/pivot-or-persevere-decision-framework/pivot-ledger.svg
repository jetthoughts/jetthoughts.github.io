<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 588" role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">The pivot ledger: eight rows tracking what survives a pivot and what you rewrite, with the source module and the action for each.</title>
  <desc id="pl-desc">Eight rows, each with an evidence type, its source module, a coloured verdict, and an action. Customer relationships (Lesson 5.2 outreach) - green YES - re-pitch the new hypothesis. Validated problem (Lesson 2.5) - green YES - carry forward as the anchor. Disconfirmed problem (Lesson 2.3 / churn triage) - green YES, negative - add to the do-not-chase list. Cohort retention numbers (churn-triage floor) - green YES - baseline for the next cohort. Hypothesis sentence (Lesson 1.1) - ruby REWRITE - new blanks, same template. Landing page copy (Lesson 1.2) - ruby REWRITE - new headline and CTA. Built MVP code (Lessons 4.3-4.4 / hire track) - amber DEPENDS - keep auth and billing, swap the core. Founder energy and domain (not applicable) - green YES - the whole reason to pivot. Closing line: walk every row before declaring the pivot; the evidence column is the difference between a pivot and a flail.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .colh  { font-size: 17px; font-weight: 700; fill: #777777; }
      .ev    { font-size: 18px; font-weight: 700; fill: #121212; }
      .src   { font-size: 17px; font-weight: 400; fill: #777777; }
      .vlab  { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .act   { font-size: 18px; font-weight: 400; fill: #333333; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="588" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="572" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The pivot ledger: keep or rewrite</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">A pivot is not a restart - the evidence is the difference</text>

  <!-- column headers -->
  <text x="24"  y="100" class="gk colh">Evidence (source)</text>
  <text x="336" y="100" class="gk colh">Survives?</text>
  <text x="470" y="100" class="gk colh">Action</text>
  <line x1="24" y1="108" x2="696" y2="108" stroke="#e2e2e2" stroke-width="1.5"/>

  <!-- rows: helper macro laid out manually -->
  <!-- Row 1 -->
  <g transform="translate(0,114)">
    <text x="24" y="20" class="gk ev">Customer relationships</text>
    <text x="24" y="40" class="sys src">Lesson 5.2 outreach</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#2e7d32"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">YES</text>
    <text x="470" y="28" class="sys act">Re-pitch new hypothesis</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(0,166)">
    <text x="24" y="20" class="gk ev">Validated problem</text>
    <text x="24" y="40" class="sys src">Lesson 2.5</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#2e7d32"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">YES</text>
    <text x="470" y="28" class="sys act">Carry forward as anchor</text>
  </g>
  <!-- Row 3 -->
  <g transform="translate(0,218)">
    <text x="24" y="20" class="gk ev">Disconfirmed problem</text>
    <text x="24" y="40" class="sys src">Lesson 2.3 / churn triage</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#2e7d32"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">YES (neg)</text>
    <text x="470" y="28" class="sys act">Add to do-not-chase list</text>
  </g>
  <!-- Row 4 -->
  <g transform="translate(0,270)">
    <text x="24" y="20" class="gk ev">Cohort retention</text>
    <text x="24" y="40" class="sys src">Churn-triage floor</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#2e7d32"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">YES</text>
    <text x="470" y="28" class="sys act">Baseline for next cohort</text>
  </g>
  <!-- Row 5 -->
  <g transform="translate(0,322)">
    <text x="24" y="20" class="gk ev">Hypothesis sentence</text>
    <text x="24" y="40" class="sys src">Lesson 1.1</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#cc342d"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">REWRITE</text>
    <text x="470" y="28" class="sys act">New blanks, same template</text>
  </g>
  <!-- Row 6 -->
  <g transform="translate(0,374)">
    <text x="24" y="20" class="gk ev">Landing page copy</text>
    <text x="24" y="40" class="sys src">Lesson 1.2</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#cc342d"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">REWRITE</text>
    <text x="470" y="28" class="sys act">New headline + CTA</text>
  </g>
  <!-- Row 7 -->
  <g transform="translate(0,426)">
    <text x="24" y="20" class="gk ev">Built MVP code</text>
    <text x="24" y="40" class="sys src">Lesson 4.3-4.4 / hire track</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#c47d16"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">DEPENDS</text>
    <text x="470" y="28" class="sys act">Keep auth, swap the core</text>
  </g>
  <!-- Row 8 -->
  <g transform="translate(0,478)">
    <text x="24" y="20" class="gk ev">Founder energy / domain</text>
    <text x="24" y="40" class="sys src">Not tied to one lesson</text>
    <rect x="336" y="8" width="104" height="26" rx="4" fill="#2e7d32"/>
    <text x="388" y="26" text-anchor="middle" class="gk vlab">YES</text>
    <text x="470" y="28" class="sys act">The whole reason to pivot</text>
  </g>

  <text x="360" y="560" text-anchor="middle" class="sys basis">Basis: walk every row before declaring the pivot - the discipline is what separates it from a flail</text>
</svg>
