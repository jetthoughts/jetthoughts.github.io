<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="pw-title pw-desc">
  <title id="pw-title">Six pivot types branching from the same founding hypothesis: customer segment, customer need, solution, technology, channel, and revenue model - each keeps what works and replaces what does not.</title>
  <desc id="pw-desc">A hub node reads Founding Hypothesis - 5 blanks, 1 is wrong - and branches into six pivot-type cards. 1 Customer Segment: right product, wrong customer - e.g. an SMB tool sold to enterprise. 2 Customer Need: right customer, wrong problem - e.g. dentists want billing, not scheduling. 3 Solution: right problem, wrong solution - e.g. a dashboard, not a workflow. 4 Technology: right solution, wrong stack - e.g. native, not Bubble. 5 Channel: right product, wrong distribution - e.g. product-led, not outbound. 6 Revenue Model: right product, wrong pricing - e.g. per-seat, not per-event.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .hub   { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .hubsub { font-size: 18px; font-weight: 400; fill: #e8e8e8; }
      .plab  { font-size: 20px; font-weight: 700; fill: #121212; }
      .pbody { font-size: 18px; font-weight: 400; fill: #333333; }
      .pex   { font-size: 17px; font-weight: 400; fill: #777777; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="pw-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="580" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="564" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Six pivot types from one hypothesis</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Keep what works, replace what does not</text>

  <!-- Hub -->
  <g transform="translate(220,94)">
    <rect width="280" height="62" rx="4" fill="#121212"/>
    <text x="140" y="30" text-anchor="middle" class="gk hub">Founding Hypothesis</text>
    <text x="140" y="50" text-anchor="middle" class="sys hubsub">5 blanks - 1 is wrong</text>
  </g>
  <line x1="360" y1="156" x2="360" y2="176" stroke="#3a3a3a" stroke-width="2" marker-end="url(#pw-tri)"/>

  <!-- Grid of 6 pivot types -->
  <!-- 1 -->
  <g transform="translate(24,182)">
    <rect width="324" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk plab">1 - Customer Segment</text>
    <text x="18" y="64" class="sys pbody">Right product, wrong customer</text>
    <text x="18" y="90" class="sys pex">e.g. SMB tool sold to enterprise</text>
  </g>
  <!-- 2 -->
  <g transform="translate(372,182)">
    <rect width="324" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk plab">2 - Customer Need</text>
    <text x="18" y="64" class="sys pbody">Right customer, wrong problem</text>
    <text x="18" y="90" class="sys pex">e.g. dentists want billing, not scheduling</text>
  </g>
  <!-- 3 -->
  <g transform="translate(24,298)">
    <rect width="324" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk plab">3 - Solution</text>
    <text x="18" y="64" class="sys pbody">Right problem, wrong solution</text>
    <text x="18" y="90" class="sys pex">e.g. a dashboard, not a workflow</text>
  </g>
  <!-- 4 -->
  <g transform="translate(372,298)">
    <rect width="324" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk plab">4 - Technology</text>
    <text x="18" y="64" class="sys pbody">Right solution, wrong stack</text>
    <text x="18" y="90" class="sys pex">e.g. native, not Bubble</text>
  </g>
  <!-- 5 -->
  <g transform="translate(24,414)">
    <rect width="324" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk plab">5 - Channel</text>
    <text x="18" y="64" class="sys pbody">Right product, wrong distribution</text>
    <text x="18" y="90" class="sys pex">e.g. product-led, not outbound</text>
  </g>
  <!-- 6 -->
  <g transform="translate(372,414)">
    <rect width="324" height="104" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk plab">6 - Revenue Model</text>
    <text x="18" y="64" class="sys pbody">Right product, wrong pricing</text>
    <text x="18" y="90" class="sys pex">e.g. per-seat, not per-event</text>
  </g>

  <text x="360" y="548" text-anchor="middle" class="sys basis">Basis: one wrong blank in the hypothesis names which pivot you actually need</text>
</svg>
