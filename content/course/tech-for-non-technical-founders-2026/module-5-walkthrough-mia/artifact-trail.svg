<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" role="img" aria-labelledby="m5-trail-title m5-trail-desc">
  <title id="m5-trail-title">A notebook line to a stranger's money: Mia's Module 5 trail runs a 40% test to a warm 50-name list to a signed paid pilot to a complete Founder OS.</title>
  <desc id="m5-trail-desc">A vertical trail of four artifact cards. 5.1 The 40% must-have test scored 55% in her niche. 5.3-5.5 Warm 50 list drew 22 replies and 9 demos booked. 5.6 Signed pilot, the payoff, a Design Partner Agreement with the deposit cleared via Stripe - first money from the product. 5.1-5.6 Founder OS complete, hypothesis to signed pilot, the full evidence pack. Basis: Mia's Module 5 deliverables, the full evidence pack.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .pill  { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .name  { font-size: 20px; font-weight: 700; fill: #121212; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
      .metric{ font-size: 30px; font-weight: 700; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="m5-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="612" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="596" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block -->
  <text x="360" y="50" text-anchor="middle" class="gk title">A notebook line to a stranger's money</text>
  <text x="360" y="82" text-anchor="middle" class="gk msg">Mia's Module 5 trail - test niche to a signed paid pilot</text>

  <!-- Card 1: 40% must-have test -->
  <g>
    <rect x="24" y="104" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="140" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="161" text-anchor="middle" class="gk pill">5.1</text>
    <text x="156" y="148" class="gk name">40% must-have test</text>
    <text x="156" y="174" class="sys note">In her must-have niche</text>
    <text x="684" y="168" text-anchor="end" class="gk metric" fill="#2e7d32">55%</text>
  </g>
  <line x1="360" y1="210" x2="360" y2="222" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m5-tri)"/>

  <!-- Card 2: Warm 50 list -->
  <g>
    <rect x="24" y="224" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="260" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="281" text-anchor="middle" class="gk pill">5.3-5.5</text>
    <text x="156" y="268" class="gk name">Warm 50 list</text>
    <text x="156" y="294" class="sys note">9 demos booked</text>
    <text x="684" y="288" text-anchor="end" class="gk metric" fill="#121212">22 replies</text>
  </g>
  <line x1="360" y1="330" x2="360" y2="342" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m5-tri)"/>

  <!-- Card 3: Signed pilot (payoff, first money = green) -->
  <g>
    <rect x="24" y="344" width="672" height="104" rx="6" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <rect x="44" y="380" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="401" text-anchor="middle" class="gk pill">5.6</text>
    <text x="156" y="380" class="gk name">Signed pilot</text>
    <text x="156" y="404" class="sys note">Design Partner Agreement, deposit via Stripe</text>
    <text x="156" y="428" class="sys note">First money from the product</text>
    <text x="684" y="404" text-anchor="end" class="gk metric" fill="#2e7d32">PAID</text>
  </g>
  <line x1="360" y1="450" x2="360" y2="462" stroke="#3a3a3a" stroke-width="2" marker-end="url(#m5-tri)"/>

  <!-- Card 4: Founder OS complete -->
  <g>
    <rect x="24" y="464" width="672" height="104" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="44" y="500" width="92" height="32" rx="6" fill="#121212"/>
    <text x="90" y="521" text-anchor="middle" class="gk pill">5.1-5.6</text>
    <text x="156" y="500" class="gk name">Founder OS complete</text>
    <text x="156" y="524" class="sys note">Hypothesis to signed pilot</text>
    <text x="156" y="548" class="sys note">The full evidence pack</text>
  </g>

  <!-- one basis line -->
  <text x="360" y="592" text-anchor="middle" class="sys basis">Basis: Mia's Module 5 deliverables, the full evidence pack</text>
</svg>
