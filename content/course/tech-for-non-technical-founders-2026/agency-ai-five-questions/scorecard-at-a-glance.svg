<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="asc-title asc-desc">
  <title id="asc-title">The five agency AI questions on one card: the pass signal and the fail signal for each, scored 1 or 0.</title>
  <desc id="asc-desc">Five question cards, each with a green Pass line worth 1 point and a ruby Fail line worth 0. Q1 Workflow, ticket to code - Pass: names tools by version plus a real pull request; Fail: "Senior decides", no PR. Q2 Cost per dev per month and who pays - Pass: a dollar range plus pass-through in the SOW; Fail: "Included in the rate". Q3 Verify, reviewer checks - Pass: opens a real PR and names the checks; Fail: "We trust the model or CI". Q4 Slopsquatting defence - Pass: an allowlist or scanner and says the word; Fail: "Our devs know packages". Q5 Accountability - Pass: a dated incident and the root cause; Fail: "Never had one" or "not my job". A closing rule: a total of 2 or fewer out of 5 means do not sign, no matter how good the pitch.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .qlab  { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .pass  { font-size: 18px; font-weight: 400; fill: #1b5e20; }
      .fail  { font-size: 18px; font-weight: 400; fill: #b3261e; }
      .rule  { font-size: 18px; font-weight: 700; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="700" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="684" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Score the call from this card</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">1 point for a Pass answer, 0 for a Fail - score in real time</text>

  <!-- Q1 -->
  <g transform="translate(24,100)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">1</text>
    <text x="56" y="35" class="gk qlab">Workflow: ticket to code</text>
    <text x="18" y="60" class="sys pass">Pass: tools by version + a real PR</text>
    <text x="18" y="82" class="sys fail">Fail: "Senior decides", no PR</text>
  </g>

  <!-- Q2 -->
  <g transform="translate(24,200)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">2</text>
    <text x="56" y="35" class="gk qlab">Cost: $ per dev per month, who pays</text>
    <text x="18" y="60" class="sys pass">Pass: a $ range + pass-through in the SOW</text>
    <text x="18" y="82" class="sys fail">Fail: "Included in the rate"</text>
  </g>

  <!-- Q3 -->
  <g transform="translate(24,300)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">3</text>
    <text x="56" y="35" class="gk qlab">Verify: reviewer checks</text>
    <text x="18" y="60" class="sys pass">Pass: opens a real PR, names the checks</text>
    <text x="18" y="82" class="sys fail">Fail: "We trust the model / CI"</text>
  </g>

  <!-- Q4 -->
  <g transform="translate(24,400)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">4</text>
    <text x="56" y="35" class="gk qlab">Slopsquatting defence</text>
    <text x="18" y="60" class="sys pass">Pass: an allowlist / scanner + says the word</text>
    <text x="18" y="82" class="sys fail">Fail: "Our devs know packages"</text>
  </g>

  <!-- Q5 -->
  <g transform="translate(24,500)">
    <rect width="672" height="90" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="14" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">5</text>
    <text x="56" y="35" class="gk qlab">Accountability: owned it</text>
    <text x="18" y="60" class="sys pass">Pass: a dated incident + the root cause</text>
    <text x="18" y="82" class="sys fail">Fail: "Never had one" / "not my job"</text>
  </g>

  <text x="360" y="638" text-anchor="middle" class="sys rule">Total of 2 or fewer out of 5 - do not sign, no matter the pitch</text>
  <text x="360" y="668" text-anchor="middle" class="sys basis">Basis: score in real time on the call, not from memory afterwards</text>
</svg>
