<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="protobuild-title protobuild-desc">
  <title id="protobuild-title">Three moves in Lovable turn the prompt template into a shareable 3-screen prototype.</title>
  <desc id="protobuild-desc">A left-to-right flow. Step 1 Paste (open Lovable): drop in the prompt template with your placeholders filled. Step 2 Reword (say it aloud): swap in the words you heard in interviews. Step 3 Test (yourself): click all three screens as if new to the idea. Output, marked purple: prototype ready, share the link to 5 Mom Test interviewees. The ruby reading: stop at three screens - a fourth turns the prototype into the MVP. Basis: a 3-screen clickable prototype built in Lovable.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .label { font-size: 20px; font-weight: 600; fill: #121212; }
      .plabel{ font-size: 20px; font-weight: 600; fill: #9333c4; }
      .cap   { font-size: 17px; font-weight: 600; fill: #6a6a6a; }
      .num   { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .ruby  { font-size: 18px; font-weight: 400; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="pb-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="430" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="414" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="48" text-anchor="middle" class="gk title">Build the 3-screen prototype in three moves</text>
  <text x="360" y="80" text-anchor="middle" class="gk msg">Fill the template, match their words, then hand out the link</text>

  <!-- Step 1 -->
  <rect x="24" y="112" width="158" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="48" cy="136" r="13" fill="#3a3a3a"/>
  <text x="48" y="142" text-anchor="middle" class="gk num">1</text>
  <text x="70" y="141" class="gk cap">Open Lovable</text>
  <text x="40" y="178" class="gk label">Paste</text>
  <text x="40" y="206" class="sys body">The prompt</text>
  <text x="40" y="228" class="sys body">template with</text>
  <text x="40" y="250" class="sys body">blanks filled</text>

  <!-- Step 2 -->
  <rect x="198" y="112" width="158" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="222" cy="136" r="13" fill="#3a3a3a"/>
  <text x="222" y="142" text-anchor="middle" class="gk num">2</text>
  <text x="244" y="141" class="gk cap">Say it aloud</text>
  <text x="214" y="178" class="gk label">Reword</text>
  <text x="214" y="206" class="sys body">Swap in the</text>
  <text x="214" y="228" class="sys body">words you</text>
  <text x="214" y="250" class="sys body">heard aloud</text>

  <!-- Step 3 -->
  <rect x="372" y="112" width="158" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="396" cy="136" r="13" fill="#3a3a3a"/>
  <text x="396" y="142" text-anchor="middle" class="gk num">3</text>
  <text x="418" y="141" class="gk cap">Test yourself</text>
  <text x="388" y="178" class="gk label">Click</text>
  <text x="388" y="206" class="sys body">All 3 screens</text>
  <text x="388" y="228" class="sys body">as if new to</text>
  <text x="388" y="250" class="sys body">your idea</text>

  <!-- Output (purple = the prototype deliverable) -->
  <rect x="546" y="112" width="150" height="160" rx="4" fill="#ffffff" stroke="#9333c4" stroke-width="2"/>
  <text x="621" y="146" text-anchor="middle" class="gk plabel">READY</text>
  <text x="621" y="180" text-anchor="middle" class="sys body">Share the link</text>
  <text x="621" y="202" text-anchor="middle" class="sys body">to 5 Mom Test</text>
  <text x="621" y="224" text-anchor="middle" class="sys body">interviewees</text>

  <!-- orthogonal connectors, filled triangle -->
  <g stroke="#3a3a3a" stroke-width="2" fill="none">
    <line x1="184" y1="192" x2="196" y2="192" marker-end="url(#pb-tri)"/>
    <line x1="358" y1="192" x2="370" y2="192" marker-end="url(#pb-tri)"/>
    <line x1="532" y1="192" x2="544" y2="192" marker-end="url(#pb-tri)"/>
  </g>

  <!-- the one reading (ruby hero line) -->
  <text x="360" y="322" text-anchor="middle" class="sys ruby">The constraint is the test - stop at three screens.</text>
  <text x="360" y="348" text-anchor="middle" class="sys ruby">A fourth turns the prototype into the MVP.</text>

  <!-- one basis line -->
  <text x="360" y="408" text-anchor="middle" class="sys basis">Basis: a 3-screen clickable prototype built in Lovable</text>
</svg>
