<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="bd-title bd-desc">
  <title id="bd-title">The Day-3 bump: two honest variants. Pick the one that matches your situation. Never claim conversations you have not had.</title>
  <desc id="bd-desc">A single "Send a Day-3 bump" card at the top - if the Day-0 message got no reply, bump once. It forks into two variant cards. Purple, the alternate path, "First research round": "I'm early in this research - your experience is exactly what I want to learn from." Curiosity is the hook, no credentials needed. Amber, a warning, "Already interviewed": "I've talked to [TRUE NUMBER] people - yours is the situation they kept pointing at." Social proof with a true number only. A ruby rule at the bottom: never claim conversations you have not had.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .step  { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .sub   { font-size: 18px; font-weight: 400; fill: #555555; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .lab   { font-size: 18px; font-weight: 700; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .note  { font-size: 18px; font-weight: 400; fill: #666666; }
      .rule  { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="bd-trp" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/>
    </marker>
    <marker id="bd-tra" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#c47d16"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="484" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The Day-3 bump: pick your honest variant</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">No reply from Day 0? Send exactly one bump.</text>

  <!-- Center: send bump -->
  <g transform="translate(210,98)">
    <rect width="300" height="72" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="28" r="13" fill="#121212"/>
    <text x="30" y="34" text-anchor="middle" class="gk num">2</text>
    <text x="54" y="34" class="gk step">Send a Day-3 bump</text>
    <text x="18" y="60" class="sys sub">No reply from Day 0? Bump once.</text>
  </g>

  <!-- Fork arrows -->
  <path d="M 300 170 C 240 200, 190 214, 176 250" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#bd-trp)"/>
  <path d="M 420 170 C 480 200, 530 214, 544 250" fill="none" stroke="#c47d16" stroke-width="2" marker-end="url(#bd-tra)"/>
  <rect x="196" y="200" width="112" height="24" rx="4" fill="#ffffff"/>
  <text x="252" y="217" text-anchor="middle" class="gk lab" fill="#7c3aed">first round?</text>
  <rect x="412" y="200" width="112" height="24" rx="4" fill="#ffffff"/>
  <text x="468" y="217" text-anchor="middle" class="gk lab" fill="#c47d16">interviewed?</text>

  <!-- Left: First research round (purple = alternate) -->
  <g transform="translate(24,252)">
    <rect width="324" height="152" rx="4" fill="#f7ecff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="18" y="14" width="182" height="24" rx="4" fill="#7c3aed"/>
    <text x="109" y="31" text-anchor="middle" class="gk badge">First research round</text>
    <text x="18" y="62"  class="sys body">"I'm early in this research -</text>
    <text x="18" y="86"  class="sys body">your experience is exactly</text>
    <text x="18" y="110" class="sys body">what I want to learn from."</text>
    <text x="18" y="140" class="sys note">Curiosity is the hook. No credentials.</text>
  </g>

  <!-- Right: Already interviewed (amber = warning) -->
  <g transform="translate(372,252)">
    <rect width="324" height="152" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <rect x="18" y="14" width="176" height="24" rx="4" fill="#c47d16"/>
    <text x="106" y="31" text-anchor="middle" class="gk badge">Already interviewed</text>
    <text x="18" y="62"  class="sys body">"I've talked to [TRUE NUMBER]</text>
    <text x="18" y="86"  class="sys body">people - yours is the situation</text>
    <text x="18" y="110" class="sys body">they kept pointing at."</text>
    <text x="18" y="140" class="sys note">Social proof, a true number only.</text>
  </g>

  <!-- Bottom rule (ruby = anti-pattern) -->
  <g transform="translate(24,420)">
    <rect width="672" height="40" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2"/>
    <text x="336" y="27" text-anchor="middle" class="gk rule">Never claim conversations you have not had.</text>
  </g>

  <text x="360" y="484" text-anchor="middle" class="sys basis">Basis: one bump per contact, sent by hand, matched to where you actually are</text>
</svg>
