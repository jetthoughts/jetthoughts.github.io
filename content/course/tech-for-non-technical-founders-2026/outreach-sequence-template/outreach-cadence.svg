<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 618" role="img" aria-labelledby="oc-title oc-desc">
  <title id="oc-title">The 3-message outreach cadence: Day 0 names their exact words, Day 3 bumps with the honest variant, Day 7 closes leaving the door open. A handful a day, by hand - a stagger beats a burst.</title>
  <desc id="oc-desc">Three day-step cards stacked top to bottom. Day 0, first message: email or DM whose subject names their exact words from the post you found in Lesson 2.3. Day 3, bump: pick one honest variant - a purple "first round" line for honest curiosity about their post, or an amber "already interviewed" line for social proof with a true number only. Day 7, close: a last note, no pressure - "even two sentences by email would help." Below, a purple LinkedIn DM opener leads with the comment they wrote and asks for 20 minutes this week. A tracker strip lists the spreadsheet columns: Sent, Bumped, Replied, Booked, and a green Done. A ruby rule closes it: never bump someone who has replied, and never claim conversations you have not had.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .day   { font-size: 20px; font-weight: 700; fill: #121212; }
      .tag   { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .var-p { font-size: 18px; font-weight: 400; fill: #7c3aed; }
      .var-a { font-size: 18px; font-weight: 400; fill: #9a6a00; }
      .lnk   { font-size: 18px; font-weight: 400; fill: #333333; }
      .trkh  { font-size: 18px; font-weight: 700; fill: #121212; }
      .cell  { font-size: 17px; font-weight: 400; fill: #444444; }
      .cellg { font-size: 17px; font-weight: 700; fill: #1b5e20; }
      .rule  { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="oc-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="618" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="602" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The 3-message outreach cadence</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">A handful a day, by hand - a stagger beats a burst</text>

  <!-- Day 0 -->
  <g transform="translate(24,96)">
    <rect width="672" height="72" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="32" class="gk day">Day 0</text>
    <rect x="86" y="16" width="126" height="24" rx="4" fill="#cc342d"/>
    <text x="149" y="33" text-anchor="middle" class="gk tag">first message</text>
    <text x="18" y="60" class="sys body">Email or DM - subject names their exact words (post from 2.3)</text>
  </g>
  <line x1="360" y1="168" x2="360" y2="182" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>

  <!-- Day 3 -->
  <g transform="translate(24,184)">
    <rect width="672" height="92" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="32" class="gk day">Day 3</text>
    <rect x="86" y="16" width="70" height="24" rx="4" fill="#c47d16"/>
    <text x="121" y="33" text-anchor="middle" class="gk tag">bump</text>
    <text x="18" y="60" class="sys var-p">First round: honest curiosity about their post</text>
    <text x="18" y="82" class="sys var-a">Already interviewed: social proof, a true number only</text>
  </g>
  <line x1="360" y1="276" x2="360" y2="290" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>

  <!-- Day 7 -->
  <g transform="translate(24,292)">
    <rect width="672" height="72" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="32" class="gk day">Day 7</text>
    <rect x="86" y="16" width="66" height="24" rx="4" fill="#2e7d32"/>
    <text x="119" y="33" text-anchor="middle" class="gk tag">close</text>
    <text x="18" y="60" class="sys body">Last note, no pressure - "even two sentences by email would help"</text>
  </g>

  <!-- LinkedIn DM opener (purple = alternate channel) -->
  <g transform="translate(24,378)">
    <rect width="672" height="64" rx="4" fill="#f7ecff" stroke="#7c3aed" stroke-width="2"/>
    <text x="18" y="28" class="gk day">LinkedIn DM opener</text>
    <text x="18" y="52" class="sys lnk">"Your comment on [POST] about [TOPIC] is why I'm writing - 20 min this week?"</text>
  </g>

  <!-- Tracker strip -->
  <g transform="translate(24,456)">
    <rect width="672" height="66" rx="4" fill="#faf7f2" stroke="#c9c9c9" stroke-width="1.5"/>
    <text x="18" y="40" class="gk trkh">Track:</text>
    <rect x="96"  y="16" width="106" height="34" rx="4" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/>
    <text x="149" y="38" text-anchor="middle" class="sys cell">Sent</text>
    <rect x="210" y="16" width="106" height="34" rx="4" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/>
    <text x="263" y="38" text-anchor="middle" class="sys cell">Bumped</text>
    <rect x="324" y="16" width="106" height="34" rx="4" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/>
    <text x="377" y="38" text-anchor="middle" class="sys cell">Replied</text>
    <rect x="438" y="16" width="106" height="34" rx="4" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/>
    <text x="491" y="38" text-anchor="middle" class="sys cell">Booked</text>
    <rect x="552" y="16" width="106" height="34" rx="4" fill="#f1f8f1" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="605" y="38" text-anchor="middle" class="sys cellg">Done</text>
  </g>

  <!-- Bottom rule (ruby = anti-pattern) -->
  <g transform="translate(24,534)">
    <rect width="672" height="44" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2"/>
    <text x="336" y="29" text-anchor="middle" class="gk rule" font-size="18">Never bump a reply. Never claim conversations you have not had.</text>
  </g>

  <text x="360" y="600" text-anchor="middle" class="sys basis">Basis: stop sending once 10 calls are booked - a handful a day, by hand</text>
</svg>
