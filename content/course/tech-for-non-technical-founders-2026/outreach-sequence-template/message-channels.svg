<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" role="img" aria-labelledby="mc-title mc-desc">
  <title id="mc-title">Four message channels, each with a specific job, ordered by reply rate. Waitlist signups reply most - start there. Email or DM is primary. LinkedIn DM when there's no email. Reddit comment for public threads with DMs closed.</title>
  <desc id="mc-desc">Four channel cards. Green Waitlist signups, marked start here: people who already raised a hand, the highest reply rate - the Module 1 smoke-test list. Neutral channel 1, Email or DM: your primary channel, works for anyone with an address - the 30-name list from Lesson 2.3. Purple channel 2, LinkedIn DM, the alternate path: when there's no email, same three-line format leading with the comment they wrote. Neutral channel 3, Reddit comment: for public threads with DMs closed, drop a comment and leave your own DMs open - lowest volume, still worth it. A closing amber rule: all four use the same formula, name their exact words in the first line; if it could be sent to anyone, rewrite it.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .chh   { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .rateg { font-size: 18px; font-weight: 700; fill: #1b5e20; }
      .rate  { font-size: 18px; font-weight: 400; fill: #666666; }
      .tag   { font-size: 17px; font-weight: 700; fill: #7c3aed; }
      .rule  { font-size: 18px; font-weight: 400; fill: #9a6a00; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="524" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="508" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Which message to send: pick your channel</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Start with waitlist signups - they reply most</text>

  <!-- Ch: Waitlist signups (green = highest) -->
  <g transform="translate(24,96)">
    <rect width="324" height="150" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <rect x="188" y="14" width="118" height="24" rx="4" fill="#2e7d32"/>
    <text x="247" y="31" text-anchor="middle" class="gk badge">start here</text>
    <text x="18" y="34" class="gk chh">Waitlist signups</text>
    <text x="18" y="66" class="sys body">People who already raised</text>
    <text x="18" y="90" class="sys body">a hand. Highest reply rate.</text>
    <text x="18" y="130" class="sys rateg">Module 1 smoke-test list</text>
  </g>

  <!-- Ch 1: Email or DM -->
  <g transform="translate(372,96)">
    <rect width="324" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="34" cy="26" r="13" fill="#121212"/>
    <text x="34" y="32" text-anchor="middle" class="gk num">1</text>
    <text x="56" y="33" class="gk chh">Email or DM</text>
    <text x="18" y="66" class="sys body">Your primary channel - works</text>
    <text x="18" y="90" class="sys body">for anyone with an address.</text>
    <text x="18" y="130" class="sys rate">30-name list from 2.3</text>
  </g>

  <!-- Ch 2: LinkedIn DM (purple = alternate) -->
  <g transform="translate(24,264)">
    <rect width="324" height="150" rx="4" fill="#f7ecff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="34" cy="26" r="13" fill="#121212"/>
    <text x="34" y="32" text-anchor="middle" class="gk num">2</text>
    <text x="56" y="33" class="gk chh">LinkedIn DM</text>
    <text x="18" y="66" class="sys body">When there's no email. Same</text>
    <text x="18" y="90" class="sys body">3-line format, leads with the</text>
    <text x="18" y="114" class="sys body">comment they wrote.</text>
    <text x="18" y="140" class="sys tag">alternate path</text>
  </g>

  <!-- Ch 3: Reddit comment -->
  <g transform="translate(372,264)">
    <rect width="324" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="34" cy="26" r="13" fill="#121212"/>
    <text x="34" y="32" text-anchor="middle" class="gk num">3</text>
    <text x="56" y="33" class="gk chh">Reddit comment</text>
    <text x="18" y="66" class="sys body">Public threads with DMs closed.</text>
    <text x="18" y="90" class="sys body">Drop a comment, leave your</text>
    <text x="18" y="114" class="sys body">own DMs open.</text>
    <text x="18" y="140" class="sys rate">lowest volume, still worth it</text>
  </g>

  <!-- Bottom rule (warning = amber) -->
  <g transform="translate(24,432)">
    <rect width="672" height="56" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="336" y="26" text-anchor="middle" class="sys rule">All four use the same formula: name their exact words in line one.</text>
    <text x="336" y="47" text-anchor="middle" class="sys rule">If it could be sent to anyone, rewrite it.</text>
  </g>

  <text x="360" y="510" text-anchor="middle" class="sys basis">Basis: the same 3-line message, sent by hand, one channel per contact</text>
</svg>
