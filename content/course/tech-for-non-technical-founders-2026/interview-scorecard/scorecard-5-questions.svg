<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">The 5-question pass/fail check: score each question after the call. Pass means a specific story with a date, tool, or number. Fail means vague generality or a polite default.</title>
  <desc id="sc-desc">Five question cards, each with a green Pass line and a ruby Fail line. Q1 Past-behaviour story - Pass: specific, with date, time, tool, person, feeling; Fail: vague, "I usually struggle with it". Q2 Quantified cost - Pass: a number with a unit, "2 hrs every Tuesday"; Fail: unquantified, "It costs us time". Q3 Past attempt - Pass: named tool, hired person, or custom workaround; Fail: "Nothing yet - I've been meaning to". Q4 Priority score - Pass: 7 or higher with a comparison to another priority; Fail: no comparison, or a polite-default 7. Q5 Buying committee - Pass: names a specific person and their workaround; Fail: "I'm the only one who deals with this". A tally card follows: pass count out of five - 5 strong, 4 solid, 3 mixed, 2 or fewer weak.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .qlab  { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .pass  { font-size: 18px; font-weight: 400; fill: #1b5e20; }
      .fail  { font-size: 18px; font-weight: 400; fill: #b3261e; }
      .tally { font-size: 20px; font-weight: 700; fill: #121212; }
      .scale { font-size: 18px; font-weight: 400; fill: #444444; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="712" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="696" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Pass means a specific story - vague is a fail</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">Score each question within 5 minutes of hanging up</text>

  <!-- Q1 -->
  <g transform="translate(24,100)">
    <rect width="672" height="98" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">1</text>
    <text x="56" y="37" class="gk qlab">Past-behaviour story</text>
    <text x="18" y="66" class="sys pass">Pass: specific - date, time, tool, person, feeling</text>
    <text x="18" y="90" class="sys fail">Fail: vague - "I usually struggle with it"</text>
  </g>

  <!-- Q2 -->
  <g transform="translate(24,210)">
    <rect width="672" height="98" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">2</text>
    <text x="56" y="37" class="gk qlab">Quantified cost</text>
    <text x="18" y="66" class="sys pass">Pass: a number with a unit - "2 hrs every Tuesday"</text>
    <text x="18" y="90" class="sys fail">Fail: unquantified - "It costs us time"</text>
  </g>

  <!-- Q3 -->
  <g transform="translate(24,320)">
    <rect width="672" height="98" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">3</text>
    <text x="56" y="37" class="gk qlab">Past attempt</text>
    <text x="18" y="66" class="sys pass">Pass: named tool, hired person, or custom workaround</text>
    <text x="18" y="90" class="sys fail">Fail: "Nothing yet - I've been meaning to"</text>
  </g>

  <!-- Q4 -->
  <g transform="translate(24,430)">
    <rect width="672" height="98" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">4</text>
    <text x="56" y="37" class="gk qlab">Priority score</text>
    <text x="18" y="66" class="sys pass">Pass: 7+ with a comparison to another priority</text>
    <text x="18" y="90" class="sys fail">Fail: no comparison, or a polite-default 7</text>
  </g>

  <!-- Q5 -->
  <g transform="translate(24,540)">
    <rect width="672" height="98" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#121212"/>
    <text x="30" y="36" text-anchor="middle" class="gk num">5</text>
    <text x="56" y="37" class="gk qlab">Buying committee</text>
    <text x="18" y="66" class="sys pass">Pass: names a specific person and their workaround</text>
    <text x="18" y="90" class="sys fail">Fail: "I'm the only one who deals with this"</text>
  </g>

  <!-- Tally -->
  <g transform="translate(24,650)">
    <rect width="672" height="40" rx="4" fill="#faf7f2" stroke="#c9c9c9" stroke-width="1.5"/>
    <text x="18" y="27" class="gk tally">Pass count: ___ / 5</text>
    <text x="200" y="27" class="sys scale">5 strong - 4 solid - 3 mixed - 2 or fewer weak</text>
  </g>

  <text x="360" y="700" text-anchor="middle" class="sys basis">Basis: score right after the call, before memory rounds up</text>
</svg>
