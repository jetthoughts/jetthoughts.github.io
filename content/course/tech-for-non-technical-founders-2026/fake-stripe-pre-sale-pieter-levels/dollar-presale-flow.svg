<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" role="img" aria-labelledby="pf-title pf-desc">
  <title id="pf-title">The $1 pre-sale flow, from button to proof: a real $1 charge beats a free email signup - same visitors, sharper signal.</title>
  <desc id="pf-desc">Four step cards in a two-by-two grid. Step 1 The button: "Reserve your spot - $1 today, refundable if we don't ship by [DATE]" - the same Stripe Payment Link setup as Lesson 1.5. Step 2 The charge: a real $1 Stripe charge is a wallet decision, not a free email click; conversion drops 3 to 5 times, a truer signal. Step 3 The promise, an amber warning: the thank-you page promises a full refund within 7 days if you miss the ship date; non-negotiable - refund every charge within 30 days. Step 4 What the click proved: 0 sales means the hypothesis or price is wrong, 1 to 10 sales means iterate the headline and targeting, and a green money line marks 50-plus sales as a product-market-fit signal to start building. A purple callout reframes it: the click proves demand, not a business - retention and unit economics are separate, later tests.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .step  { font-size: 20px; font-weight: 700; fill: #121212; }
      .stepa { font-size: 20px; font-weight: 700; fill: #9a6a00; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .note  { font-size: 18px; font-weight: 400; fill: #666666; }
      .money { font-size: 18px; font-weight: 700; fill: #1b5e20; }
      .cta   { font-size: 20px; font-weight: 700; fill: #7c3aed; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="524" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="508" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The $1 pre-sale flow</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">A real $1 charge beats a free signup - sharper signal</text>

  <!-- Step 1: The button -->
  <g transform="translate(24,98)">
    <rect width="324" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk step">1. The button</text>
    <text x="18" y="66" class="sys body">"Reserve your spot - $1 today,</text>
    <text x="18" y="90" class="sys body">refundable if we miss [DATE]."</text>
    <text x="18" y="126" class="sys note">Same Stripe Payment Link as 1.5.</text>
  </g>

  <!-- Step 2: The charge -->
  <g transform="translate(372,98)">
    <rect width="324" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk step">2. The charge</text>
    <text x="18" y="66" class="sys body">A real $1 charge - a wallet</text>
    <text x="18" y="90" class="sys body">decision, not a free click.</text>
    <text x="18" y="126" class="sys note">Conversion drops 3-5x, truer signal.</text>
  </g>

  <!-- Step 3: The promise (warning = amber) -->
  <g transform="translate(24,266)">
    <rect width="324" height="150" rx="4" fill="#fff8e6" stroke="#c47d16" stroke-width="2"/>
    <text x="18" y="34" class="gk stepa">3. The promise</text>
    <text x="18" y="66" class="sys body">Thank-you page: full refund in 7</text>
    <text x="18" y="90" class="sys body">days if we miss the ship date.</text>
    <text x="18" y="126" class="sys note">Refund every charge within 30 days.</text>
  </g>

  <!-- Step 4: What the click proved -->
  <g transform="translate(372,266)">
    <rect width="324" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <text x="18" y="34" class="gk step">4. What the click proved</text>
    <text x="18" y="66" class="sys body">0 sales: hypothesis or price wrong</text>
    <text x="18" y="90" class="sys body">1-10: iterate headline + targeting</text>
    <text x="18" y="126" class="sys money">50+ sales: PMF signal - start building</text>
  </g>

  <!-- Reframe callout (categorical = purple) -->
  <g transform="translate(24,434)">
    <rect width="672" height="56" rx="4" fill="#f7ecff" stroke="#7c3aed" stroke-width="2"/>
    <text x="336" y="26" text-anchor="middle" class="gk cta">The click proves demand. Not a business.</text>
    <text x="336" y="47" text-anchor="middle" class="sys note">Retention (5.1) and unit economics are separate, later tests.</text>
  </g>

  <text x="360" y="508" text-anchor="middle" class="sys basis">Basis: one landing page, a $1 Stripe Payment Link, and the same cold traffic</text>
</svg>
