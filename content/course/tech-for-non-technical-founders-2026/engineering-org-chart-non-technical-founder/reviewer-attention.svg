<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="ra-title ra-desc">
  <title id="ra-title">PR reviewer attention math: one senior split across four projects, about 40 PRs a week, works out to roughly 15 minutes per PR - and what that misses.</title>
  <desc id="ra-desc">A week strip shows four equal project blocks at 25 percent each: Client A, Client B, YOUR PROJECT in ruby, and Client D. The math: 10 hours a week on your repo divided by about 40 PRs equals 15 minutes per PR. Two cards compare what 15 minutes catches versus what it misses. Green Catches card: diff looks reasonable, CI passed green, style nits flagged, click approve. Ruby Misses card: auth regression in before_action, N+1 query in the dashboard, Stripe secret in the controller, coverage silently dropped 11 percent, a migration that locks the orders table. Closing line: "we trust the senior to catch issues" - the senior had 15 minutes and three other clients.</desc>
  <defs>
    <style>
      .gk   { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .blk   { font-size: 18px; font-weight: 700; fill: #121212; }
      .blkw  { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .math  { font-size: 20px; font-weight: 400; fill: #333333; }
      .big   { font-size: 30px; font-weight: 700; fill: #cc342d; }
      .cardh { font-size: 20px; font-weight: 700; fill: #121212; }
      .ok    { font-size: 18px; font-weight: 400; fill: #1b5e20; }
      .bad   { font-size: 18px; font-weight: 400; fill: #b3261e; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="520" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="504" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Your reviewer gets 15 minutes per PR</text>
  <text x="360" y="76" text-anchor="middle" class="gk msg">One senior, four clients, about 40 PRs a week</text>

  <!-- Week strip: 4 equal project blocks -->
  <g transform="translate(24,96)">
    <rect x="0"   y="0" width="162" height="54" rx="4" fill="#e6e6e6" stroke="#3a3a3a" stroke-width="2"/>
    <text x="81"  y="33" text-anchor="middle" class="gk blk">Client A - 25%</text>
    <rect x="170" y="0" width="162" height="54" rx="4" fill="#e6e6e6" stroke="#3a3a3a" stroke-width="2"/>
    <text x="251" y="33" text-anchor="middle" class="gk blk">Client B - 25%</text>
    <rect x="340" y="0" width="162" height="54" rx="4" fill="#cc342d" stroke="#3a3a3a" stroke-width="2"/>
    <text x="421" y="27" text-anchor="middle" class="gk blkw">YOUR PROJECT</text>
    <text x="421" y="46" text-anchor="middle" class="gk blkw" font-size="17">25%</text>
    <rect x="510" y="0" width="162" height="54" rx="4" fill="#e6e6e6" stroke="#3a3a3a" stroke-width="2"/>
    <text x="591" y="33" text-anchor="middle" class="gk blk">Client D - 25%</text>
  </g>

  <!-- Math -->
  <text x="360" y="188" text-anchor="middle" class="sys math">10 hrs/week on your repo  /  ~40 PRs  =</text>
  <text x="360" y="224" text-anchor="middle" class="gk big">15 minutes per PR</text>

  <!-- Catches (green) -->
  <g transform="translate(24,252)">
    <rect width="324" height="196" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="18" y="34" class="gk cardh">What 15 min catches</text>
    <text x="18" y="72"  class="sys ok">+ Diff looks reasonable</text>
    <text x="18" y="102" class="sys ok">+ CI passed green</text>
    <text x="18" y="132" class="sys ok">+ Style nits flagged</text>
    <text x="18" y="162" class="sys ok">+ Click approve</text>
  </g>

  <!-- Misses (ruby = anti-pattern) -->
  <g transform="translate(372,252)">
    <rect width="324" height="196" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <text x="18" y="34" class="gk cardh">What it misses</text>
    <text x="18" y="68"  class="sys bad">- Auth regression in <tspan class="mono">before_action</tspan></text>
    <text x="18" y="94"  class="sys bad">- N+1 query in the dashboard</text>
    <text x="18" y="120" class="sys bad">- Stripe secret in the controller</text>
    <text x="18" y="146" class="sys bad">- Coverage silently dropped 11%</text>
    <text x="18" y="172" class="sys bad">- Migration locks the orders table</text>
  </g>

  <text x="360" y="486" text-anchor="middle" class="sys basis">Basis: "we trust the senior to catch it" - the senior had 15 minutes and three other clients</text>
</svg>
