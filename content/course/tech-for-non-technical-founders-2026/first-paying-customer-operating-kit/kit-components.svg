<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="kit-title kit-desc">
  <title id="kit-title">The First-Paying-Customer Operating Kit and its six components.</title>
  <desc id="kit-desc">Six numbered template cards that run Module 5: 1 the 50-name network list (Google Sheet, Lesson 5.3), 2 cold-email scripts (3 sector variants, Lesson 5.7), 3 the Design Partner Agreement (one-page LOI, Lesson 5.6), 4 Stripe Checkout setup (Rails, Django or Laravel), 5 the Sean Ellis 40 percent survey (5 questions, Lesson 5.1), and 6 the First 10 Customers tracker (Google Sheet, Lesson 5.7). From live MVP to signed paid pilot in four weeks - one template per step.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .ct    { font-size: 20px; font-weight: 700; fill: #121212; }
      .cn    { font-size: 17px; font-weight: 400; fill: #555555; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .foot  { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="480" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="464" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="42" text-anchor="middle" class="gk title">First-Paying-Customer Operating Kit</text>
  <text x="360" y="70" text-anchor="middle" class="gk msg">Six templates that run Module 5</text>

  <!-- Row 1 -->
  <g>
    <rect x="24" y="94" width="213" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="50" cy="122" r="15" fill="#cc342d"/>
    <text x="50" y="128" text-anchor="middle" class="gk num">1</text>
    <text x="42" y="170" class="gk ct">50-name</text>
    <text x="42" y="194" class="gk ct">network list</text>
    <text x="42" y="222" class="sys cn">Google Sheet - Lesson 5.3</text>
  </g>
  <g>
    <rect x="253" y="94" width="213" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="279" cy="122" r="15" fill="#cc342d"/>
    <text x="279" y="128" text-anchor="middle" class="gk num">2</text>
    <text x="271" y="170" class="gk ct">Cold-email</text>
    <text x="271" y="194" class="gk ct">scripts</text>
    <text x="271" y="222" class="sys cn">3 variants - Lesson 5.7</text>
  </g>
  <g>
    <rect x="482" y="94" width="213" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="508" cy="122" r="15" fill="#cc342d"/>
    <text x="508" y="128" text-anchor="middle" class="gk num">3</text>
    <text x="500" y="170" class="gk ct">Design Partner</text>
    <text x="500" y="194" class="gk ct">Agreement</text>
    <text x="500" y="222" class="sys cn">One-page LOI - Lesson 5.6</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="24" y="260" width="213" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="50" cy="288" r="15" fill="#cc342d"/>
    <text x="50" y="294" text-anchor="middle" class="gk num">4</text>
    <text x="42" y="336" class="gk ct">Stripe</text>
    <text x="42" y="360" class="gk ct">Checkout setup</text>
    <text x="42" y="388" class="sys cn">Rails / Django / Laravel</text>
  </g>
  <g>
    <rect x="253" y="260" width="213" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="279" cy="288" r="15" fill="#cc342d"/>
    <text x="279" y="294" text-anchor="middle" class="gk num">5</text>
    <text x="271" y="336" class="gk ct">Sean Ellis</text>
    <text x="271" y="360" class="gk ct">40% survey</text>
    <text x="271" y="388" class="sys cn">5 questions - Lesson 5.1</text>
  </g>
  <g>
    <rect x="482" y="260" width="213" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="508" cy="288" r="15" fill="#cc342d"/>
    <text x="508" y="294" text-anchor="middle" class="gk num">6</text>
    <text x="500" y="336" class="gk ct">First 10</text>
    <text x="500" y="360" class="gk ct">Customers tracker</text>
    <text x="500" y="388" class="sys cn">Google Sheet - Lesson 5.7</text>
  </g>

  <text x="360" y="450" text-anchor="middle" class="sys foot">Live MVP to signed paid pilot in 4 weeks - one template per step.</text>
</svg>
