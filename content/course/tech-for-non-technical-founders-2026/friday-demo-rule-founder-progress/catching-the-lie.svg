<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="catch-lie-title catch-lie-desc">
  <title id="catch-lie-title">One Loom for a small full-stack team versus five Looms for a microservice-detached team.</title>
  <desc id="catch-lie-desc">Top (green), a small full-stack team: one Loom, one staging URL, a single clickable journey - sign up, add to cart, checkout with a 1-dollar Stripe charge, receipt sent. One developer narrates end-to-end in 90 seconds while the founder clicks along. Bottom (ruby), a microservice-detached team: five separate Looms across five subdomains - orders, billing, notify, web, and gateway - joined by criss-cross arrows. "Watch these five videos and we'll sync next week." That is what you are paying for.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .pt    { font-size: 20px; font-weight: 700; }
      .wp    { font-size: 17px; font-weight: 600; fill: #121212; }
      .th    { font-size: 17px; font-weight: 700; fill: #121212; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="cl-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="464" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="40" text-anchor="middle" class="gk title">One Loom, or five?</text>
  <text x="360" y="66" text-anchor="middle" class="gk msg">The demo tells you how the team is wired</text>

  <!-- TOP: full-stack (green) -->
  <rect x="24" y="84" width="672" height="170" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="44" y="114" class="gk pt" fill="#2e7d32">Full-stack team - ONE Loom</text>

  <!-- single Loom thumbnail -->
  <rect x="44" y="130" width="130" height="94" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <rect x="44" y="130" width="130" height="22" rx="4" fill="#2e7d32"/>
  <text x="54" y="146" class="sys th" fill="#ffffff">Loom 9:42</text>
  <polygon points="102,168 102,196 126,182" fill="#2e7d32"/>
  <text x="109" y="216" text-anchor="middle" class="sys wp">checkout v1</text>

  <!-- one-URL journey -->
  <text x="440" y="130" text-anchor="middle" class="sys wp">staging.acme.app - one URL</text>
  <line x1="220" y1="180" x2="656" y2="180" stroke="#2e7d32" stroke-width="3" marker-end="url(#cl-g)"/>
  <circle cx="240" cy="180" r="7" fill="#2e7d32"/>
  <text x="240" y="164" text-anchor="middle" class="sys wp">sign up</text>
  <circle cx="380" cy="180" r="7" fill="#2e7d32"/>
  <text x="380" y="164" text-anchor="middle" class="sys wp">add to cart</text>
  <circle cx="520" cy="180" r="7" fill="#2e7d32"/>
  <text x="520" y="164" text-anchor="middle" class="sys wp">$1 checkout</text>
  <circle cx="640" cy="180" r="7" fill="#2e7d32"/>
  <text x="628" y="164" text-anchor="middle" class="sys wp">receipt</text>
  <text x="440" y="238" text-anchor="middle" class="sys note">One dev narrates end-to-end - 90 sec, founder clicks along.</text>

  <!-- BOTTOM: microservice (ruby) -->
  <rect x="24" y="272" width="672" height="184" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="44" y="302" class="gk pt" fill="#cc342d">Microservice team - FIVE Looms</text>

  <!-- 5 thumbnails -->
  <g>
    <rect x="44" y="316" width="118" height="76" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <polygon points="94,342 94,366 114,354" fill="#cc342d"/>
    <text x="103" y="384" text-anchor="middle" class="sys wp">orders</text>
  </g>
  <g>
    <rect x="174" y="316" width="118" height="76" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <polygon points="224,342 224,366 244,354" fill="#cc342d"/>
    <text x="233" y="384" text-anchor="middle" class="sys wp">billing</text>
  </g>
  <g>
    <rect x="304" y="316" width="118" height="76" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <polygon points="354,342 354,366 374,354" fill="#cc342d"/>
    <text x="363" y="384" text-anchor="middle" class="sys wp">notify</text>
  </g>
  <g>
    <rect x="434" y="316" width="118" height="76" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <polygon points="484,342 484,366 504,354" fill="#cc342d"/>
    <text x="493" y="384" text-anchor="middle" class="sys wp">web</text>
  </g>
  <g>
    <rect x="564" y="316" width="118" height="76" rx="4" fill="#ffffff" stroke="#cc342d" stroke-width="2"/>
    <polygon points="614,342 614,366 634,354" fill="#cc342d"/>
    <text x="623" y="384" text-anchor="middle" class="sys wp">gateway</text>
  </g>

  <!-- criss-cross tangle -->
  <g stroke="#cc342d" stroke-width="1.75" fill="none" stroke-dasharray="5 4">
    <path d="M 103 404 Q 168 420 233 404"/>
    <path d="M 233 404 Q 298 420 363 404"/>
    <path d="M 363 404 Q 428 420 493 404"/>
    <path d="M 493 404 Q 558 420 623 404"/>
    <path d="M 623 408 Q 360 436 103 408"/>
  </g>

  <text x="360" y="446" text-anchor="middle" class="sys note">"Watch these five and we'll sync next week." That's what you pay for.</text>
</svg>
