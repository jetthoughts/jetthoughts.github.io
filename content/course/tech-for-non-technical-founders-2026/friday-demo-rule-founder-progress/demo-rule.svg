<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="demo-rule-title demo-rule-desc">
  <title id="demo-rule-title">The Friday Demo Rule: 15 minutes, working software only, no slides or Jira screenshots.</title>
  <desc id="demo-rule-desc">Left, allowed in the room: a 15-minute timer with a hard stop, and a green working-software panel showing a 1-dollar test charge processed, the order paid, the webhook fired, and a receipt sent - plus a login you paste in one message. Right, not allowed: a Jira screenshot, a Figma frame, and a slide-deck burndown chart, each struck through in ruby. Working software only. If a demo is not ready, say so on Wednesday.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .ptitle{ font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
      .timer { font-size: 32px; font-weight: 700; fill: #121212; }
      .lab   { font-size: 20px; font-weight: 700; fill: #121212; }
      .body  { font-size: 18px; font-weight: 400; fill: #121212; }
      .banned{ font-size: 20px; font-weight: 700; fill: #121212; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
      .foot  { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="460" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="444" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- LEFT: allowed -->
  <text x="188" y="44" text-anchor="middle" class="gk ptitle" fill="#2e7d32">&#10003; ALLOWED: Friday 4pm</text>

  <!-- timer -->
  <circle cx="90" cy="122" r="48" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <text x="90" y="118" text-anchor="middle" class="gk timer">15:00</text>
  <text x="90" y="142" text-anchor="middle" class="sys body">hard stop</text>

  <!-- working software panel (green) -->
  <rect x="160" y="70" width="192" height="150" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="176" y="102" class="sys body" fill="#2e7d32">&#10003; $1 test charge OK</text>
  <text x="176" y="128" class="sys body">order #1284 - paid</text>
  <text x="176" y="154" class="sys body">webhook fired</text>
  <text x="176" y="180" class="sys body">receipt sent</text>
  <text x="176" y="206" class="sys body">login: 1 paste</text>

  <text x="188" y="256" text-anchor="middle" class="gk lab">Working software only.</text>
  <text x="188" y="282" text-anchor="middle" class="sys note">Click everything they show you, live.</text>

  <!-- Divider -->
  <line x1="360" y1="60" x2="360" y2="360" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: not allowed -->
  <text x="532" y="44" text-anchor="middle" class="gk ptitle" fill="#cc342d">&#10007; NOT ALLOWED</text>

  <g>
    <rect x="392" y="66" width="300" height="72" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <text x="542" y="110" text-anchor="middle" class="gk banned">Jira screenshot</text>
    <line x1="400" y1="130" x2="684" y2="74" stroke="#cc342d" stroke-width="3"/>
  </g>
  <g>
    <rect x="392" y="152" width="300" height="72" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <text x="542" y="196" text-anchor="middle" class="gk banned">Figma frame</text>
    <line x1="400" y1="216" x2="684" y2="160" stroke="#cc342d" stroke-width="3"/>
  </g>
  <g>
    <rect x="392" y="238" width="300" height="72" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <text x="542" y="282" text-anchor="middle" class="gk banned">Slide-deck burndown</text>
    <line x1="400" y1="302" x2="684" y2="246" stroke="#cc342d" stroke-width="3"/>
  </g>

  <text x="532" y="344" text-anchor="middle" class="sys note">Not ready? Say so on Wednesday.</text>

  <!-- Bottom rule -->
  <line x1="40" y1="390" x2="680" y2="390" stroke="#e5e5e5" stroke-width="1"/>
  <text x="360" y="422" text-anchor="middle" class="sys foot">Friday Demo Rule - 15 minutes - Loom or live - working software only</text>
</svg>
