<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="friloop-title friloop-desc">
  <title id="friloop-title">The Friday demo weekly loop, then the 4-week checkpoint.</title>
  <desc id="friloop-desc">Monday 9am the founder posts the 7-question template in the dev Slack. Tuesday through Thursday the team builds and reviews against the questions; Wednesday end of day, anything not ready gets replanned before Friday. Friday 4pm is a 15-minute Loom or live demo, working software only; the founder clicks every staging URL live, then forwards the Loom that evening. A dashed loop returns to Monday - the cycle repeats every week. After 4 Fridays, review the pattern: 4 of 4 demos clickable (green) means the cadence works, keep it weekly; 2 of 4 or fewer (ruby) means something is stalling - run the Org Chart audit and the red-flags checklist.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .chip  { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .step  { font-size: 18px; font-weight: 700; fill: #121212; }
      .stepsm{ font-size: 17px; font-weight: 400; fill: #555555; }
      .lbl   { font-size: 17px; font-weight: 400; fill: #666666; }
      .out   { font-size: 20px; font-weight: 700; }
      .body  { font-size: 18px; font-weight: 400; fill: #121212; }
    </style>
    <marker id="fl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#333333"/>
    </marker>
    <marker id="fl-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="424" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="40" text-anchor="middle" class="gk title">The Friday demo: the weekly loop</text>
  <text x="360" y="66" text-anchor="middle" class="gk msg">One 15-minute call, every week</text>

  <!-- Row of 4 step cards -->
  <g>
    <rect x="24" y="88" width="159" height="100" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="38" y="100" width="96" height="24" rx="4" fill="#cc342d"/>
    <text x="86" y="117" text-anchor="middle" class="gk chip">MON 9AM</text>
    <text x="38" y="150" class="gk step">Post the 7</text>
    <text x="38" y="172" class="gk step">questions</text>
  </g>
  <g>
    <rect x="195" y="88" width="159" height="100" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="209" y="100" width="96" height="24" rx="4" fill="#cc342d"/>
    <text x="257" y="117" text-anchor="middle" class="gk chip">TUE-THU</text>
    <text x="209" y="150" class="gk step">Build +</text>
    <text x="209" y="172" class="gk step">review</text>
  </g>
  <g>
    <rect x="366" y="88" width="159" height="100" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="380" y="100" width="96" height="24" rx="4" fill="#cc342d"/>
    <text x="428" y="117" text-anchor="middle" class="gk chip">FRI 4PM</text>
    <text x="380" y="150" class="gk step">15-min demo,</text>
    <text x="380" y="172" class="sys stepsm">working sw only</text>
  </g>
  <g>
    <rect x="537" y="88" width="159" height="100" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="551" y="100" width="96" height="24" rx="4" fill="#cc342d"/>
    <text x="599" y="117" text-anchor="middle" class="gk chip">FRI LIVE</text>
    <text x="551" y="150" class="gk step">Click every URL,</text>
    <text x="551" y="172" class="sys stepsm">forward the Loom</text>
  </g>

  <!-- Row arrows -->
  <path d="M 183 138 L 193 138" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#fl-a)"/>
  <path d="M 354 138 L 364 138" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#fl-a)"/>
  <path d="M 525 138 L 535 138" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#fl-a)"/>

  <!-- Weekly loop back -->
  <path d="M 616 188 C 660 232, 60 232, 104 188" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#fl-g)"/>
  <text x="360" y="224" text-anchor="middle" class="sys lbl">Wed EOD: not ready? Replan before Friday. Then Monday, the cycle repeats.</text>

  <text x="360" y="256" text-anchor="middle" class="sys lbl">After 4 Fridays, review the pattern:</text>
  <path d="M 360 264 C 280 274, 200 280, 190 288" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#fl-a)"/>
  <path d="M 360 264 C 440 274, 520 280, 530 288" stroke="#333333" stroke-width="2.25" fill="none" marker-end="url(#fl-a)"/>

  <!-- Outcome: healthy (green = success) -->
  <g>
    <rect x="24" y="292" width="330" height="126" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="44" y="328" class="gk out" fill="#2e7d32">4 of 4 clickable</text>
    <text x="44" y="360" class="sys body">Cadence works - keep it</text>
    <text x="44" y="386" class="sys body">weekly, no changes needed.</text>
  </g>
  <!-- Outcome: stalling (ruby = action) -->
  <g>
    <rect x="366" y="292" width="330" height="126" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
    <text x="386" y="328" class="gk out" fill="#cc342d">2 of 4 or fewer</text>
    <text x="386" y="360" class="sys body">Something's stalling. Run the</text>
    <text x="386" y="386" class="sys body">Org Chart audit + red-flags.</text>
  </g>
</svg>
