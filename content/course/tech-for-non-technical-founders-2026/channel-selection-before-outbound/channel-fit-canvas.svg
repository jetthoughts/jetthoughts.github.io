<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="cf-title">
  <title id="cf-title">Channel-fit canvas: score each candidate channel 1-3 on four dimensions. Price fit, buyer type, your honest time budget, and interview signal. Total out of 12. Fill one canvas per channel you are considering.</title>
  <desc>A scoring worksheet with four dimension columns: Price fit (1-3), Buyer type (1-3), Time budget (1-3), Interview signal (1-3), totaling out of 12. Five example channel rows below: LinkedIn DM, Cold email, Slack/ Discord community, Content / SEO, and Personal network. Each row has fill-in score cells. Right side shows the gate: 9+/12 commit, 7-8 pilot your top two, 6 or less re-read transcripts. Bottom callout: the 10 interview transcripts from Module 2 already name the channel - pull them up and look for how they discover tools.</desc>
  <defs>
    <style>
      .h       { font-family: "Caveat", "Patrick Hand", "Comic Sans MS", cursive; }
      .title   { font-size: 27px; font-weight: 700; fill: #1a1a1a; }
      .sub     { font-size: 15px; fill: #666; font-style: italic; }
      .dim-hd  { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .dim-sub { font-size: 12px; fill: #888; }
      .ch-name { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .ch-sub  { font-size: 12px; fill: #888; }
      .cell    { font-size: 18px; fill: #bbb; font-style: italic; }
      .total   { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .gate-hd { font-size: 17px; font-weight: 700; }
      .gate-tx { font-size: 14px; fill: #555; }
      .note    { font-size: 14px; fill: #666; font-style: italic; }
      .card    { fill: #faf7f2; stroke: #555; stroke-width: 2; }
      .card-g  { fill: #f0f9f0; stroke: #2e7d32; stroke-width: 2.5; }
      .card-a  { fill: #fffbeb; stroke: #b8860b; stroke-width: 2.5; }
      .card-r  { fill: #fff5f5; stroke: #cc342d; stroke-width: 2.5; }
      .cell-bg { fill: #ffffff; stroke: #ddd; stroke-width: 2; }
      .row-bg  { fill: #faf7f2; stroke: #e0e0e0; stroke-width: 2; }
      .header-bg { fill: #faf7f2; stroke: #555; stroke-width: 2; }
    </style>
  </defs>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" class="h title">Channel-fit canvas: score before you send</text>
  <text x="480" y="58" text-anchor="middle" class="h sub">Fill one canvas per candidate channel. Score 1-3 on each dimension. Total out of 12.</text>

  <!-- ====== CANVAS TABLE ====== -->
  <!-- Table background -->
  <rect x="24" y="78" width="650" height="352" rx="12" class="card" transform="rotate(-0.2 349 254)"/>

  <!-- Header row -->
  <rect x="36" y="88" width="626" height="56" rx="8" class="header-bg"/>
  <text x="56"  y="116" class="h dim-hd">Channel</text>
  <!-- Divider lines -->
  <line x1="176" y1="88" x2="176" y2="134" stroke="#ccc" stroke-width="1.5"/>
  <line x1="340" y1="88" x2="340" y2="134" stroke="#ccc" stroke-width="1.5"/>
  <line x1="432" y1="88" x2="432" y2="134" stroke="#ccc" stroke-width="1.5"/>
  <line x1="524" y1="88" x2="524" y2="134" stroke="#ccc" stroke-width="1.5"/>

  <text x="192" y="108" class="h dim-hd">Price fit</text>
  <text x="192" y="126" class="h dim-sub">does your price match</text>
  <text x="192" y="140" class="h dim-sub">what this channel buys?</text>

  <text x="354" y="108" class="h dim-hd">Buyer type</text>
  <text x="354" y="126" class="h dim-sub">is your ICP active</text>
  <text x="354" y="140" class="h dim-sub">on this channel?</text>

  <text x="448" y="108" class="h dim-hd">Time budget</text>
  <text x="448" y="126" class="h dim-sub">can you sustain the</text>
  <text x="448" y="140" class="h dim-sub">pace for 4 weeks?</text>

  <text x="540" y="108" class="h dim-hd">Signal</text>
  <text x="540" y="126" class="h dim-sub">did interviewees</text>
  <text x="540" y="140" class="h dim-sub">name this channel?</text>

  <!-- Score cells header -->
  <text x="620" y="118" class="h dim-sub">1-3</text>

  <!-- Row 1: LinkedIn DM -->
  <rect x="36" y="148" width="626" height="44" rx="6" class="row-bg"/>
  <text x="56"  y="175" class="h ch-name">LinkedIn DM</text>
  <text x="56"  y="190" class="h ch-sub">InMail or connection note</text>
  <!-- score cells -->
  <rect x="180" y="156" width="36" height="28" rx="6" class="cell-bg"/><text x="198" y="176" text-anchor="middle" class="cell">1-3</text>
  <rect x="272" y="156" width="36" height="28" rx="6" class="cell-bg"/><text x="290" y="176" text-anchor="middle" class="cell">1-3</text>
  <rect x="364" y="156" width="36" height="28" rx="6" class="cell-bg"/><text x="382" y="176" text-anchor="middle" class="cell">1-3</text>
  <rect x="456" y="156" width="36" height="28" rx="6" class="cell-bg"/><text x="474" y="176" text-anchor="middle" class="cell">1-3</text>
  <text x="620" y="176" class="h total">/12</text>

  <!-- Row 2: Cold email -->
  <rect x="36" y="196" width="626" height="44" rx="6" class="row-bg"/>
  <text x="56"  y="223" class="h ch-name">Cold email</text>
  <text x="56"  y="238" class="h ch-sub">Gmail + personal first line</text>
  <rect x="180" y="204" width="36" height="28" rx="6" class="cell-bg"/><text x="198" y="224" text-anchor="middle" class="cell">1-3</text>
  <rect x="272" y="204" width="36" height="28" rx="6" class="cell-bg"/><text x="290" y="224" text-anchor="middle" class="cell">1-3</text>
  <rect x="364" y="204" width="36" height="28" rx="6" class="cell-bg"/><text x="382" y="224" text-anchor="middle" class="cell">1-3</text>
  <rect x="456" y="204" width="36" height="28" rx="6" class="cell-bg"/><text x="474" y="224" text-anchor="middle" class="cell">1-3</text>
  <text x="620" y="224" class="h total">/12</text>

  <!-- Row 3: Slack / Discord community -->
  <rect x="36" y="244" width="626" height="44" rx="6" class="row-bg"/>
  <text x="56"  y="271" class="h ch-name">Slack / Discord</text>
  <text x="56"  y="286" class="h ch-sub">community where your ICP hangs out</text>
  <rect x="180" y="252" width="36" height="28" rx="6" class="cell-bg"/><text x="198" y="272" text-anchor="middle" class="cell">1-3</text>
  <rect x="272" y="252" width="36" height="28" rx="6" class="cell-bg"/><text x="290" y="272" text-anchor="middle" class="cell">1-3</text>
  <rect x="364" y="252" width="36" height="28" rx="6" class="cell-bg"/><text x="382" y="272" text-anchor="middle" class="cell">1-3</text>
  <rect x="456" y="252" width="36" height="28" rx="6" class="cell-bg"/><text x="474" y="272" text-anchor="middle" class="cell">1-3</text>
  <text x="620" y="272" class="h total">/12</text>

  <!-- Row 4: Content / SEO -->
  <rect x="36" y="292" width="626" height="44" rx="6" class="row-bg"/>
  <text x="56"  y="319" class="h ch-name">Content / SEO</text>
  <text x="56"  y="334" class="h ch-sub">blog, YouTube, or niche writing</text>
  <rect x="180" y="300" width="36" height="28" rx="6" class="cell-bg"/><text x="198" y="320" text-anchor="middle" class="cell">1-3</text>
  <rect x="272" y="300" width="36" height="28" rx="6" class="cell-bg"/><text x="290" y="320" text-anchor="middle" class="cell">1-3</text>
  <rect x="364" y="300" width="36" height="28" rx="6" class="cell-bg"/><text x="382" y="320" text-anchor="middle" class="cell">1-3</text>
  <rect x="456" y="300" width="36" height="28" rx="6" class="cell-bg"/><text x="474" y="320" text-anchor="middle" class="cell">1-3</text>
  <text x="620" y="320" class="h total">/12</text>

  <!-- Row 5: Personal network -->
  <rect x="36" y="340" width="626" height="44" rx="6" class="row-bg"/>
  <text x="56"  y="367" class="h ch-name">Personal network</text>
  <text x="56"  y="382" class="h ch-sub">people who already know you</text>
  <rect x="180" y="348" width="36" height="28" rx="6" class="cell-bg"/><text x="198" y="368" text-anchor="middle" class="cell">1-3</text>
  <rect x="272" y="348" width="36" height="28" rx="6" class="cell-bg"/><text x="290" y="368" text-anchor="middle" class="cell">1-3</text>
  <rect x="364" y="348" width="36" height="28" rx="6" class="cell-bg"/><text x="382" y="368" text-anchor="middle" class="cell">1-3</text>
  <rect x="456" y="348" width="36" height="28" rx="6" class="cell-bg"/><text x="474" y="368" text-anchor="middle" class="cell">1-3</text>
  <text x="620" y="368" class="h total">/12</text>

  <!-- ====== GATE COLUMN (right side) ====== -->
  <text x="708" y="100" class="h dim-hd">Your score means</text>

  <!-- Gate: commit -->
  <g transform="translate(694, 114)">
    <rect width="248" height="58" rx="10" class="card-g"/>
    <text x="14" y="26" class="h gate-hd" fill="#2e7d32">9+ / 12</text>
    <text x="14" y="48" class="h gate-tx">Commit. One full send/reply/follow-up</text>
    <text x="14" y="64" class="h gate-tx">arc before you switch.</text>
  </g>

  <!-- Gate: pilot -->
  <g transform="translate(694, 182)">
    <rect width="248" height="58" rx="10" class="card-a"/>
    <text x="14" y="26" class="h gate-hd" fill="#b8860b">7-8 / 12</text>
    <text x="14" y="48" class="h gate-tx">Pilot your top two for 1 week.</text>
    <text x="14" y="64" class="h gate-tx">Higher reply rate wins.</text>
  </g>

  <!-- Gate: no fit -->
  <g transform="translate(694, 250)">
    <rect width="248" height="58" rx="10" class="card-r"/>
    <text x="14" y="26" class="h gate-hd" fill="#cc342d">6 or less</text>
    <text x="14" y="48" class="h gate-tx">No channel fits yet. Re-read your</text>
    <text x="14" y="64" class="h gate-tx">transcripts for missing signal.</text>
  </g>

  <!-- Gate note -->
  <g transform="translate(694, 320)">
    <rect width="248" height="66" rx="10" fill="#fff8e0" stroke="#b8860b" stroke-width="2"/>
    <text x="14" y="24" class="h note" fill="#1a1a1a">The real gate:</text>
    <text x="14" y="44" class="h note" fill="#1a1a1a">>=9/12 channel-fit score</text>
    <text x="14" y="62" class="h note" fill="#1a1a1a">+ reply rate over 5%</text>
  </g>

  <!-- ====== BOTTOM CALLOUT ====== -->
  <g transform="translate(24, 446)">
    <rect width="918" height="42" rx="10" fill="#faf7f2" stroke="#555" stroke-width="2"/>
    <text x="16" y="28" class="h note" fill="#1a1a1a"><tspan font-weight="700">Where to find the signal:</tspan> Your 10 interview transcripts already name the channel. Pull them up and look for how they discover tools, which channel they came to you through, and what tools they use every day.</text>
  </g>
</svg>
