<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 272px; background-color: transparent;" viewBox="0 0 272 653" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">What one 30-message cold batch returns</title><desc id="chart-desc-my-svg">A four-stage funnel. 30 messages sent, one custom opener each, narrow to
1-4 replies - and 0-1 replies on batch 1 is normal, not a failure. The
replies narrow to demo calls booked on a 15-minute Calendly slot, and
those narrow to 1-2 paid pilots with a design partner agreement signed
and a deposit taken.</desc><style>#my-svg{font-family:Caveat,Patrick Hand,Comic Sans MS,cursive;font-size:20px;fill:#1a1a1a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(180, 100%, 100%);}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#1a1a1a;stroke:#1a1a1a;}#my-svg .marker.cross{stroke:#1a1a1a;}#my-svg svg{font-family:Caveat,Patrick Hand,Comic Sans MS,cursive;font-size:20px;}#my-svg p{margin:0;}#my-svg .label{font-family:Caveat,Patrick Hand,Comic Sans MS,cursive;color:#1a1a1a;}#my-svg .cluster-label text{fill:#000000;}#my-svg .cluster-label span{color:#000000;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#1a1a1a;color:#1a1a1a;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#fff5f5;stroke:#cc342d;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#1a1a1a!important;stroke-width:0;stroke:#1a1a1a;}#my-svg .arrowheadPath{fill:#0