<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" aria-labelledby="cadence-title cadence-desc">
  <title id="cadence-title">The six-stage outbound cadence</title>
  <desc id="cadence-desc">A snake-path diagram of six weekly stages. Row one, left to right: Stage 1, send 30 messages, 1-4 replies expected, cold outreach red. Stage 2, run 3-5 demos, 2-3 DPAs sent, warm pipeline purple. Stage 3, 1-2 deposits cleared, pilot kickoffs scheduled, money-lands green. The path drops under Stage 3, then row two continues right to left: Stage 4, send next 20, hold for reply tail, cold red. Stage 5, Friday demos plus earlier prospects mature, warm purple. Stage 6, year-one conversions plus next 20 cold names, money green. A legend explains the three tints. Basis: one week of the outbound cadence.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .step  { font-size: 20px; font-weight: 600; fill: #121212; }
      .desc  { font-size: 18px; font-weight: 400; fill: #555555; }
      .legend{ font-size: 18px; font-weight: 400; fill: #333333; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="oc-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="496" fill="#faf7f2"/>

  <text x="360" y="50" text-anchor="middle" class="gk title">The six-stage outbound cadence</text>
  <text x="360" y="82" text-anchor="middle" class="gk msg">Cold sends and warm follow-ups, running the same week</text>

  <!-- Row 1: 1 cold, 2 warm, 3 conv -->
  <g>
    <rect x="24" y="110" width="210" height="128" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.25"/>
    <circle cx="54" cy="140" r="16" fill="#121212"/><text x="54" y="146" text-anchor="middle" class="gk num">1</text>
    <text x="44" y="182" class="gk step">30 messages</text>
    <text x="44" y="210" class="sys desc">1-4 replies expected</text>
  </g>
  <g>
    <rect x="255" y="110" width="210" height="128" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.25"/>
    <circle cx="285" cy="140" r="16" fill="#121212"/><text x="285" y="146" text-anchor="middle" class="gk num">2</text>
    <text x="275" y="182" class="gk step">Run 3-5 demos</text>
    <text x="275" y="210" class="sys desc">2-3 DPAs sent</text>
  </g>
  <g>
    <rect x="486" y="110" width="210" height="128" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.25"/>
    <circle cx="516" cy="140" r="16" fill="#121212"/><text x="516" y="146" text-anchor="middle" class="gk num">3</text>
    <text x="506" y="182" class="gk step">Deposits clear</text>
    <text x="506" y="210" class="sys desc">Kickoffs scheduled</text>
  </g>

  <!-- Row 2: 6 conv, 5 warm, 4 cold (snake right-to-left) -->
  <g>
    <rect x="24" y="270" width="210" height="128" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.25"/>
    <circle cx="54" cy="300" r="16" fill="#121212"/><text x="54" y="306" text-anchor="middle" class="gk num">6</text>
    <text x="44" y="342" class="gk step">Conversions</text>
    <text x="44" y="370" class="sys desc">Year-one + 20 cold</text>
  </g>
  <g>
    <rect x="255" y="270" width="210" height="128" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.25"/>
    <circle cx="285" cy="300" r="16" fill="#121212"/><text x="285" y="306" text-anchor="middle" class="gk num">5</text>
    <text x="275" y="342" class="gk step">Friday demos</text>
    <text x="275" y="370" class="sys desc">+ earlier prospects</text>
    <text x="275" y="390" class="sys desc">mature</text>
  </g>
  <g>
    <rect x="486" y="270" width="210" height="128" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.25"/>
    <circle cx="516" cy="300" r="16" fill="#121212"/><text x="516" y="306" text-anchor="middle" class="gk num">4</text>
    <text x="506" y="342" class="gk step">Next 20 sent</text>
    <text x="506" y="370" class="sys desc">Hold for reply tail</text>
  </g>

  <!-- Arrows -->
  <path d="M 234 174 L 255 174" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>
  <path d="M 465 174 L 486 174" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>
  <path d="M 591 238 L 591 270" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>
  <path d="M 486 334 L 465 334" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>
  <path d="M 255 334 L 234 334" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#oc-tri)"/>

  <!-- Legend -->
  <rect x="90" y="422" width="18" height="18" rx="3" fill="#fff5f5" stroke="#cc342d" stroke-width="2"/>
  <text x="116" y="437" class="sys legend">Cold outreach</text>
  <rect x="300" y="422" width="18" height="18" rx="3" fill="#fbe9ff" stroke="#a855f7" stroke-width="2"/>
  <text x="326" y="437" class="sys legend">Warm pipeline</text>
  <rect x="500" y="422" width="18" height="18" rx="3" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2"/>
  <text x="526" y="437" class="sys legend">Money lands</text>

  <text x="360" y="478" text-anchor="middle" class="sys basis">Basis: one week of the outbound cadence, cold sends + warm follow-ups</text>
</svg>
