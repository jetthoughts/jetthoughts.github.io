<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">A passing 3-screen prototype: entry point to core action to result, where a passing tester lands without coaching.</title>
  <desc id="wf-desc">Three wireframed screens joined by arrows. Screen 1, entry point: a list of 3 CSV files with a Match transactions button - can they start? Screen 2, core action: a Stripe versus QuickBooks match table, 12 matched and 3 flagged, with an Approve matches button - where testers stall. Screen 3, result, highlighted green as the pass target: a summary card, 12 matched and 3 flagged, with a Download report button - can they name what it did? Pass means reaching Screen 3 uncoached. Basis: a 3-screen clickable prototype test.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .head  { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .st    { font-size: 18px; font-weight: 700; fill: #121212; }
      .stg   { font-size: 18px; font-weight: 700; fill: #2e7d32; }
      .box   { font-size: 18px; font-weight: 400; fill: #333333; }
      .boxq  { font-size: 17px; font-weight: 400; fill: #777777; font-style: italic; }
      .cta   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .anno  { font-size: 18px; font-weight: 400; fill: #555555; font-style: italic; }
      .pass  { font-size: 18px; font-weight: 700; fill: #2e7d32; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="wf-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="424" fill="#faf7f2"/>

  <text x="360" y="46" text-anchor="middle" class="gk head">A passing 3-screen prototype</text>

  <!-- Screen 1: Entry point (neutral) -->
  <rect x="24" y="86" width="210" height="196" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="2.5"/>
  <rect x="38" y="102" width="182" height="30" rx="4" fill="#f4f1ec"/>
  <text x="129" y="123" text-anchor="middle" class="gk st">1 - Entry point</text>
  <rect x="38" y="144" width="182" height="60" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="129" y="170" text-anchor="middle" class="sys box">3 CSV files listed</text>
  <text x="129" y="192" text-anchor="middle" class="sys boxq">(fake data)</text>
  <rect x="41" y="224" width="176" height="40" rx="4" fill="#cc342d"/>
  <text x="129" y="250" text-anchor="middle" class="gk cta">Match transactions</text>
  <text x="129" y="308" text-anchor="middle" class="sys anno">Can they start?</text>

  <!-- Screen 2: Core action (neutral) -->
  <rect x="255" y="86" width="210" height="196" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="2.5"/>
  <rect x="269" y="102" width="182" height="30" rx="4" fill="#f4f1ec"/>
  <text x="360" y="123" text-anchor="middle" class="gk st">2 - Core action</text>
  <rect x="269" y="144" width="182" height="60" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="360" y="170" text-anchor="middle" class="sys box">Stripe vs QuickBooks</text>
  <text x="360" y="192" text-anchor="middle" class="sys box">12 matched, 3 flagged</text>
  <rect x="272" y="224" width="176" height="40" rx="4" fill="#cc342d"/>
  <text x="360" y="250" text-anchor="middle" class="gk cta">Approve matches</text>
  <text x="360" y="308" text-anchor="middle" class="sys anno">Where testers stall</text>

  <!-- Screen 3: Result (pass target - green) -->
  <rect x="486" y="86" width="210" height="196" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="500" y="102" width="182" height="30" rx="4" fill="#e6f4e6"/>
  <text x="591" y="123" text-anchor="middle" class="gk stg">3 - Result</text>
  <rect x="500" y="144" width="182" height="60" rx="4" fill="#ffffff" stroke="#b6d9b6" stroke-width="1.5"/>
  <text x="591" y="170" text-anchor="middle" class="sys box">Summary card</text>
  <text x="591" y="192" text-anchor="middle" class="sys box">12 matched, 3 flagged</text>
  <rect x="503" y="224" width="176" height="40" rx="4" fill="#cc342d"/>
  <text x="591" y="250" text-anchor="middle" class="gk cta">Download report</text>
  <text x="591" y="308" text-anchor="middle" class="sys anno">Can they name it?</text>

  <!-- Arrows -->
  <path d="M 234 184 L 255 184" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#wf-tri)"/>
  <path d="M 465 184 L 486 184" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#wf-tri)"/>

  <!-- PASS marker: the takeaway -->
  <rect x="180" y="328" width="360" height="34" rx="4" fill="#e6f4e6" stroke="#2e7d32" stroke-width="2"/>
  <text x="360" y="351" text-anchor="middle" class="gk pass">PASS = tester reaches Screen 3 uncoached</text>

  <text x="360" y="404" text-anchor="middle" class="sys basis">Basis: a 3-screen clickable prototype test</text>
</svg>
