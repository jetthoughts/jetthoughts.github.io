<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="fvo-title fvo-desc">
  <title id="fvo-title">Feature-shaped brief vs outcome-shaped brief, with the system the engineer builds under each.</title>
  <desc id="fvo-desc">A side-by-side comparison. Left, feature-shaped: the brief "Build a CSV export button" leads to a nine-box BI suite - dashboards, scheduled email, saved filters, exports, custom columns, roles, date picker, export queue, audit log. Nine features, six weeks, you used one; bill $18,400. Right, outcome-shaped: the brief "When I prepare the weekly investor report, I want the top 5 metrics in 30 seconds, to paste into the deck before the 4pm call" leads to one button, Copy top 5 metrics, above a short metrics list. Five numbers, one button, 90 minutes; bill $420. Basis: the same Friday brief, written two ways.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .stamp { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .bad   { font-size: 18px; font-weight: 700; fill: #cc342d; }
      .good  { font-size: 18px; font-weight: 700; fill: #2e7d32; }
      .lbl   { font-size: 18px; font-weight: 600; fill: #121212; }
      .tile  { font-size: 17px; font-weight: 400; fill: #121212; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .hint  { font-size: 17px; font-weight: 400; fill: #777777; }
      .bill  { font-size: 30px; font-weight: 700; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="740" fill="#faf7f2"/>

  <text x="360" y="48" text-anchor="middle" class="gk title">Same Friday brief. Two builds.</text>
  <text x="360" y="80" text-anchor="middle" class="gk msg">The brief's shape decides the build - and the bill</text>

  <!-- LEFT: FEATURE-shaped (red) -->
  <rect x="24" y="104" width="328" height="600" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <rect x="44" y="120" width="104" height="28" rx="4" fill="#cc342d"/>
  <text x="96" y="140" text-anchor="middle" class="gk stamp">FEATURE</text>
  <text x="44" y="180" class="gk bad">"Build a CSV</text>
  <text x="44" y="202" class="gk bad">export button"</text>
  <text x="44" y="234" class="sys hint">13 words. No persona,</text>
  <text x="44" y="256" class="sys hint">no context, no metric.</text>
  <text x="44" y="292" class="gk lbl">What the engineer builds:</text>

  <!-- 9-feature BI suite grid -->
  <rect x="44" y="306" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="88" y="333" text-anchor="middle" class="sys tile">Dash x3</text>
  <rect x="144" y="306" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="188" y="333" text-anchor="middle" class="sys tile">Email</text>
  <rect x="244" y="306" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="288" y="333" text-anchor="middle" class="sys tile">Filters</text>
  <rect x="44" y="362" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="88" y="389" text-anchor="middle" class="sys tile">Exports</text>
  <rect x="144" y="362" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="188" y="389" text-anchor="middle" class="sys tile">Columns</text>
  <rect x="244" y="362" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="288" y="389" text-anchor="middle" class="sys tile">Roles</text>
  <rect x="44" y="418" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="88" y="445" text-anchor="middle" class="sys tile">Dates</text>
  <rect x="144" y="418" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="188" y="445" text-anchor="middle" class="sys tile">Queue</text>
  <rect x="244" y="418" width="88" height="44" rx="4" fill="#ffe5e5" stroke="#cc342d" stroke-width="1.5"/>
  <text x="288" y="445" text-anchor="middle" class="sys tile">Audit</text>

  <text x="44" y="494" class="sys body">9 features. 6 weeks of build.</text>
  <text x="44" y="518" class="sys body">You used 1 - the CSV button.</text>
  <text x="44" y="542" class="sys hint">The other 8 = support cost + drag.</text>
  <text x="44" y="660" class="gk bill" fill="#cc342d">Bill: $18,400</text>

  <!-- RIGHT: OUTCOME-shaped (green) -->
  <rect x="368" y="104" width="328" height="600" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="388" y="120" width="112" height="28" rx="4" fill="#2e7d32"/>
  <text x="444" y="140" text-anchor="middle" class="gk stamp">OUTCOME</text>
  <text x="388" y="176" class="gk good">"When I prepare the weekly</text>
  <text x="388" y="198" class="gk good">investor report, I want the</text>
  <text x="388" y="220" class="gk good">top 5 metrics in 30 seconds,</text>
  <text x="388" y="242" class="gk good">to paste into the deck</text>
  <text x="388" y="264" class="gk good">before the 4pm call."</text>
  <text x="388" y="298" class="sys hint">Names the moment, action,</text>
  <text x="388" y="320" class="sys hint">result, and deadline.</text>
  <text x="388" y="356" class="gk lbl">What the engineer builds:</text>

  <!-- single button + metrics -->
  <rect x="388" y="372" width="288" height="48" rx="4" fill="#e6f4e6" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="532" y="402" text-anchor="middle" class="gk lbl">Copy top 5 metrics</text>
  <text x="400" y="452" class="sys body">MRR: £24,300</text>
  <text x="400" y="476" class="sys body">Net new MRR: £1,840</text>
  <text x="400" y="500" class="sys body">Active accounts: 312</text>
  <text x="400" y="524" class="sys body">Trial to paid: 8.4%</text>
  <text x="400" y="548" class="sys body">Runway: 14 months</text>
  <text x="388" y="584" class="sys hint">5 numbers. 1 button. 90 min to ship.</text>
  <text x="388" y="660" class="gk bill" fill="#2e7d32">Bill: $420</text>

  <text x="360" y="726" text-anchor="middle" class="sys basis">Basis: the same Friday brief, written two ways</text>
</svg>
