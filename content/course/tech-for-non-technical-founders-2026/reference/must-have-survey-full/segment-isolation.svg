<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="seg-title seg-desc">
  <title id="seg-title">Segment isolation: a blended 28% average hides one segment scoring 64%, which passes the 40% line and is the one to sell to first.</title>
  <desc id="seg-desc">Three cohort cards side by side, each with a fill bar and a dashed 40% threshold line. B2B Marketers score 64% must-have (9 of 14) and clear the line - highlighted green and tagged sell here first. Solo Founders 14% (1 of 7) and Agencies 0% (0 of 7) fall below the line, shown neutral. Basis: 28 survey responses, sliced by segment.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .name  { font-size: 20px; font-weight: 600; fill: #121212; }
      .pctg  { font-size: 32px; font-weight: 700; fill: #2e7d32; }
      .pctn  { font-size: 32px; font-weight: 700; fill: #888888; }
      .unit  { font-size: 18px; font-weight: 400; fill: #555555; }
      .count { font-size: 18px; font-weight: 400; fill: #333333; }
      .tick  { font-size: 17px; font-weight: 700; fill: #cc342d; }
      .pilltxt { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .verdict { font-size: 18px; font-weight: 600; fill: #888888; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="500" fill="#faf7f2"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">One average hides three products</text>
  <text x="360" y="78" text-anchor="middle" class="gk msg">Overall 28% looks like failure - until you slice by who</text>

  <!-- CARD 1: B2B Marketers (PASS - green) -->
  <rect x="24" y="104" width="216" height="352" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="132" y="138" text-anchor="middle" class="gk name">B2B Marketers</text>
  <text x="132" y="190" text-anchor="middle" class="gk pctg">64%</text>
  <text x="132" y="214" text-anchor="middle" class="sys unit">must-have</text>
  <rect x="40" y="232" width="184" height="22" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="40" y="232" width="117.8" height="22" fill="#2e7d32"/>
  <line x1="113.6" y1="226" x2="113.6" y2="260" stroke="#cc342d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="113.6" y="280" text-anchor="middle" class="sys tick">40% line</text>
  <text x="132" y="312" text-anchor="middle" class="sys count">9 of 14 said</text>
  <text x="132" y="334" text-anchor="middle" class="sys count">"very disappointed"</text>
  <rect x="40" y="384" width="184" height="34" rx="4" fill="#2e7d32"/>
  <text x="132" y="407" text-anchor="middle" class="gk pilltxt">SELL HERE FIRST</text>

  <!-- CARD 2: Solo Founders (neutral) -->
  <rect x="252" y="104" width="216" height="352" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="2"/>
  <text x="360" y="138" text-anchor="middle" class="gk name">Solo Founders</text>
  <text x="360" y="190" text-anchor="middle" class="gk pctn">14%</text>
  <text x="360" y="214" text-anchor="middle" class="sys unit">must-have</text>
  <rect x="268" y="232" width="184" height="22" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="268" y="232" width="25.8" height="22" fill="#b8b0a8"/>
  <line x1="341.6" y1="226" x2="341.6" y2="260" stroke="#cc342d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="341.6" y="280" text-anchor="middle" class="sys tick">40% line</text>
  <text x="360" y="312" text-anchor="middle" class="sys count">1 of 7 said</text>
  <text x="360" y="334" text-anchor="middle" class="sys count">"very disappointed"</text>
  <text x="360" y="407" text-anchor="middle" class="gk verdict">Below the line - not now</text>

  <!-- CARD 3: Agencies (neutral) -->
  <rect x="480" y="104" width="216" height="352" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="2"/>
  <text x="588" y="138" text-anchor="middle" class="gk name">Agencies</text>
  <text x="588" y="190" text-anchor="middle" class="gk pctn">0%</text>
  <text x="588" y="214" text-anchor="middle" class="sys unit">must-have</text>
  <rect x="496" y="232" width="184" height="22" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="569.6" y1="226" x2="569.6" y2="260" stroke="#cc342d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="569.6" y="280" text-anchor="middle" class="sys tick">40% line</text>
  <text x="588" y="312" text-anchor="middle" class="sys count">0 of 7 said</text>
  <text x="588" y="334" text-anchor="middle" class="sys count">"very disappointed"</text>
  <text x="588" y="407" text-anchor="middle" class="gk verdict">Never your buyer</text>

  <text x="360" y="484" text-anchor="middle" class="sys basis">Basis: 28 survey responses, sliced by segment</text>
</svg>
