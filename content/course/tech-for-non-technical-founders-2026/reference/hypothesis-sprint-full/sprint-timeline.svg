<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="sprint-title sprint-desc">
  <title id="sprint-title">The six-step founding-hypothesis sprint, run alone in about 90 minutes</title>
  <desc id="sprint-desc">Six numbered step cards laid out as a snake - three across the top left to right, then wrapping to three across the bottom left to right - joined by arrows. Step 1 The Basics: five candidates per column. Step 2 Differentiator: faster, easier, or cheaper. Step 3 Three Approaches: one sentence each. Step 4 Magic Lenses: score 1 to 5 on four lenses. Step 5 Write It Down: the one Mad Libs sentence. Step 6 Design the Test: smoke test plus interviews. Basis: the founding-hypothesis sprint worksheet.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .step  { font-size: 20px; font-weight: 600; fill: #121212; }
      .desc  { font-size: 18px; font-weight: 400; fill: #555555; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="ts-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="424" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="50" text-anchor="middle" class="gk title">The 6-step founding-hypothesis sprint</text>
  <text x="360" y="82" text-anchor="middle" class="gk msg">One notebook, a timer, about 90 minutes - run it alone</text>

  <!-- Row 1: steps 1, 2, 3 -->
  <g>
    <rect x="24" y="110" width="210" height="128" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="56" cy="144" r="16" fill="#121212"/>
    <text x="56" y="150" text-anchor="middle" class="gk num">1</text>
    <text x="82" y="150" class="gk step">The Basics</text>
    <text x="44" y="188" class="sys desc">five candidates</text>
    <text x="44" y="212" class="sys desc">per column</text>
  </g>
  <g>
    <rect x="255" y="110" width="210" height="128" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="287" cy="144" r="16" fill="#121212"/>
    <text x="287" y="150" text-anchor="middle" class="gk num">2</text>
    <text x="313" y="150" class="gk step">Differentiator</text>
    <text x="275" y="188" class="sys desc">faster, easier,</text>
    <text x="275" y="212" class="sys desc">or cheaper</text>
  </g>
  <g>
    <rect x="486" y="110" width="210" height="128" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="518" cy="144" r="16" fill="#121212"/>
    <text x="518" y="150" text-anchor="middle" class="gk num">3</text>
    <text x="544" y="150" class="gk step">3 Approaches</text>
    <text x="506" y="188" class="sys desc">one sentence</text>
    <text x="506" y="212" class="sys desc">each</text>
  </g>

  <!-- Row 2: steps 4, 5, 6 -->
  <g>
    <rect x="24" y="270" width="210" height="128" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="56" cy="304" r="16" fill="#121212"/>
    <text x="56" y="310" text-anchor="middle" class="gk num">4</text>
    <text x="82" y="310" class="gk step">Magic Lenses</text>
    <text x="44" y="348" class="sys desc">score 1-5 on</text>
    <text x="44" y="372" class="sys desc">four lenses</text>
  </g>
  <g>
    <rect x="255" y="270" width="210" height="128" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="287" cy="304" r="16" fill="#121212"/>
    <text x="287" y="310" text-anchor="middle" class="gk num">5</text>
    <text x="313" y="310" class="gk step">Write It Down</text>
    <text x="275" y="348" class="sys desc">the one Mad</text>
    <text x="275" y="372" class="sys desc">Libs sentence</text>
  </g>
  <g>
    <rect x="486" y="270" width="210" height="128" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="518" cy="304" r="16" fill="#121212"/>
    <text x="518" y="310" text-anchor="middle" class="gk num">6</text>
    <text x="544" y="310" class="gk step">Design Test</text>
    <text x="506" y="348" class="sys desc">smoke test +</text>
    <text x="506" y="372" class="sys desc">interviews</text>
  </g>

  <!-- Row 1 arrows -->
  <path d="M 234 174 L 255 174" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ts-tri)"/>
  <path d="M 465 174 L 486 174" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ts-tri)"/>
  <!-- Snake wrap: step 3 down and across to step 4 -->
  <path d="M 591 238 L 591 254 L 129 254 L 129 270" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ts-tri)"/>
  <!-- Row 2 arrows -->
  <path d="M 234 334 L 255 334" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ts-tri)"/>
  <path d="M 465 334 L 486 334" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ts-tri)"/>

  <text x="360" y="424" text-anchor="middle" class="sys basis">Basis: the founding-hypothesis sprint worksheet</text>
</svg>
