<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="mt-title mt-desc">
  <title id="mt-title">Mom Test answers - polite hypothetical vs specific past behavior</title>
  <desc id="mt-desc">Side-by-side comparison. Left, marked Bad and scored 2 out of 10: a polite hypothetical answer - "Yeah, I'd totally pay for that." No date, no quantified pain, a hypothetical commitment. Right, marked Good and scored 8 out of 10: a specific past-behavior answer - "Last Tuesday 9pm, 40 minutes copying spreadsheets, called my CFO, felt stupid." A date, time, tool, person, and an emotional flag. Same interviewee, same problem, opposite signal, decided by how the question was worded. Basis: the Mom Test interview method.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .hbad  { font-size: 20px; font-weight: 700; fill: #cc342d; }
      .hgood { font-size: 20px; font-weight: 700; fill: #2e7d32; }
      .lbl   { font-size: 18px; font-weight: 600; fill: #121212; }
      .quote { font-size: 18px; font-weight: 400; fill: #333333; font-style: italic; }
      .mbad  { font-size: 18px; font-weight: 400; fill: #c62828; }
      .mgood { font-size: 18px; font-weight: 400; fill: #2e7d32; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="580" fill="#faf7f2"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">Same problem. Opposite signal.</text>
  <text x="360" y="78" text-anchor="middle" class="gk msg">The question wording decides which answer you get</text>

  <!-- BAD card (left) -->
  <rect x="24" y="106" width="328" height="424" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <text x="44" y="142" class="gk hbad">BAD - polite hypothetical</text>
  <text x="44" y="176" class="gk lbl">You asked:</text>
  <text x="44" y="202" class="sys quote">"Would you pay $49/mo for a</text>
  <text x="44" y="226" class="sys quote">tool that automates this?"</text>
  <text x="44" y="262" class="gk lbl">They said:</text>
  <text x="44" y="288" class="sys quote">"Yeah, I'd totally pay for</text>
  <text x="44" y="312" class="sys quote">that! Sign me up."</text>
  <text x="44" y="360" class="gk lbl">You learned:</text>
  <text x="44" y="386" class="sys mbad">- No date, no real story</text>
  <text x="44" y="410" class="sys mbad">- No quantified pain</text>
  <text x="44" y="434" class="sys mbad">- Hypothetical commitment</text>
  <text x="44" y="478" class="gk hbad">Score: 2/10</text>
  <text x="44" y="504" class="sys mbad">Kind - but 8 of these = 0 buyers</text>

  <!-- GOOD card (right) -->
  <rect x="368" y="106" width="328" height="424" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="388" y="142" class="gk hgood">GOOD - past behavior</text>
  <text x="388" y="176" class="gk lbl">You asked:</text>
  <text x="388" y="202" class="sys quote">"Tell me about the last time</text>
  <text x="388" y="226" class="sys quote">you ran a board report."</text>
  <text x="388" y="262" class="gk lbl">They said:</text>
  <text x="388" y="288" class="sys quote">"Last Tuesday 9pm, 40 min</text>
  <text x="388" y="312" class="sys quote">copying spreadsheets. Called</text>
  <text x="388" y="336" class="sys quote">my CFO. I felt stupid."</text>
  <text x="388" y="372" class="gk lbl">You learned:</text>
  <text x="388" y="398" class="sys mgood">- Date, time, tool, person</text>
  <text x="388" y="422" class="sys mgood">- Flag: "felt stupid"</text>
  <text x="388" y="446" class="sys mgood">- A real recent incident</text>
  <text x="388" y="478" class="gk hgood">Score: 8/10</text>
  <text x="388" y="504" class="sys mgood">Real pain - 7+ of these = validated</text>

  <text x="360" y="562" text-anchor="middle" class="sys basis">Basis: the Mom Test interview method - same interviewee, same problem</text>
</svg>
