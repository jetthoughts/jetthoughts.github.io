<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">The Stripe price-test flow: build the Payment Link, wire it to the page, read the click rate, then act on the band it lands in.</title>
  <desc id="pt-desc">Three numbered step cards in a row - create the Stripe Payment Link with a one-time product at your hypothesis price, wire it to the landing-page button in live mode, and read the visit-to-Stripe-click rate. The rate forks into three outcome bands. Under 5 percent, amber, iterate: cut the price by half and add founding-member framing; below 2 percent means the audience is wrong, not the price. Five to ten percent, green, advance: the price is validated, move to Module 2 interviews and email everyone who clicked but did not buy. Over 10 percent, purple, verify: run a second cold channel; if both hold the signal is real, if one spikes the targeting was hot, not the pricing. Basis: one 7-day price test on a live Payment Link.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .sub   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .step  { font-size: 20px; font-weight: 600; fill: #121212; }
      .sm    { font-size: 18px; font-weight: 400; fill: #555555; }
      .outa  { font-size: 19px; font-weight: 700; fill: #b8860b; }
      .outg  { font-size: 19px; font-weight: 700; fill: #2e7d32; }
      .outp  { font-size: 19px; font-weight: 700; fill: #7b2fb5; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="pt-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="444" fill="#faf7f2"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The Stripe price test, step by step</text>
  <text x="360" y="78" text-anchor="middle" class="gk sub">A card entry costs intent - measure the one that counts</text>

  <!-- Step cards -->
  <g>
    <rect x="24" y="102" width="210" height="82" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
    <circle cx="52" cy="130" r="15" fill="#121212"/><text x="52" y="136" text-anchor="middle" class="gk num">1</text>
    <text x="44" y="158" class="gk step">Create the Link</text>
    <text x="44" y="178" class="sys sm">one-time, your price</text>
  </g>
  <g>
    <rect x="255" y="102" width="210" height="82" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
    <circle cx="283" cy="130" r="15" fill="#121212"/><text x="283" y="136" text-anchor="middle" class="gk num">2</text>
    <text x="275" y="158" class="gk step">Wire to button</text>
    <text x="275" y="178" class="sys sm">live mode, not test</text>
  </g>
  <g>
    <rect x="486" y="102" width="210" height="82" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
    <circle cx="514" cy="130" r="15" fill="#121212"/><text x="514" y="136" text-anchor="middle" class="gk num">3</text>
    <text x="506" y="158" class="gk step">Read click rate</text>
    <text x="506" y="178" class="sys sm">visits to clicks</text>
  </g>

  <!-- Step arrows -->
  <path d="M 234 143 L 255 143" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#pt-tri)"/>
  <path d="M 465 143 L 486 143" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#pt-tri)"/>

  <!-- Fork arrows from step 3 to the three bands -->
  <path d="M 570 184 C 420 208, 240 208, 132 224" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#pt-tri)"/>
  <path d="M 591 184 C 520 206, 430 210, 360 224" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#pt-tri)"/>
  <path d="M 600 184 C 610 204, 600 214, 588 224" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#pt-tri)"/>

  <!-- Outcome bands -->
  <rect x="24" y="230" width="216" height="182" rx="4" fill="#fffbeb" stroke="#b8860b" stroke-width="2.5"/>
  <text x="40" y="262" class="gk outa">Under 5% - iterate</text>
  <text x="40" y="292" class="sys body">Cut price 50%, add</text>
  <text x="40" y="314" class="sys body">founding-member hook.</text>
  <text x="40" y="344" class="sys body">Below 2% = wrong</text>
  <text x="40" y="366" class="sys body">audience, not price.</text>

  <rect x="252" y="230" width="216" height="182" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="268" y="262" class="gk outg">5 - 10% - advance</text>
  <text x="268" y="292" class="sys body">Price validated.</text>
  <text x="268" y="314" class="sys body">Go to Module 2</text>
  <text x="268" y="344" class="sys body">interviews. Email the</text>
  <text x="268" y="366" class="sys body">click-not-buyers.</text>

  <rect x="480" y="230" width="216" height="182" rx="4" fill="#fbe9ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="496" y="262" class="gk outp">Over 10% - verify</text>
  <text x="496" y="292" class="sys body">Run a 2nd cold</text>
  <text x="496" y="314" class="sys body">channel. Both hold =</text>
  <text x="496" y="344" class="sys body">real signal. One spike</text>
  <text x="496" y="366" class="sys body">= hot targeting.</text>

  <text x="360" y="432" text-anchor="middle" class="sys basis">Basis: one 7-day price test on a live Payment Link</text>
</svg>
