<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="email-title email-desc">
  <title id="email-title">Bad vs Good: contractor email on the AWS root account compared with the founder's company email on the same account</title>
  <desc id="email-desc">Two panels. Bad, a hostage situation: account email aws@bigdevshop.com, billing on the agency AmEx, your access an IAM user that never logged into root; if they ghost, 10 minutes to lock you out and 3-5 business days for AWS to recover with incorporation papers. Good, you hold the keys: account email aws@yourcompany.com, billing on your company AmEx, root password in 1Password plus MFA; if they ghost, revoke their IAM user, rotate the root password, ship a hotfix the same afternoon. Same account, same software - one field changes everything downstream. Basis: AWS root account ownership.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono  { font-family: "JetBrains Mono", "Menlo", monospace; font-size: 17px; fill: #121212; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .pt    { font-size: 22px; font-weight: 700; fill: #121212; }
      .label { font-size: 18px; font-weight: 600; fill: #555555; }
      .cap   { font-size: 17px; font-weight: 400; fill: #666666; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="600" fill="#faf7f2"/>

  <text x="360" y="48" text-anchor="middle" class="gk title">AWS root account - who owns the email?</text>

  <!-- BAD panel -->
  <rect x="24" y="88" width="328" height="456" rx="4" fill="#fff5f5" stroke="#cc342d" stroke-width="2.5"/>
  <rect x="44" y="104" width="72" height="28" rx="4" fill="#cc342d"/>
  <text x="80" y="124" text-anchor="middle" class="sys badge">BAD</text>
  <text x="44" y="164" class="gk pt">Hostage situation</text>
  <text x="44" y="200" class="gk label">Account email</text>
  <text x="44" y="224" class="mono">aws@bigdevshop.com</text>
  <line x1="44" y1="240" x2="332" y2="240" stroke="#e0cccc" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="44" y="268" class="gk label">Billing card</text>
  <text x="44" y="292" class="mono">**** 4421 (agency AmEx)</text>
  <line x1="44" y1="308" x2="332" y2="308" stroke="#e0cccc" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="44" y="336" class="gk label">Your access</text>
  <text x="44" y="360" class="mono">IAM user, never</text>
  <text x="44" y="382" class="mono">logged into root</text>
  <line x1="44" y1="398" x2="332" y2="398" stroke="#e0cccc" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="44" y="426" class="gk label">Recovery if they ghost</text>
  <text x="44" y="452" class="sys cap">10 minutes for them to lock</text>
  <text x="44" y="474" class="sys cap">you out. 3-5 business days for</text>
  <text x="44" y="496" class="sys cap">AWS to recover with papers.</text>

  <!-- GOOD panel -->
  <rect x="368" y="88" width="328" height="456" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="388" y="104" width="82" height="28" rx="4" fill="#2e7d32"/>
  <text x="429" y="124" text-anchor="middle" class="sys badge">GOOD</text>
  <text x="388" y="164" class="gk pt">You hold the keys</text>
  <text x="388" y="200" class="gk label">Account email</text>
  <text x="388" y="224" class="mono">aws@yourcompany.com</text>
  <line x1="388" y1="240" x2="676" y2="240" stroke="#cce0cc" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="388" y="268" class="gk label">Billing card</text>
  <text x="388" y="292" class="mono">**** 0987 (company AmEx)</text>
  <line x1="388" y1="308" x2="676" y2="308" stroke="#cce0cc" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="388" y="336" class="gk label">Your access</text>
  <text x="388" y="360" class="mono">Root password in</text>
  <text x="388" y="382" class="mono">1Password + MFA</text>
  <line x1="388" y1="398" x2="676" y2="398" stroke="#cce0cc" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="388" y="426" class="gk label">Recovery if they ghost</text>
  <text x="388" y="452" class="sys cap">Revoke their IAM user. Rotate</text>
  <text x="388" y="474" class="sys cap">the root password. Ship a hotfix</text>
  <text x="388" y="496" class="sys cap">the same afternoon.</text>

  <text x="360" y="576" text-anchor="middle" class="sys basis">Same account, same software. One field changes - everything downstream changes with it.</text>
</svg>
