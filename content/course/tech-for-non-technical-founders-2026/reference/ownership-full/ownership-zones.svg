<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" role="img" aria-labelledby="zones-title zones-desc">
  <title id="zones-title">The four ownership zones a non-technical founder must control: code, cloud, secrets, and domain</title>
  <desc id="zones-desc">Four zone cards. Zone 1 Code: GitHub org, repos, branch rules - if the agency owns the org they can delete every repo on Tuesday; audit items 1-3. Zone 2 Cloud: AWS root, IAM, billing card - the root account email is the master key, whoever owns it owns the stack; audit items 4-6. Zone 3 Secrets: database creds, API keys, .env - if only one person knows the prod DB password that is a hostage situation, not a database; audit items 7-9. Zone 4 Domain: registrar, DNS, third-party SaaS - a registrar transfer takes 14 days, so a held domain means customers cannot reach you for two weeks; audit items 10-12. A contractor's email on any one means you do not own the company. Basis: the 12-item ownership audit.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .warn  { font-size: 20px; font-weight: 600; fill: #cc342d; }
      .badge { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .zt    { font-size: 22px; font-weight: 700; fill: #121212; }
      .sub   { font-size: 18px; font-weight: 600; fill: #121212; }
      .note  { font-size: 18px; font-weight: 400; fill: #555555; }
      .audit { font-size: 18px; font-weight: 600; fill: #777777; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <rect width="720" height="612" fill="#faf7f2"/>

  <text x="360" y="48" text-anchor="middle" class="gk title">The four zones you must own by Friday</text>
  <text x="360" y="80" text-anchor="middle" class="gk warn">A contractor's email on any one = you don't own the company</text>

  <!-- Zone 1: Code -->
  <rect x="24" y="96" width="328" height="214" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <rect x="44" y="116" width="80" height="26" rx="4" fill="#121212"/>
  <text x="84" y="135" text-anchor="middle" class="gk badge">ZONE 1</text>
  <text x="136" y="137" class="gk zt">CODE</text>
  <text x="44" y="174" class="gk sub">GitHub org, repos, branch rules</text>
  <text x="44" y="202" class="sys note">If the agency owns the org, they</text>
  <text x="44" y="224" class="sys note">can delete every repo on Tuesday.</text>
  <text x="44" y="284" class="gk audit">Audit items 1-3</text>

  <!-- Zone 2: Cloud -->
  <rect x="368" y="96" width="328" height="214" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <rect x="388" y="116" width="80" height="26" rx="4" fill="#121212"/>
  <text x="428" y="135" text-anchor="middle" class="gk badge">ZONE 2</text>
  <text x="480" y="137" class="gk zt">CLOUD</text>
  <text x="388" y="174" class="gk sub">AWS root, IAM, billing card</text>
  <text x="388" y="202" class="sys note">Root account email is the master</text>
  <text x="388" y="224" class="sys note">key - owns it, owns the stack.</text>
  <text x="388" y="284" class="gk audit">Audit items 4-6</text>

  <!-- Zone 3: Secrets -->
  <rect x="24" y="326" width="328" height="214" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <rect x="44" y="346" width="80" height="26" rx="4" fill="#121212"/>
  <text x="84" y="365" text-anchor="middle" class="gk badge">ZONE 3</text>
  <text x="136" y="367" class="gk zt">SECRETS</text>
  <text x="44" y="404" class="gk sub">DB creds, API keys, .env</text>
  <text x="44" y="432" class="sys note">If only one person knows the prod</text>
  <text x="44" y="454" class="sys note">DB password, that's a hostage</text>
  <text x="44" y="476" class="sys note">situation, not a database.</text>
  <text x="44" y="514" class="gk audit">Audit items 7-9</text>

  <!-- Zone 4: Domain -->
  <rect x="368" y="326" width="328" height="214" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <rect x="388" y="346" width="80" height="26" rx="4" fill="#121212"/>
  <text x="428" y="365" text-anchor="middle" class="gk badge">ZONE 4</text>
  <text x="480" y="367" class="gk zt">DOMAIN</text>
  <text x="388" y="404" class="gk sub">Registrar, DNS, 3rd-party SaaS</text>
  <text x="388" y="432" class="sys note">A registrar transfer takes 14 days.</text>
  <text x="388" y="454" class="sys note">Hold it hostage and customers</text>
  <text x="388" y="476" class="sys note">can't reach you for 2 weeks.</text>
  <text x="388" y="514" class="gk audit">Audit items 10-12</text>

  <text x="360" y="588" text-anchor="middle" class="sys basis">Basis: the 12-item ownership audit - 45 minutes, one Friday afternoon</text>
</svg>
