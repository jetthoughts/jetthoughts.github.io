<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="minpath-title minpath-desc">
  <title id="minpath-title">The minimal path: five numbered core-lesson stops from idea to first paying customer.</title>
  <desc id="minpath-desc">A left-to-right strip of five numbered step cards. Step 1 Hypothesis and Smoke Test produces a landing page and a price signal. Step 2 Validate the Problem produces 10 interviews and a prototype. Step 3 Design from Evidence produces a one-page Product Brief. Step 4 Build It Yourself produces a live MVP at a real URL. Step 5 First Paying Customer produces a signed paid pilot. Arrows connect each step to the next.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .ttl   { font-size: 18px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .out   { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="284" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <text x="360" y="40" text-anchor="middle" class="gk title">The minimal path</text>
  <text x="360" y="66" text-anchor="middle" class="gk msg">Core lessons only - idea to first paying customer</text>

  <!-- 5 step cards -->
  <g>
    <rect x="24" y="94" width="120" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="84" cy="122" r="15" fill="#121212"/>
    <text x="84" y="128" text-anchor="middle" class="gk num">1</text>
    <text x="84" y="164" text-anchor="middle" class="gk ttl">Hypothesis</text>
    <text x="84" y="185" text-anchor="middle" class="gk ttl">+ Smoke Test</text>
    <text x="84" y="216" text-anchor="middle" class="sys out">landing page</text>
    <text x="84" y="236" text-anchor="middle" class="sys out">+ price signal</text>
  </g>
  <g>
    <rect x="164" y="94" width="120" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="224" cy="122" r="15" fill="#121212"/>
    <text x="224" y="128" text-anchor="middle" class="gk num">2</text>
    <text x="224" y="164" text-anchor="middle" class="gk ttl">Validate the</text>
    <text x="224" y="185" text-anchor="middle" class="gk ttl">Problem</text>
    <text x="224" y="216" text-anchor="middle" class="sys out">10 interviews</text>
    <text x="224" y="236" text-anchor="middle" class="sys out">+ prototype</text>
  </g>
  <g>
    <rect x="304" y="94" width="120" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="364" cy="122" r="15" fill="#121212"/>
    <text x="364" y="128" text-anchor="middle" class="gk num">3</text>
    <text x="364" y="164" text-anchor="middle" class="gk ttl">Design from</text>
    <text x="364" y="185" text-anchor="middle" class="gk ttl">Evidence</text>
    <text x="364" y="216" text-anchor="middle" class="sys out">one-page</text>
    <text x="364" y="236" text-anchor="middle" class="sys out">Product Brief</text>
  </g>
  <g>
    <rect x="444" y="94" width="120" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="504" cy="122" r="15" fill="#121212"/>
    <text x="504" y="128" text-anchor="middle" class="gk num">4</text>
    <text x="504" y="164" text-anchor="middle" class="gk ttl">Build It</text>
    <text x="504" y="185" text-anchor="middle" class="gk ttl">Yourself</text>
    <text x="504" y="216" text-anchor="middle" class="sys out">live MVP at</text>
    <text x="504" y="236" text-anchor="middle" class="sys out">a real URL</text>
  </g>
  <!-- Step 5: money outcome = green -->
  <g>
    <rect x="584" y="94" width="120" height="160" rx="4" fill="#f0f9f0" stroke="#2e7d32" stroke-width="2.5"/>
    <circle cx="644" cy="122" r="15" fill="#2e7d32"/>
    <text x="644" y="128" text-anchor="middle" class="gk num">5</text>
    <text x="644" y="164" text-anchor="middle" class="gk ttl">First Paying</text>
    <text x="644" y="185" text-anchor="middle" class="gk ttl">Customer</text>
    <text x="644" y="216" text-anchor="middle" class="sys out">signed</text>
    <text x="644" y="236" text-anchor="middle" class="sys out">paid pilot</text>
  </g>

  <!-- Arrows -->
  <path d="M 146 174 L 162 174" stroke="#999999" stroke-width="2.25" fill="none" marker-end="url(#mp)"/>
  <path d="M 286 174 L 302 174" stroke="#999999" stroke-width="2.25" fill="none" marker-end="url(#mp)"/>
  <path d="M 426 174 L 442 174" stroke="#999999" stroke-width="2.25" fill="none" marker-end="url(#mp)"/>
  <path d="M 566 174 L 582 174" stroke="#999999" stroke-width="2.25" fill="none" marker-end="url(#mp)"/>
</svg>
