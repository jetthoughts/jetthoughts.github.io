<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="ht-title ht-desc">
  <title id="ht-title">The hire track: four stops from the self-serve ceiling to a well-signed first hire.</title>
  <desc id="ht-desc">A left-to-right strip of four numbered cards joined by arrows. Step 1 find your developers: pick a geography and two platforms. Step 2 the Fractional CTO bridge: 5 hours a week of senior eyes at $400-600 a week. Step 3 the interview screen: 7 questions, where question 7 splits the pool. Step 4 read the SOW: the milestone-acceptance clause is the $78K line. Basis: the hire-track supplementary guide.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .sub   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .ttl   { font-size: 20px; font-weight: 700; fill: #121212; }
      .out   { font-size: 18px; font-weight: 400; fill: #555555; }
      .sig   { font-size: 18px; font-weight: 700; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="ht-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#faf7f2"/>

  <text x="360" y="46" text-anchor="middle" class="gk title">The hire track</text>
  <text x="360" y="78" text-anchor="middle" class="gk sub">Four stops - self-serve ceiling to a safe first hire</text>

  <!-- Stop 1 -->
  <rect x="24" y="100" width="156" height="160" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <circle cx="102" cy="128" r="16" fill="#121212"/><text x="102" y="134" text-anchor="middle" class="gk num">1</text>
  <text x="102" y="162" text-anchor="middle" class="gk ttl">Find your</text>
  <text x="102" y="184" text-anchor="middle" class="gk ttl">developers</text>
  <text x="102" y="214" text-anchor="middle" class="sys out">pick a geography</text>
  <text x="102" y="234" text-anchor="middle" class="sys out">+ two platforms</text>

  <!-- Stop 2 -->
  <rect x="196" y="100" width="156" height="160" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <circle cx="274" cy="128" r="16" fill="#121212"/><text x="274" y="134" text-anchor="middle" class="gk num">2</text>
  <text x="274" y="162" text-anchor="middle" class="gk ttl">Fractional</text>
  <text x="274" y="184" text-anchor="middle" class="gk ttl">CTO bridge</text>
  <text x="274" y="214" text-anchor="middle" class="sys out">5 hrs/wk senior</text>
  <text x="274" y="234" text-anchor="middle" class="sys out">$400-600 a week</text>

  <!-- Stop 3 -->
  <rect x="368" y="100" width="156" height="160" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <circle cx="446" cy="128" r="16" fill="#121212"/><text x="446" y="134" text-anchor="middle" class="gk num">3</text>
  <text x="446" y="162" text-anchor="middle" class="gk ttl">Interview</text>
  <text x="446" y="184" text-anchor="middle" class="gk ttl">screen</text>
  <text x="446" y="214" text-anchor="middle" class="sys out">7 questions -</text>
  <text x="446" y="234" text-anchor="middle" class="sys out">Q7 splits pool</text>

  <!-- Stop 4 -->
  <rect x="540" y="100" width="156" height="160" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <circle cx="618" cy="128" r="16" fill="#121212"/><text x="618" y="134" text-anchor="middle" class="gk num">4</text>
  <text x="618" y="162" text-anchor="middle" class="gk ttl">Read the</text>
  <text x="618" y="184" text-anchor="middle" class="gk ttl">SOW</text>
  <text x="618" y="214" text-anchor="middle" class="sys out">milestone clause</text>
  <text x="618" y="234" text-anchor="middle" class="sys sig">= the $78K line</text>

  <!-- Arrows -->
  <path d="M 180 180 L 196 180" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ht-tri)"/>
  <path d="M 352 180 L 368 180" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ht-tri)"/>
  <path d="M 524 180 L 540 180" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ht-tri)"/>

  <text x="360" y="290" text-anchor="middle" class="sys basis">Basis: the hire-track supplementary guide</text>
</svg>
