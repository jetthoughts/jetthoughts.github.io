<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
  <title id="t">Three links in the review chain, only one of which can be automated</title>
  <desc id="d">A model writes, a second model challenges, and a person with domain knowledge adjudicates. The first two are automatable; the third is not. Drop the third and two confident systems agree with each other.</desc>

  <rect width="720" height="260" fill="#0e0e14"/>

  <text x="32" y="40" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e8eaf0">Three links. Only one of them is a person.</text>

  <!-- link 1 -->
  <rect x="32" y="72" width="186" height="92" rx="10" fill="#1a1a24" stroke="#cc342d" stroke-width="1.5"/>
  <text x="48" y="100" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#cc342d" letter-spacing="1.1">1 - AUTOMATED</text>
  <text x="48" y="126" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">A model writes</text>
  <text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#8b90a0">fluent, confident, fast</text>

  <path d="M226 118 L258 118" stroke="#4b5060" stroke-width="2"/>
  <path d="M252 112 L260 118 L252 124 Z" fill="#4b5060"/>

  <!-- link 2 -->
  <rect x="267" y="72" width="186" height="92" rx="10" fill="#1a1a24" stroke="#a855f7" stroke-width="1.5"/>
  <text x="283" y="100" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#a855f7" letter-spacing="1.1">2 - AUTOMATED</text>
  <text x="283" y="126" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">Another challenges</text>
  <text x="283" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#8b90a0">different type, told to object</text>

  <path d="M461 118 L493 118" stroke="#4b5060" stroke-width="2"/>
  <path d="M487 112 L495 118 L487 124 Z" fill="#4b5060"/>

  <!-- link 3 -->
  <rect x="502" y="72" width="186" height="92" rx="10" fill="#241a24" stroke="#e8eaf0" stroke-width="2"/>
  <text x="518" y="100" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#e8eaf0" letter-spacing="1.1">3 - NOT AUTOMATED</text>
  <text x="518" y="126" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">A person referees</text>
  <text x="518" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#8b90a0">knows the answer already</text>

  <text x="32" y="212" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#cc342d">Drop link 3</text>
  <text x="118" y="212" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#8b90a0">and you have two confident systems agreeing with each other.</text>
  <text x="32" y="238" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8b90a0">That agreement looks exactly like a passing review.</text>
</svg>
