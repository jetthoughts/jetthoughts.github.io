<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-labelledby="rt rd">
  <title id="rt">Which reviewer's comments developers actually act on, measured at Uber</title>
  <desc id="rd">At Uber, 51 percent of human-written review comments are judged real bugs by the author and fixed in the same changeset. Uber's AI reviewer uReview reaches over 65 percent, and engineers mark 75 percent of its comments useful.</desc>

  <rect width="720" height="252" fill="#0e0e14"/>

  <text x="32" y="40" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e8eaf0">Comments the author agreed with and fixed</text>
  <text x="32" y="62" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8b90a0">Uber, measured across ~65,000 code changes a week</text>

  <!-- scale -->
  <line x1="232" y1="84" x2="232" y2="196" stroke="#3a3f4d" stroke-width="1.5"/>
  <line x1="592" y1="84" x2="592" y2="196" stroke="#3a3f4d" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="592" y="212" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6b7080">100%</text>

  <!-- human 51% -->
  <text x="216" y="118" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8b90a0">Human reviewers</text>
  <rect x="232" y="100" width="184" height="28" rx="4" fill="#cc342d" opacity="0.85"/>
  <text x="430" y="120" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#cc342d">51%</text>

  <!-- uReview 65% -->
  <text x="216" y="170" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#e8eaf0" font-weight="700">uReview (AI)</text>
  <rect x="232" y="152" width="234" height="28" rx="4" fill="#a855f7" opacity="0.8"/>
  <text x="480" y="172" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#a855f7">over 65%</text>

  <text x="32" y="240" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#8b90a0">The machine reviewer is not the weak one in this comparison.</text>
</svg>
