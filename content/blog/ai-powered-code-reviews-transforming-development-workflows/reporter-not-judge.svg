<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Two designs compared. Asking the model for a verdict: it reports a SQL injection and writes approve in the same response, so the gate passes. Computing the verdict in code: any specialist reporting a finding forces request changes, and the model gets no vote.">
  <rect width="640" height="400" fill="#0e0e14"/>
  <text x="24" y="38" fill="#dfe2eb" font-family="Inter,Helvetica,sans-serif" font-size="21" font-weight="600">Who decides what the findings mean?</text>

  <text x="24" y="76" fill="#ff8a7a" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="700">ASK THE MODEL</text>
  <rect x="24" y="90" width="276" height="120" rx="8" fill="#1c2026" stroke="#cc342d" stroke-width="2"/>
  <text x="40" y="118" fill="#dfe2eb" font-family="Menlo,monospace" font-size="13">findings:</text>
  <text x="40" y="140" fill="#dfe2eb" font-family="Menlo,monospace" font-size="13">  - SQL injection</text>
  <text x="40" y="162" fill="#dfe2eb" font-family="Menlo,monospace" font-size="13">  - unchecked input</text>
  <text x="40" y="192" fill="#ff8a7a" font-family="Menlo,monospace" font-size="14" font-weight="700">verdict: approve</text>
  <text x="24" y="234" fill="#8b90a0" font-family="Inter,Helvetica,sans-serif" font-size="14">Same response. The gate passes.</text>

  <text x="340" y="76" fill="#c9a2fb" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="700">COUNT IT IN CODE</text>
  <rect x="340" y="90" width="276" height="120" rx="8" fill="#1c2026" stroke="#a855f7" stroke-width="2"/>
  <text x="356" y="118" fill="#dfe2eb" font-family="Menlo,monospace" font-size="13">findings:</text>
  <text x="356" y="140" fill="#dfe2eb" font-family="Menlo,monospace" font-size="13">  - SQL injection</text>
  <text x="356" y="162" fill="#dfe2eb" font-family="Menlo,monospace" font-size="13">  - unchecked input</text>
  <text x="356" y="192" fill="#c9a2fb" font-family="Menlo,monospace" font-size="14" font-weight="700">count &gt; 0</text>
  <text x="340" y="234" fill="#8b90a0" font-family="Inter,Helvetica,sans-serif" font-size="14">Request changes. No vote.</text>

  <line x1="24" y1="266" x2="616" y2="266" stroke="#2a2f3a" stroke-width="1"/>
  <text x="24" y="298" fill="#dfe2eb" font-family="Inter,Helvetica,sans-serif" font-size="16" font-weight="600">The model is a good reporter and an unreliable judge</text>
  <text x="24" y="328" fill="#8b90a0" font-family="Inter,Helvetica,sans-serif" font-size="14">It found the injection. It described it correctly. Then it was asked to</text>
  <text x="24" y="350" fill="#8b90a0" font-family="Inter,Helvetica,sans-serif" font-size="14">summarise its own work, and "approve" is the tidiest summary there is.</text>
  <text x="24" y="382" fill="#ffb4ab" font-family="Inter,Helvetica,sans-serif" font-size="14" font-weight="700">Anything that gates a decision belongs in code, not in a summary.</text>
</svg>
