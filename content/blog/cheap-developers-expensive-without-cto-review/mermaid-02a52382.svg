on-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#faf7f2;fill:#faf7f2;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#cc342d;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#cc342d;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg .edgePaths path{stroke-width:2.25px;}#my-svg .edgeLabel{border-radius:6px;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .base&gt;*{fill:rgb(250, 247, 242)!important;stroke:rgb(85, 85, 85)!important;stroke-width:2px!important;color:rgb(26, 26, 26)!important;}#my-svg .base span{fill:rgb(250, 247, 242)!important;stroke:rgb(85, 85, 85)!important;stroke-width:2px!important;color:rgb(26, 26, 26)!important;}#my-svg .base tspan{fill:rgb(26, 26, 26)!important;}#my-svg .bad&gt;*{fill:rgb(255, 245, 245)!important;stroke:rgb(204, 52, 45)!important;stroke-width:2.5px!important;color:rgb(26, 26, 26)!important;}#my-svg .bad span{fill:rgb(255, 245, 245)!important;stroke:rgb(204, 52, 45)!important;stroke-width:2.5px!important;color:rgb(26, 26, 26)!important;}#my-svg .bad tspan{fill:rgb(26, 26, 26)!important;}#my-svg .ok&gt;*{fill:rgb(245, 233, 255)!important;stroke:rgb(124, 58, 237)!important;stroke-width:2.5px!important;color:rgb(26, 26, 26)!important;}#my-svg .ok span{fill:rgb(245, 233, 255)!important;stroke:rgb(124, 58, 237)!important;stroke-width:2.5px!important;color:rgb(26, 26, 26)!important;}#my-svg .ok tspan{fill:rgb(26, 26, 26)!important;}</style><g><marker id="my-svg_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-circleEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-da