<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 573px; background-color: transparent;" viewBox="0 0 573 510" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">One habit forks the cost of a cheap developer</title><desc id="chart-desc-my-svg">A cheap developer ships features that demo fine. From there the path splits. Left, in red: nobody senior reads what gets merged, and by month four it breaks and you pay a second time. Right, in purple: a senior reads every pull request, and the risky change gets caught before it ships.</desc><style>#my-svg{font-family:'Caveat','Patrick Hand','Comic Sans MS',cursive;font-size:20px;fill:#1a1a1a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(180, 100%, 100%);}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333;stroke:#333;}#my-svg .marker.cross{stroke:#333;}#my-svg svg{font-family:'Caveat','Patrick Hand','Comic Sans MS',cursive;font-size:20px;}#my-svg p{margin:0;}#my-svg .label{font-family:'Caveat','Patrick Hand','Comic Sans MS',cursive;color:#1a1a1a;}#my-svg .cluster-label text{fill:#000000;}#my-svg .cluster-label span{color:#000000;}#my-s