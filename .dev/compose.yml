---
# Simplified Docker Compose configuration for JetThoughts Hugo development
# Optimized for fast feedback loops with minimal complexity

services:
  hugo:
    # reg-node-git flavor: the dart-sass variant was discontinued upstream
    # after 0.161.1, and this site's CSS pipeline is PostCSS-only (no SCSS).
    image: hugomods/hugo:debian-reg-node-git-non-root-0.165.0
    working_dir: /app
    volumes:
      - ..:/app:delegated
      - hugo_cache:/tmp/hugo_cache
    ports:
      - '1313:1313'
    command: server --bind 0.0.0.0 --poll 500ms --disableFastRender=false
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache
      HUGO_NUMWORKERMULTIPLIER: 8
    restart: unless-stopped
    mem_limit: 2g
    cpus: '2.0'

  # Interactive shell (optimized)
  sh:
    image: jetthoughts.com-test:1.0.0
    # amd64, not the host arch: this image pins Chrome for Testing linux64
    # (.dev/cft-version) and records the linux/ screenshot baselines that CI
    # (ubuntu-latest = amd64) renders. Building/running arm64 downloads an
    # amd64 chrome it can only exec under emulation and drifts pixels from CI.
    platform: linux/amd64
    build:
      context: ../
      dockerfile: ./.dev/Dockerfile
      target: runtime
    working_dir: /app
    stdin_open: true
    tty: true
    volumes:
      - ..:/app:delegated
      - history:/usr/local/hist
    environment:
      HISTFILE: /usr/local/hist/.bash_history
      IRB_HISTFILE: /usr/local/hist/.irb_history
    command: sh

  # Test runner with optimized dependency management
  t:
    image: jetthoughts.com-test:1.0.0
    # amd64 to match CI's rendering (see `sh` service note above).
    platform: linux/amd64
    build:
      context: ../
      dockerfile: ./.dev/Dockerfile
      target: runtime
    working_dir: /app
    command: bin/test
    volumes:
      - ..:/app:delegated
      - hugo_cache_dtest:/tmp/hugo_cache_dtest
    environment:
      HUGO_DEFAULT_PATH: "_dest/public-dtest"
      HUGO_CACHEDIR: "/tmp/hugo_cache_dtest"
      CAPYBARA_SCREENSHOT_ON_FAILURE: "true"
      RUBY_THREAD_VM_STACK_SIZE: 1048576
    mem_limit: 2g
    cpus: '4.0'
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  node_modules:
    driver: local
  bundle:
    driver: local
  history:
    driver: local
  hugo_cache:
    driver: local
  hugo_cache_dtest:
    driver: local
