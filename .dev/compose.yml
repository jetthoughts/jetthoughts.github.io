---
# Simplified Docker Compose configuration for JetThoughts Hugo development
# Optimized for fast feedback loops with minimal complexity

services:
  hugo:
    # reg-node-git flavor: the dart-sass variant was discontinued upstream
    # after 0.161.1, and this site's CSS pipeline is PostCSS-only (no SCSS).
    image: hugomods/hugo:debian-reg-node-git-non-root-0.165.0
    working_dir: /app
    volumes:
      - ..:/app:delegated
      - hugo_cache:/tmp/hugo_cache
    ports:
      # Fixed 1313 let only one worktree run this service at a time.
      - '${HUGO_PORT:-1313}:1313'
    command: server --bind 0.0.0.0 --poll 500ms --disableFastRender=false
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache
      HUGO_NUMWORKERMULTIPLIER: 8
    restart: unless-stopped
    mem_limit: 2g
    cpus: '2.0'

  # Interactive shell (optimized)
  sh:
    image: jetthoughts.com-test:1.0.0
    # Follows the HOST arch since 2026-08-22. Chrome for Testing began
    # publishing linux-arm64 at 153 (.dev/cft-version pins 153.0.8010.5, the
    # first Beta with it), and the Dockerfile picks the matching build - so an
    # ARM Mac runs native instead of emulating amd64. CI moved to arm64
    # runners in the same change, so both sides still render alike.
    build:
      context: ../
      dockerfile: ./.dev/Dockerfile
      target: runtime
    working_dir: /app
    stdin_open: true
    tty: true
    volumes:
      - ..:/app:delegated
      # Anonymous mount, not a named volume: it shields the image's
      # Linux-built node_modules from the bind mount (the host's are
      # macOS binaries) without persisting stale modules between runs.
      - /app/node_modules
      - history:/usr/local/hist
    environment:
      HISTFILE: /usr/local/hist/.bash_history
      IRB_HISTFILE: /usr/local/hist/.irb_history
    command: sh

  # Test runner with optimized dependency management
  t:
    image: jetthoughts.com-test:1.0.0
    # Host arch, matching CI's arm64 runners (see `sh` service note above).
    build:
      context: ../
      dockerfile: ./.dev/Dockerfile
      target: runtime
    working_dir: /app
    command: bin/test
    volumes:
      - ..:/app:delegated
      # Anonymous mount, not a named volume: it shields the image's
      # Linux-built node_modules from the bind mount (the host's are
      # macOS binaries) without persisting stale modules between runs.
      - /app/node_modules
      - hugo_cache_dtest:/tmp/hugo_cache_dtest
    environment:
      HUGO_DEFAULT_PATH: "_dest/public-dtest"
      HUGO_CACHEDIR: "/tmp/hugo_cache_dtest"
      CAPYBARA_SCREENSHOT_ON_FAILURE: "true"
      RUBY_THREAD_VM_STACK_SIZE: 1048576
    # 4g was sized for amd64 EMULATION ("tab crashed" OOM at 2g). Native arm64
    # should need less; left at 4g until measured rather than guessed down.
    mem_limit: 4g
    cpus: '4.0'
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  history:
    driver: local
  hugo_cache:
    driver: local
  hugo_cache_dtest:
    driver: local
