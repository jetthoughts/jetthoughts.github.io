<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic font rendering for the visual-regression stack.

  Installed as /etc/fonts/local.conf in the .dev/Dockerfile test image and
  by bin/setup-test-env on bare-metal Linux. Screenshot baselines in
  test/fixtures/screenshots/linux/ are only comparable when every renderer
  uses these exact settings + the pinned Chrome for Testing build
  (.dev/cft-version) + the same font packages (fonts-noto-core,
  fonts-freefont-ttf, fonts-dejavu-core).
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>none</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
