<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="framings-title framings-desc">
  <title id="framings-title">Same $97, two ways to frame the button - pick one, never A/B test.</title>
  <desc id="framings-desc">Two side-by-side cards show the same ruby waitlist button written two ways. The outcome framing reads "Stop spending 4 hours on reconciliation - $97" and anchors the price to the problem it replaces. The risk-reduction framing reads "Reserve your spot - $97, refundable for 30 days" and reduces first-touch risk. Both charge the identical $97. Basis: one smoke-test price, only the wording differs.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .label { font-size: 20px; font-weight: 600; fill: #121212; }
      .cta   { font-size: 17px; font-weight: 600; fill: #ffffff; }
      .price { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .annot { font-size: 18px; font-weight: 400; fill: #555555; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="300" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="284" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="46" text-anchor="middle" class="gk title">Same $97, two ways to frame the button</text>
  <text x="360" y="78" text-anchor="middle" class="gk msg">Pick one framing; never A/B test a smoke test</text>

  <!-- Left card: outcome framing (neutral structure) -->
  <rect x="24" y="100" width="336" height="168" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <text x="192" y="132" text-anchor="middle" class="gk label">OUTCOME FRAMING</text>
  <rect x="40" y="146" width="304" height="70" rx="4" fill="#cc342d"/>
  <text x="192" y="174" text-anchor="middle" class="gk cta">Stop spending 4 hours</text>
  <text x="192" y="198" text-anchor="middle" class="gk price">on reconciliation - $97</text>
  <text x="192" y="246" text-anchor="middle" class="sys annot">anchors price to what it replaces</text>

  <!-- Right card: risk-reduction framing (neutral structure) -->
  <rect x="372" y="100" width="336" height="168" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <text x="540" y="132" text-anchor="middle" class="gk label">RISK-REDUCTION FRAMING</text>
  <rect x="388" y="146" width="304" height="70" rx="4" fill="#cc342d"/>
  <text x="540" y="174" text-anchor="middle" class="gk price">Reserve your spot - $97</text>
  <text x="540" y="198" text-anchor="middle" class="gk cta">refundable for 30 days</text>
  <text x="540" y="246" text-anchor="middle" class="sys annot">reduces first-touch risk</text>

  <!-- one basis line -->
  <text x="360" y="286" text-anchor="middle" class="sys basis">Basis: one smoke-test price of $97, only the wording differs</text>
</svg>
