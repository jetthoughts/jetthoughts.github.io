<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="find10-title find10-desc">
  <title id="find10-title">From your Lesson 1.1 hypothesis, four steps end in ten booked interviews.</title>
  <desc id="find10-desc">A left-to-right journey tracker on one line. It starts at your hypothesis from Lesson 1.1, then runs four numbered steps: 1 Map - paste your three sentences into Claude; 2 Read - where they already complain (marked ruby, the move most founders skip); 3 List - 30 named people; 4 Write - name their post. It ends at ten interviews booked on the calendar, marked green. Basis: the find-10 outreach journey, hypothesis to booked calls.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .step  { font-size: 20px; font-weight: 600; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .cap   { font-size: 18px; font-weight: 400; fill: #444444; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="fj-tri" viewBox="0 0 9 7" refX="7" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="320" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="304" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="48" text-anchor="middle" class="gk title">Read where they complain, then write</text>
  <text x="360" y="80" text-anchor="middle" class="gk msg">Hypothesis to ten booked interviews, in four steps</text>

  <!-- connector line through the nodes (structure, stroked ink) -->
  <line x1="80" y1="178" x2="632" y2="178" stroke="#3a3a3a" stroke-width="2" marker-end="url(#fj-tri)"/>

  <!-- step titles (above) -->
  <text x="80"  y="132" text-anchor="middle" class="gk step">Hypothesis</text>
  <text x="192" y="132" text-anchor="middle" class="gk step">Map</text>
  <text x="304" y="132" text-anchor="middle" class="gk step" fill="#cc342d">Read</text>
  <text x="416" y="132" text-anchor="middle" class="gk step">List</text>
  <text x="528" y="132" text-anchor="middle" class="gk step">Write</text>
  <text x="640" y="132" text-anchor="middle" class="gk step">10 booked</text>

  <!-- nodes on the line -->
  <circle cx="80"  cy="178" r="16" fill="#7d7d7d"/>
  <circle cx="192" cy="178" r="16" fill="#3a3a3a"/><text x="192" y="184" text-anchor="middle" class="gk num">1</text>
  <circle cx="304" cy="178" r="16" fill="#cc342d"/><text x="304" y="184" text-anchor="middle" class="gk num">2</text>
  <circle cx="416" cy="178" r="16" fill="#3a3a3a"/><text x="416" y="184" text-anchor="middle" class="gk num">3</text>
  <circle cx="528" cy="178" r="16" fill="#3a3a3a"/><text x="528" y="184" text-anchor="middle" class="gk num">4</text>
  <circle cx="640" cy="178" r="16" fill="#2e7d32"/>
  <path d="M632,178 l5,6 l11,-13" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- captions (below, two lines each) -->
  <text x="80"  y="214" text-anchor="middle" class="sys cap">your bet from</text>
  <text x="80"  y="236" text-anchor="middle" class="sys cap">Lesson 1.1</text>
  <text x="192" y="214" text-anchor="middle" class="sys cap">paste 3 lines</text>
  <text x="192" y="236" text-anchor="middle" class="sys cap">into Claude</text>
  <text x="304" y="214" text-anchor="middle" class="sys cap">where they</text>
  <text x="304" y="236" text-anchor="middle" class="sys cap">complain</text>
  <text x="416" y="214" text-anchor="middle" class="sys cap">30 named</text>
  <text x="416" y="236" text-anchor="middle" class="sys cap">people</text>
  <text x="528" y="214" text-anchor="middle" class="sys cap">name their</text>
  <text x="528" y="236" text-anchor="middle" class="sys cap">post</text>
  <text x="640" y="214" text-anchor="middle" class="sys cap">on the</text>
  <text x="640" y="236" text-anchor="middle" class="sys cap">calendar</text>

  <!-- one basis line -->
  <text x="360" y="298" text-anchor="middle" class="sys basis">Basis: the find-10 outreach journey - hypothesis to booked calls</text>
</svg>
