<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="rh-title rh-desc">
  <title id="rh-title">Send the warm buckets over three days, oldest relationship first, then read the reply gate.</title>
  <desc id="rh-desc">Three numbered day cards. Day 1: champions (5) plus hot (10), send today with the same Loom link. Day 2-3: warm (15), once Day 1 replies land. Day 4+: cold (20), once early replies settle. A green gate card reads: 10 or more replies logged and 3 to 5 demos booked; expect 15 to 25 replies from 50; fewer than 5 replies means tighten the opener before the next batch. Basis: 50 warm-network messages, sent oldest-relationship first.</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 24px; font-weight: 600; fill: #4a4a4a; }
      .day   { font-size: 20px; font-weight: 700; fill: #121212; }
      .num   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .buck  { font-size: 18px; font-weight: 400; fill: #222222; }
      .rule  { font-size: 18px; font-weight: 400; fill: #555555; }
      .gate  { font-size: 20px; font-weight: 700; fill: #2e7d32; }
      .gnote { font-size: 18px; font-weight: 400; fill: #333333; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="420" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="404" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="46" text-anchor="middle" class="gk title">Send champions first, cold last</text>
  <text x="360" y="78" text-anchor="middle" class="gk msg">A daily handful, oldest relationship first</text>

  <!-- three day cards (numbered) -->
  <!-- Day 1 (24,98) -->
  <g>
    <rect x="24" y="98" width="216" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="46" cy="124" r="13" fill="#121212"/>
    <text x="46" y="130" text-anchor="middle" class="gk num">1</text>
    <text x="68" y="130" class="gk day">Day 1</text>
    <text x="40" y="168" class="sys buck">Champions 5 + Hot 10</text>
    <text x="40" y="198" class="sys rule">Send today,</text>
    <text x="40" y="222" class="sys rule">same Loom link.</text>
  </g>
  <!-- Day 2-3 (252,98) -->
  <g>
    <rect x="252" y="98" width="216" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="274" cy="124" r="13" fill="#121212"/>
    <text x="274" y="130" text-anchor="middle" class="gk num">2</text>
    <text x="296" y="130" class="gk day">Day 2-3</text>
    <text x="268" y="168" class="sys buck">Warm 15</text>
    <text x="268" y="198" class="sys rule">Once Day 1</text>
    <text x="268" y="222" class="sys rule">replies land.</text>
  </g>
  <!-- Day 4+ (480,98) -->
  <g>
    <rect x="480" y="98" width="216" height="150" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="502" cy="124" r="13" fill="#121212"/>
    <text x="502" y="130" text-anchor="middle" class="gk num">3</text>
    <text x="524" y="130" class="gk day">Day 4+</text>
    <text x="496" y="168" class="sys buck">Cold 20</text>
    <text x="496" y="198" class="sys rule">Once early</text>
    <text x="496" y="222" class="sys rule">replies settle.</text>
  </g>

  <!-- success gate: green milestone -->
  <rect x="24" y="272" width="672" height="102" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="40" y="308" class="gk gate">Gate: 10+ replies logged, 3-5 demos booked</text>
  <text x="40" y="340" class="sys gnote">Expect 15-25 replies from 50. Fewer than 5? Tighten the opener first.</text>

  <!-- one basis line -->
  <text x="360" y="398" text-anchor="middle" class="sys basis">Basis: 50 warm-network messages, sent oldest-relationship first</text>
</svg>
