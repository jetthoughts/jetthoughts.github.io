<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="sc-title">
  <title id="sc-title">Five agency-AI questions on one card. For each, a green pass signal scores 1 point and a red fail signal scores 0. Score 2 or below out of 5 and do not sign.</title>
  <desc>Scorecard. Five questions, each with a green PASS signal (1 point) and a red FAIL signal (0 points). Q1 Workflow: pass is tools by version plus a real PR; fail is senior decides, no PR. Q2 Cost: pass is a dollar range plus pass-through in the SOW; fail is included in the rate. Q3 Verify: pass is opens a real PR and names checks; fail is we trust the model or CI. Q4 Slopsquatting: pass is allowlist or scanner and says the word; fail is our devs know the packages. Q5 Accountability: pass is a dated incident plus root cause; fail is never had one, not my job. Footer: score 2 or below out of 5, do not sign, no matter how good the pitch.</desc>
  <defs>
    <style>
      .h    { font-family: "Caveat", "Patrick Hand", "Comic Sans MS", cursive; }
      .title{ font-size: 46px; font-weight: 700; fill: #1a1a1a; filter: url(#soft); }
      .sub  { font-size: 23px; fill: #667085; }
      .hg   { font-size: 25px; font-weight: 700; fill: #2e9e4f; letter-spacing: .5px; filter: url(#gG); }
      .hr   { font-size: 25px; font-weight: 700; fill: #e5484d; letter-spacing: .5px; filter: url(#gR); }
      .qn   { font-size: 27px; font-weight: 700; fill: #2b7fff; }
      .qt   { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
      .cg   { font-size: 21px; fill: #1a6b34; }
      .cr   { font-size: 21px; fill: #b42318; }
      .pillG{ fill: #edfaf0; stroke: #57c06f; stroke-width: 2.5; filter: url(#soft); }
      .pillR{ fill: #fff1f0; stroke: #f2635a; stroke-width: 2.5; filter: url(#soft); }
      .foot { font-size: 28px; font-weight: 700; fill: #b42318; }
      .footc{ fill: #fff1f0; stroke: #e5484d; stroke-width: 3; filter: url(#soft); }
    </style>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a1a2e" flood-opacity="0.13"/></filter>
    <filter id="gG" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2e9e4f" flood-opacity="0.5"/></filter>
    <filter id="gR" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f2635a" flood-opacity="0.5"/></filter>
  </defs>

  <text x="360" y="56" text-anchor="middle" class="h title">Five Agency-AI Questions</text>
  <text x="360" y="92" text-anchor="middle" class="h sub">One point when the answer lands on Pass, zero on Fail</text>

  <text x="270" y="140" text-anchor="middle" class="h hg">PASS = 1</text>
  <text x="576" y="140" text-anchor="middle" class="h hr">FAIL = 0</text>

  <!-- rows -->
  <g transform="translate(0,158)">
    <text x="20" y="52" class="h qn">Q1</text><text x="20" y="78" class="h qt">Workflow</text>
    <rect x="132" y="16" width="288" height="86" rx="16" class="pillG"/><text x="150" y="52" class="h cg">Tools by version</text><text x="150" y="80" class="h cg">+ a real PR</text>
    <rect x="436" y="16" width="264" height="86" rx="16" class="pillR"/><text x="454" y="52" class="h cr">"Senior decides,"</text><text x="454" y="80" class="h cr">no PR</text>
  </g>
  <g transform="translate(0,278)">
    <text x="20" y="52" class="h qn">Q2</text><text x="20" y="78" class="h qt">Cost</text>
    <rect x="132" y="16" width="288" height="86" rx="16" class="pillG"/><text x="150" y="52" class="h cg">A $ range +</text><text x="150" y="80" class="h cg">pass-through in SOW</text>
    <rect x="436" y="16" width="264" height="86" rx="16" class="pillR"/><text x="454" y="66" class="h cr">"Included in the rate"</text>
  </g>
  <g transform="translate(0,398)">
    <text x="20" y="52" class="h qn">Q3</text><text x="20" y="78" class="h qt">Verify</text>
    <rect x="132" y="16" width="288" height="86" rx="16" class="pillG"/><text x="150" y="52" class="h cg">Opens a real PR,</text><text x="150" y="80" class="h cg">names the checks</text>
    <rect x="436" y="16" width="264" height="86" rx="16" class="pillR"/><text x="454" y="66" class="h cr">"We trust the model / CI"</text>
  </g>
  <g transform="translate(0,518)">
    <text x="20" y="52" class="h qn">Q4</text><text x="20" y="78" class="h qt">Packages</text>
    <rect x="132" y="16" width="288" height="86" rx="16" class="pillG"/><text x="150" y="52" class="h cg">Allowlist / scanner,</text><text x="150" y="80" class="h cg">says the word</text>
    <rect x="436" y="16" width="264" height="86" rx="16" class="pillR"/><text x="454" y="52" class="h cr">"Our devs know</text><text x="454" y="80" class="h cr">the packages"</text>
  </g>
  <g transform="translate(0,638)">
    <text x="20" y="52" class="h qn">Q5</text><text x="20" y="78" class="h qt">Owned it</text>
    <rect x="132" y="16" width="288" height="86" rx="16" class="pillG"/><text x="150" y="52" class="h cg">A dated incident</text><text x="150" y="80" class="h cg">+ root cause</text>
    <rect x="436" y="16" width="264" height="86" rx="16" class="pillR"/><text x="454" y="52" class="h cr">"Never had one" /</text><text x="454" y="80" class="h cr">not my job</text>
  </g>

  <!-- hero footer -->
  <rect x="60" y="792" width="600" height="120" rx="20" class="footc"/>
  <text x="360" y="842" text-anchor="middle" class="h foot">2 or below out of 5?</text>
  <text x="360" y="884" text-anchor="middle" class="h foot" font-size="24">Do not sign - no matter how good the pitch.</text>
</svg>
