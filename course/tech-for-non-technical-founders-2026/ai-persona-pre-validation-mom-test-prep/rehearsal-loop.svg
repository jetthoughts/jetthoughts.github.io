<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="rehloop-title rehloop-desc">
  <title id="rehloop-title">Three free Claude prompts sharpen the question list before you spend a real interview.</title>
  <desc id="rehloop-desc">A left-to-right flow. Input: your draft question list plus the customer blank from Lesson 1.1. Step 1 (Prompts 1-2): three ICP personas answer each draft question in-character. Step 2 (Prompt 3, marked ruby): Claude's out-of-character diagnosis of each question - the step where the learning happens. Step 3 (Prompts 4-5): surface objections and rewrite weak questions past-anchored. Output: 5-7 sharpened questions plus an Objection Tracker, ready for real interviews. Basis: a mock-interview rehearsal loop (Teresa Torres, Product Talk).</desc>
  <defs>
    <style>
      .gk    { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
      .sys   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #121212; letter-spacing: -0.4px; }
      .msg   { font-size: 22px; font-weight: 600; fill: #4a4a4a; }
      .label { font-size: 20px; font-weight: 600; fill: #121212; }
      .cap   { font-size: 17px; font-weight: 600; fill: #6a6a6a; }
      .num   { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .body  { font-size: 18px; font-weight: 400; fill: #333333; }
      .chip  { font-size: 18px; font-weight: 700; fill: #6a6a6a; }
      .ruby  { font-size: 18px; font-weight: 400; fill: #cc342d; }
      .basis { font-size: 17px; font-weight: 400; fill: #555555; }
    </style>
    <marker id="rl-tri" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- page tone + editorial card -->
  <rect width="720" height="430" fill="#faf7f2"/>
  <rect x="8" y="8" width="704" height="414" rx="6" fill="#ffffff" stroke="#ececec" stroke-width="1"/>

  <!-- title block: action title + one message -->
  <text x="360" y="48" text-anchor="middle" class="gk title">Rehearse before you spend a real interview</text>
  <text x="360" y="80" text-anchor="middle" class="gk msg">Three free Claude prompts sharpen the question list first</text>

  <!-- INPUT chip (dashed = neutral endpoint) -->
  <rect x="24" y="112" width="84" height="160" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="146" text-anchor="middle" class="gk chip">INPUT</text>
  <text x="66" y="180" text-anchor="middle" class="sys body">Draft</text>
  <text x="66" y="202" text-anchor="middle" class="sys body">Qs +</text>
  <text x="66" y="228" text-anchor="middle" class="sys body">customer</text>
  <text x="66" y="250" text-anchor="middle" class="sys body">blank</text>

  <!-- Step 1 -->
  <rect x="121" y="112" width="148" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="145" cy="136" r="13" fill="#3a3a3a"/>
  <text x="145" y="142" text-anchor="middle" class="gk num">1</text>
  <text x="167" y="141" class="gk cap">Prompts 1-2</text>
  <text x="137" y="176" class="gk label">Roleplay</text>
  <text x="137" y="204" class="sys body">3 personas</text>
  <text x="137" y="226" class="sys body">answer each</text>
  <text x="137" y="248" class="sys body">draft Q</text>

  <!-- Step 2 (ruby badge = the hero step, where the learning is) -->
  <rect x="282" y="112" width="148" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="306" cy="136" r="13" fill="#cc342d"/>
  <text x="306" y="142" text-anchor="middle" class="gk num">2</text>
  <text x="328" y="141" class="gk cap">Prompt 3</text>
  <text x="298" y="176" class="gk label">Diagnose</text>
  <text x="298" y="204" class="sys body">Claude reads</text>
  <text x="298" y="226" class="sys body">each Q out</text>
  <text x="298" y="248" class="sys body">of character</text>

  <!-- Step 3 -->
  <rect x="443" y="112" width="148" height="160" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="467" cy="136" r="13" fill="#3a3a3a"/>
  <text x="467" y="142" text-anchor="middle" class="gk num">3</text>
  <text x="489" y="141" class="gk cap">Prompts 4-5</text>
  <text x="459" y="176" class="gk label">Sharpen</text>
  <text x="459" y="204" class="sys body">Fix weak Qs,</text>
  <text x="459" y="226" class="sys body">rewrite them</text>
  <text x="459" y="248" class="sys body">past-anchored</text>

  <!-- OUTPUT chip (dashed = neutral endpoint) -->
  <rect x="604" y="112" width="92" height="160" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="650" y="146" text-anchor="middle" class="gk chip">OUTPUT</text>
  <text x="650" y="180" text-anchor="middle" class="sys body">5-7 sharp</text>
  <text x="650" y="202" text-anchor="middle" class="sys body">Qs +</text>
  <text x="650" y="228" text-anchor="middle" class="sys body">Objection</text>
  <text x="650" y="250" text-anchor="middle" class="sys body">Tracker</text>

  <!-- orthogonal connectors, filled triangle -->
  <g stroke="#3a3a3a" stroke-width="2" fill="none">
    <line x1="110" y1="192" x2="119" y2="192" marker-end="url(#rl-tri)"/>
    <line x1="271" y1="192" x2="280" y2="192" marker-end="url(#rl-tri)"/>
    <line x1="432" y1="192" x2="441" y2="192" marker-end="url(#rl-tri)"/>
    <line x1="593" y1="192" x2="602" y2="192" marker-end="url(#rl-tri)"/>
  </g>

  <!-- the one reading (ruby hero line) -->
  <text x="360" y="322" text-anchor="middle" class="sys ruby">The in-character answer is plausible by default -</text>
  <text x="360" y="348" text-anchor="middle" class="sys ruby">the out-of-character read is where you learn.</text>

  <!-- one basis line -->
  <text x="360" y="408" text-anchor="middle" class="sys basis">Basis: a mock-interview rehearsal loop (Teresa Torres, Product Talk)</text>
</svg>
